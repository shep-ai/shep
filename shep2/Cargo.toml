[workspace]
resolver = "2"
members = ["crates/shep-domain", "crates/shep-app", "crates/shep-infra", "crates/shep-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/shep-ai/shep"

[workspace.dependencies]
shep-domain = { path = "crates/shep-domain" }
shep-app = { path = "crates/shep-app" }
shep-infra = { path = "crates/shep-infra" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
clap = { version = "4", features = ["derive", "env"] }
rusqlite = { version = "0.32", features = ["bundled"] }
tempfile = "3"
assert_cmd = "2"
predicates = "3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
