[workspace]
resolver = "2"
members = [
  "crates/shep-domain",
  "crates/shep-app",
  "crates/shep-jsonrpc",
  "crates/shep-rpc",
  "crates/shep-infra",
  "crates/shep-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/shep-ai/shep"

[workspace.dependencies]
shep-domain = { path = "crates/shep-domain" }
shep-app = { path = "crates/shep-app" }
shep-infra = { path = "crates/shep-infra" }
shep-jsonrpc = { path = "crates/shep-jsonrpc" }
shep-rpc = { path = "crates/shep-rpc" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
thiserror = "2"
clap = { version = "4", features = ["derive", "env"] }
rusqlite = { version = "0.32", features = ["bundled"] }
tempfile = "3"
assert_cmd = "2"
predicates = "3"
portable-pty = "0.9"
vt100 = "0.16"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
