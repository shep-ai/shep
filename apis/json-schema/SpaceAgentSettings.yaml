$schema: https://json-schema.org/draft/2020-12/schema
$id: SpaceAgentSettings.yaml
type: object
properties:
  claudeConfigDir:
    type: string
    description: Absolute path used as CLAUDE_CONFIG_DIR, giving the space its own Claude login
  ghConfigDir:
    type: string
    description: Absolute path used as GH_CONFIG_DIR, giving the space its own GitHub CLI login
  gitAuthorName:
    type: string
    description: Git author and committer name for commits made by agents
  gitAuthorEmail:
    type: string
    description: Git author and committer email for commits made by agents
  awsProfile:
    type: string
    description: AWS profile used as AWS_PROFILE, for example for Bedrock
  useBedrock:
    type: boolean
    description: Route Claude Code through Amazon Bedrock (true), never (false), or inherit the host (unset)
  allowedAgentTypes:
    type: array
    items:
      $ref: AgentType.yaml
    description: Agent types allowed to run for this space; empty or unset allows every agent
  prCommentTrigger:
    $ref: PrCommentTrigger.yaml
    description: Which pull request comments shep addresses without being asked (spec 124); unset means Mention
  prCommentResolveThreads:
    type: boolean
    description: Resolve an inline review thread after changing code for it (spec 124); unset means no
  autoRuntimeActions:
    type: array
    items:
      $ref: RuntimeActionKind.yaml
    description: Runtime action kinds shep may run on an incident without asking (spec 129); unset means none
  docsFirst:
    type: boolean
    description: Agents write user-facing docs while planning and a change without docs waits for a person before merging (spec 131)
  docsPaths:
    type: array
    items:
      type: string
    description: Repository path prefixes that hold documentation, such as docs/ or README.md; docs/ and README.md when unset
description: Agent credentials, identity and allowed agents for the repositories of a space
