$schema: https://json-schema.org/draft/2020-12/schema
$id: TrackerConnection.yaml
type: object
properties:
  provider:
    $ref: TrackerProvider.yaml
    description: Which tracker
  name:
    type: string
    description: Display name
  slug:
    type: string
    description: CLI-friendly identifier, unique across connections
  spaceId:
    type: string
    description: The space the connection belongs to
  siteUrl:
    type: string
    description: Jira site URL such as https://acme.atlassian.net; unset for Linear
  accountEmail:
    type: string
    description: Jira account email used with the API token; unset for Linear
  accountName:
    type: string
    description: The tracker account name reported by the last successful check
  status:
    $ref: TrackerConnectionStatus.yaml
    description: Whether the credentials last worked
  lastError:
    type: string
    description: Why the last check or sync failed
  lastCheckedAt:
    type: string
    format: date-time
    description: When the credentials were last checked
required:
  - provider
  - name
  - slug
  - spaceId
  - status
allOf:
  - $ref: BaseEntity.yaml
description: A tracker account shep can read and write; the secret is stored encrypted outside the entity
