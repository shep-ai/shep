$schema: https://json-schema.org/draft/2020-12/schema
$id: Capability.yaml
type: object
properties:
  id:
    type: string
    description: Stable id, e.g. search_source_code
  title:
    type: string
    description: Title
  snippet:
    type: string
    description: Tier-1 snippet; always cheap
  tags:
    type: array
    items:
      type: string
    description: Tags for candidate retrieval
  risk:
    $ref: RiskClass.yaml
    description: Risk class
  implementationIds:
    type: array
    items:
      type: string
    description: Implementations satisfying the capability
required:
  - id
  - title
  - snippet
  - tags
  - risk
  - implementationIds
description: What can be done, independent of how (Tier-1 is the snippet)
