$schema: https://json-schema.org/draft/2020-12/schema
$id: HarnessEvalRun.yaml
type: object
properties:
  suite:
    type: string
    description: Suite name
  variants:
    type: array
    items:
      $ref: HarnessMode.yaml
    description: Variants compared
  repeats:
    type: integer
    minimum: -2147483648
    maximum: 2147483647
    description: Repeats per case and variant
  status:
    $ref: HarnessEvalRunStatus.yaml
    description: Status
  modelId:
    type: string
    description: Model id used by every variant
  error:
    type: string
    description: Error message when the run failed
  ownerPid:
    type: integer
    minimum: -2147483648
    maximum: 2147483647
    description: OS process running the eval; a run whose process exited is reported as failed
required:
  - suite
  - variants
  - repeats
  - status
allOf:
  - $ref: BaseEntity.yaml
description: "One eval run over a suite: cases × variants × repeats"
