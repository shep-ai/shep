$schema: https://json-schema.org/draft/2020-12/schema
$id: FeatureFlags.yaml
type: object
properties:
  envDeploy:
    type: boolean
    default: true
    description: Enable environment deployment features in the web UI
  debug:
    type: boolean
    default: false
    description: Enable debug UI elements and verbose client-side logging
  reactFileManager:
    type: boolean
    default: false
    description: Use the built-in React file manager instead of the native OS folder picker
  projects:
    type: boolean
    default: true
    description: Enable Projects pages and navigation (project management)
  codeReview:
    type: boolean
    default: true
    description: Enable AI-powered code review for pull requests
  collaboration:
    type: boolean
    default: true
    description: Enable agent collaboration, supervisor agent, and unified question pipeline (spec 093)
  bedrockIntegration:
    type: boolean
    default: true
    description: Enable project-bedrock memory integration UI and server actions (spec 098)
  whatsappDispatch:
    type: boolean
    default: false
    description: Enable WhatsApp-native task dispatch and interactive control (spec 101)
  aspm:
    type: boolean
    default: false
    description: "Enable the Application Security Posture Management (ASPM) module — /aspm web routes, `shep aspm` CLI command tree, and the posture SSE stream (spec 098). Off by default: ASPM is a separate product category users opt into (spec 133)."
  clusters:
    type: boolean
    default: false
    description: Enable Clusters navigation and Kubernetes cluster management in the web UI
  scheduledWorkflows:
    type: boolean
    default: false
    description: Enable scheduled workflows feature — workflow creation, scheduling, and execution
  githubImport:
    type: boolean
    default: true
    description: Enable GitHub repository import flow (clone, fork, and add to Shep)
  queryAwareHarness:
    type: boolean
    default: false
    description: "Enable the experimental query-aware agent harness: the Shep Harness agent, /harness pages, the feature Context tab and `shep harness` commands (spec 119)"
  spaces:
    type: boolean
    default: true
    description: "Software factory: spaces and product lines — /spaces and `shep space` (spec 120)"
  trackers:
    type: boolean
    default: true
    description: "Software factory: Linear and Jira tracker sync — /connections, `shep connection`, `shep sync` and the daemon sync loop (spec 122)"
  knowledge:
    type: boolean
    default: true
    description: "Software factory: Notion knowledge sources — `shep knowledge` and the daemon knowledge sync (spec 125)"
  signals:
    type: boolean
    default: true
    description: "Software factory: customer and incident signals — `shep signal` (spec 126)"
  opportunities:
    type: boolean
    default: true
    description: "Software factory: ranked opportunities — /opportunities and `shep opportunity` (spec 126)"
  feedback:
    type: boolean
    default: true
    description: "Software factory: feedback intake and themes — POST /api/feedback and `shep feedback` (spec 127)"
  discovery:
    type: boolean
    default: true
    description: "Software factory: agent discovery of opportunities — `shep discovery` and its daemon schedule (spec 128)"
  incidents:
    type: boolean
    default: true
    description: "Software factory: incident triage — /incidents, POST /api/alerts and `shep incident` (spec 129)"
  outcomes:
    type: boolean
    default: true
    description: "Software factory: shipped-work outcomes — `shep outcome` and the daemon outcome tracker (spec 130)"
  docsFirst:
    type: boolean
    default: true
    description: "Software factory: docs-first spaces — the docs-first space policy, planning instructions and merge gate (spec 131)"
  autopilot:
    type: boolean
    default: true
    description: "Software factory: autopilot — `shep autopilot` and the daemon autopilot pass (spec 132)"
  factory:
    type: boolean
    default: true
    description: "Software factory: factory status — /factory and `shep factory` (spec 132)"
required:
  - envDeploy
  - debug
  - reactFileManager
  - projects
  - codeReview
  - collaboration
  - bedrockIntegration
  - whatsappDispatch
  - aspm
  - clusters
  - scheduledWorkflows
  - githubImport
  - queryAwareHarness
  - spaces
  - trackers
  - knowledge
  - signals
  - opportunities
  - feedback
  - discovery
  - incidents
  - outcomes
  - docsFirst
  - autopilot
  - factory
description: Feature flag toggles for runtime feature control
