[extend]
# Use the default gitleaks config as the base
useDefault = true

[allowlist]
description = "Allow mock/test tokens in Storybook stories and test files"

paths = [
  '''\.stories\.tsx''',
  '''\.stories\.ts''',
  '''\.test\.ts''',
  '''\.test\.tsx''',
  '''__tests__''',
  '''__mocks__''',
  '''\.spec\.ts''',
]

regexTarget = "line"

regexes = [
  '''sk-test-''',
  '''test-token-''',
  '''mock-api-key''',
  '''fake-secret''',
]
