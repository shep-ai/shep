name: "query-aware-agent-harness"
number: 119
branch: "claude/sweet-heisenberg-2at9ie"
oneLiner: |-
  A shep-owned agent runtime in which canonical state is explicit and every model call gets a
  recorded, query-specific context plan, with tiered tool disclosure, deterministic permissions and
  a permanent baseline to measure it against
summary: |-
  Adapts the "Query-Aware Agent Harness" specification package (Jev engineering note + V0-V3 design)
  to shep's Clean Architecture. Shep today delegates every agent turn to an external CLI (Claude
  Code, Codex, Cursor, …) that owns its own loop, transcript, tool catalog and permission model;
  shep only controls the first prompt and a handful of flags. This feature adds a native,
  flag-gated agent type, `shep-harness`, whose loop shep owns: state lives in SQLite plus a
  content-addressed blob store, each model call is built from a persisted ContextPlan
  (hidden | short | long | full per chunk), tools are routed intent -> capability -> implementation
  with only the selected schema loaded, every write/side effect carries a persisted permission
  decision, and a transcript-first baseline mode runs on the same model and tools so the thesis is
  measured rather than asserted. It plugs into the existing SDLC graph through
  IAgentExecutorProvider (so every feature node can run on it), and adds `shep harness …` CLI
  commands, a /harness web section, a feature-drawer Context tab, effect-oriented permission
  prompts, decision explanations and a paired eval runner. V0 is specified task-by-task; V1-V3
  (conditional instructions/skills/MCP, context middleware for CLI agents, read-only subagents,
  routing and parallel writes) are staged as follow-up specs.
