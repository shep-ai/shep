  estimatedEffort: L
- id: task-30
  phaseId: phase-10
  title: Context tab, permission prompt, Why drawer, chunk viewer, SSE and canvas badge
  description: >-
    Add /api/harness-events SSE (cursor = after sequence, heartbeat, no replay) and the
    useHarnessEvents hook. The feature drawer gets a Context tab (visible only when a run used
    shep-harness) embedding TurnTimeline and ContextPlanTable (visibility pills, histogram, tokens vs
