    - CapabilityCatalog (Tier-1/2/3 sizes, source);
    - PolicyViewer (rules, recent decisions) and InstructionList.
    Server actions wrap the string-token use cases, each with a Storybook mock and stories for
    Default/Loading/Empty/Error.
  state: Todo
  dependencies: [task-26, task-28]
  acceptanceCriteria:
  - a user who just enabled the flag reaches every page from the sidebar (no URL typing)
  - every empty state has a working CTA (no "run shep …" text)
  - a pnpm build:storybook build succeeds with the new mocks
  tdd:
    red:
    - component unit tests; server-action tests (flag disabled → FeatureFlagDisabledError shape)
    green:
    - implement the pages, components, actions and mocks
    refactor:
