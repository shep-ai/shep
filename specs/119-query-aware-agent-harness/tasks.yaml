    - a canvas feature-node permission badge.
  state: Todo
  dependencies: [task-29]
  acceptanceCriteria:
  - a reconnect with the last sequence receives only newer events (no duplicates) and the listener count stays constant
  - approving from the drawer resolves the request and the running task continues (e2e with the scripted backend)
  - a hard-denied action renders with no approve button
  tdd:
