  estimatedEffort: M
# ───────────────────────── phase-11: Evals ─────────────────────────
- id: task-32
  phaseId: phase-11
  title: Component eval suites in CI
  description: >-
    evals/harness/component holds YAML cases and a Vitest runner:
    - permissions: action + resources + scope → expected effect; false-allow count must be 0;
    - capability routing: intent → expected capability, reporting top-1/top-k;
    - context recall: query + candidate chunks + required/optional/noise sets → required-evidence
      recall and irrelevant-token share;
    - instructions: repo layout → expected active set.
    All run with the deterministic decision provider.
  state: Todo
  dependencies: [task-15, task-12, task-19, task-17]
  acceptanceCriteria:
  - the suites run in pnpm test:unit with no network and fail CI on any false-allow or a recall drop below the stored floor
  - each suite prints a metrics summary
  tdd:
    red:
    - write the eval cases first (≥50 permission, ≥30 routing, ≥20 context, ≥10 instruction) with thresholds
    green:
    - implement the runner
    refactor:
    - shared case loader and report printer
  estimatedEffort: M
- id: task-33
  phaseId: phase-11
  title: Paired end-to-end eval runner, report, CLI and web Evals tab
  description: >-
    RunHarnessEvalSuite loops over case × variant (baseline, query-aware) × repeat. For each run it
    provisions the fixture repo into a temp dir (same snapshot), runs the harness non-interactively
    with the eval sandbox policy, and runs the success check command. It records success, input and
    output tokens, cached tokens, cost, wall time, turns, repeated reads/searches, visible/raw
    tool-output tokens and context recall. GetHarnessEvalReport pairs variants and flags quality
    regressions. It is exposed through `shep harness eval run|ls|report` and /harness/evals
    (launcher + report with recharts bars). A seed suite has 6 fixture cases.
  state: Todo
  dependencies: [task-27, task-29, task-32]
  acceptanceCriteria:
  - both variants use the identical model, tools, snapshot and task wording (asserted in the run record)
  - the report never shows an efficiency delta without the paired success/quality delta beside it; regressions are highlighted
  - missing cost is shown as n/a/partial, never summed as zero
  - the seed suite runs end-to-end in CI with the scripted backend
  tdd:
    red:
    - runner tests with the scripted backend; report-pairing tests; UI component tests
    green:
    - implement the runner, report, CLI, page and fixtures
    refactor:
    - share metric formatting with the usage command
  estimatedEffort: L
# ───────────────────────── phase-12: Hardening ─────────────────────────
- id: task-34
  phaseId: phase-12
  title: Acceptance suite, architecture guard, redaction, e2e and docs
  description: >-
    Add an acceptance test file mapping each spec success criterion to a test id. An architecture
    test asserts domain/application harness files import no ai, @ai-sdk/*, better-sqlite3,
    node:child_process or @modelcontextprotocol. Event and decision attributes are redacted via
