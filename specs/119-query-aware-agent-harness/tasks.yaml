  dependencies: [task-30, task-31, task-33]
  acceptanceCriteria:
  - every spec.yaml success criterion is linked to at least one passing test
  - pnpm validate, test:unit, test:int, build and build:storybook pass; the Playwright flow passes in dev and `shep ui` modes
  - docs describe the flows F1–F9 with CLI and web equivalents
  tdd:
    red:
    - the architecture import test and the acceptance mapping test (fails while any criterion is unmapped)
    green:
    - add the remaining tests, redaction and docs
    refactor:
    - prune dead code paths found by the acceptance pass
  estimatedEffort: M
totalEstimate: XL
openQuestions: []
content: |
  ## Summary

  34 tasks across 12 phases, delivered as six flag-gated PR slices (see plan.yaml "Delivery
  slices"). Phases 3, 4 and 5 parallelize after persistence. Phase 8 (prompt sections) can land any
  time after task-2.

  ## Acceptance Checklist

  - [ ] Harness core has no provider/SQLite/process imports (architecture test)
  - [ ] Kill/resume preserves state; no transcript replay; drift detected; unknown side effects not replayed
  - [ ] Every query-aware model call has a persisted ContextPlan; escalation never re-runs tools
  - [ ] Only selected Tier-2 schemas reach the model; invalid args fail before execution
  - [ ] Every write/side effect has a PermissionDecision; hard deny is unoverridable; prompts list effects
  - [ ] `explain` works for every DecisionKind; shadow decisions never enforced
  - [ ] Baseline and query-aware eval on identical inputs; the report pairs quality with efficiency
  - [ ] Flag-off behaviour is byte-identical (golden prompts, executor tests unchanged)
  - [ ] Every CLI verb has a reachable web surface; all 9 locales complete; stories for every component
