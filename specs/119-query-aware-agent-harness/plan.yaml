content: |
  ## Architecture Overview

  ```text
   CLI: shep harness …        Web: /harness, drawer Context tab       Feature-agent graph (unchanged)
          │                            │  server actions / SSE                 │ executeNode / implement / merge
          ▼                            ▼                                       ▼
   ┌───────────────────── application/use-cases/harness ─────┐     IAgentExecutorProvider
   │ Init · Run · Resume · Stop · List/Get · Explain · View  │           │ (settings.agent.type = shep-harness)
   │ Permissions · Capabilities · Metrics · Eval             │           ▼
   └──────────────────────────┬──────────────────────────────┘   HarnessAgentExecutor (infra, thin)
                              ▼                                          │ prompt + promptSections + callContext
   ┌──────────────── application/services/harness ───────────────────────▼──────────────────────┐
   │ HarnessRuntime ── TurnLoop (query-aware) | BaselineTurnLoop | shadow                          │
   │   ├─ ContextEngine ── CandidateRetriever ─ renderers ─ budget-fitter(domain) ─ ContextPlan    │
   │   ├─ CapabilityRegistry / CapabilityRouter (tiered disclosure)                                │
   │   ├─ PermissionService (policy → shadow AI → grants → ask/wait)                               │
   │   ├─ InstructionResolver · DecisionRecorder · ChunkWriter · SessionRestorer                   │
   └───────┬─────────────┬───────────────┬──────────────┬─────────────┬───────────────┬──────────┘
      ports│             │               │              │             │               │
   IDecisionProvider IHarnessModel  IToolExecutor   IPolicyEngine  IBlobStore     IHarness*Repository
   (registry: det,   Provider(AI SDK) (7 builtins)  ICommandInsp.  (~/.shep/objects) IHarnessEventLog
   openai-compat,     rerank, Jev)                                IRepoSnapshotter (SQLite ~/.shep/data)
  ```

  Dependency rule: `domain/harness` holds pure functions over generated types. `application`
  holds ports, services and use cases, and imports only the domain and ports. `infrastructure`
  holds adapters and the DI module `register-harness.ts`. Presentation reaches use cases only,
  by string token from the web.

  ## One Query-Aware Turn (TurnLoop)

  ```text
   1. load task state (store)            8. model returns: tool call | use_capability | expand_chunk | complete_task
   2. RepoSnapshot (capture or reuse)    9. use_capability → CapabilityRouter → implementation → load Tier-2 schema (next turn)
   3. InstructionResolver (pinned)      10. tool call → ajv validate → PermissionService (allow | ask→wait | deny)
   4. CandidateRetriever (≤ limit)      11. execute → raw → blob + ContextChunk (BEFORE rendering) → events
   5. IDecisionProvider.batch visibility 12. expand_chunk → new ChunkView from stored raw (no re-run)
   6. render → budget fit → ContextPlan  13. complete_task → HarnessTaskResult → task completed
   7. persist plan → ModelCall(start)     14. every step: HarnessEvent (sequence), decisions persisted
  ```

  Prompt shape: a **stable prefix** (runtime rules, hard-policy summary, Tier-1 capability
  snippets, pinned instructions) followed by a **dynamic tail** (task goal, planned chunk views,
  loaded Tier-2 schemas, the last model message). The prefix fingerprint is recorded in
  `CacheStrategy` (`stable_prefix`) so cached-token effects can be measured.

  Loop limits: `harness.maxTurns` (default 50), the node timeout and the abort signal. On limit,
  the task fails with a result, never a false success (spec 116 rule).

  ## Context Algorithm (V0)

  1. Candidates come from: the current task's prompt sections, pinned instructions, current
     diff/status, the last N tool results of the task, chunks whose paths or symbols match the
     query/goal, chunks linked by `derived_from`/`supersedes` edges, unresolved error chunks, and
     explicit path references in the goal. Superseded chunks drop out unless referenced.
  2. Visibility comes from one batched relevance scoring per turn (`score` for rerankers and
     heuristics, `choice` with logprobs for LLMs), mapped to bands:
     - score < `hideThreshold` (0.10) → hidden;
     - score < `longThreshold` (0.45) → short;
     - score < `fullThreshold` (0.80) → long;
     - otherwise → full.
     A chunk with no score (provider down) → `uncertainDefault` (long), with `degraded=true`.
     Pinned chunks, current-task chunks and user "include" overrides are forced visible. A
     model's `expand_chunk` request raises that chunk for the rest of the task, recorded with
     source `escalation`.
  3. Views are rendered by kind-specific renderers and cached by (chunk, visibility, query
     fingerprint, renderer version).
  4. Budget fit is a pure `budget-fitter`, applied in this order: reserve system + output +
     headroom → pinned → goal → policy-required → full/high-confidence → downgrade full→long→short
     by ascending priority → hide the lowest. Every change is recorded with a reason code; nothing
     is truncated silently.
  5. The plan is persisted with, per chunk: visibility, probability, renderer, tokens, reason code
     and source (deterministic | ai | policy | degraded).

  ## Data Model (tables, migrations 148–151)

  | Table | Key columns |
  | --- | --- |
  | harness_sessions | id, status, mode, repo_root, agent_run_id?, feature_id?, root_task_id?, budget_mode, created/updated |
  | harness_tasks | id, session_id, parent_task_id?, goal, normalized_goal, type, status, read_set, write_set, repo_snapshot_id, budget, dedupe_key, phase?, result_json?, result_chunk_id? |
  | harness_events | id, session_id, task_id?, sequence (UNIQUE per session), type, payload_json, payload_ref?, trace_id |
  | repo_snapshots | id, session_id, root, git_commit, working_tree_hash, staged_diff_hash, unstaged_diff_hash |
  | context_chunks | id, session_id, task_id?, kind, source_json, content_ref, content_hash, token_estimate, sensitivity, read_write, repo_snapshot_id?, supersedes?, superseded_by?, tags_json, metadata_json |
  | chunk_views | id, chunk_id, query_fingerprint, visibility, content_ref?, estimated_tokens, renderer_id, source_version |
  | context_plans | id, task_id, query, query_fingerprint, state_version, repo_snapshot_id, planned_chunks_json, instruction_ids_json, capability_ids_json, estimated_tokens, token_budget, cache_strategy_json, degraded, shadow |
  | harness_decisions | id, task_id?, kind, provider, model?, input_ref, result_json, probabilities_json?, confidence?, latency_ms, cost_usd?, enforced, shadow, degraded |
  | model_calls | id, task_id, model_id, context_plan_id, status, input/output/cached tokens, cost_usd, latency_ms, response_chunk_id |
  | harness_tool_calls | id, task_id, capability_id, implementation_id, arguments_ref, arguments_hash, permission_decision_id, status, raw_output_chunk_id, idempotency_key, started/completed |
  | permission_decisions | id, task_id, action_json, resources_json, effects_json, result, status(pending/resolved), deterministic_policy_ids, ai_decision_id?, reason_code, resolved_by?, scope?, expires_at? |
  | permission_grants | id, session_id, task_id?, scope, action_pattern, resource_pattern?, expires_at? |
  | harness_eval_runs / harness_eval_results | run: suite, variants, repeats, status; result: case_id, variant, repeat, success, scores_json, session_id, artifacts_json |

  Capabilities and instructions are **not** tables in V0. They are derived at runtime from the
  builtin tool source and the instruction files, and every plan and decision records the IDs and
  content hashes it used. Settings get flat `harness_*` columns, following the adaptive-model
  precedent, plus `feature_flag_query_aware_harness`.

  ## Implementation Strategy

  - **Inside-out, flag-gated.** Phases 1–2 give an inspectable store before any model is called.
    Phases 3–5 are independent adapters behind ports and parallelize. Phase 6 needs 3 (decisions)
    and 2 (chunks). Phase 7 assembles the loop. Phase 8 is independent of 3–7 (pure prompt
    refactor with golden tests) and can land early.
  - **Deterministic first.** Every subsystem works with the deterministic decision provider and
    the scripted model provider, so CI never needs network. LLM/Jev adapters are measured in
    shadow before enforcement.
  - **Flag-off is byte-identical.** Nothing in the SDLC path changes unless
    `settings.agent.type` (or the feature's agent) is `shep-harness`. The PromptSection refactor is
    proven identical by golden snapshot tests of every prompt builder.

  ## Delivery: Single Pull Request

  All of V0 ships as **one PR** from `claude/sweet-heisenberg-2at9ie` (this spec is its first
  commit). Size is managed by commit structure, not by splitting PRs:

  | Commit group | Tasks | Must be true at the end of the group |
  | --- | --- | --- |
  | G1 State core | 1–7 | kill/reopen persistence test green; `pnpm generate` clean |
  | G2 Decisions, tools, permissions | 8–15 | provider conformance suite green for every adapter; policy table tests green |
  | G3 Context engine + prompt sections | 16–19, 25 | a ContextPlan builds for a node prompt; golden prompts byte-identical |
  | G4 Runtime + CLI | 20–24, 26–27 | `shep harness run` fixes a fixture bug with the scripted backend; `feat new --agent shep-harness` completes |
  | G5 Web | 28–31 | `pnpm build:storybook` green; the flag reveals every surface |
  | G6 Evals + hardening | 32–34 | acceptance suite green; seed eval report produced with a real backend |

  Rules for the single PR:
  - Every commit group passes `pnpm validate`, `test:unit` and `test:int` locally before it is
    pushed. CI stays green on each push, never only at the end.
  - The flag is off by default, so a partially reviewed PR cannot change user behaviour.
  - The PR description carries a group-by-group review map (files, entry points, what to try).
    Reviewers can review per group via the commit ranges.
  - `feature.yaml` progress is updated per task, so the PR shows live status.
  - Real-model evals run with the owner's API key, supplied as an environment secret and never
    committed. CI uses the scripted backend and the deterministic decision provider.

  ## Roadmap Beyond V0 (separate specs, same flag until graduation)

  - **V1: conditional behaviour, richer safety, CLI-agent middleware.**
    - Instruction `when:` conditions (paths / task type / capability / branch) with
      activation/deactivation events.
    - SkillManifest over existing SKILL.md: the frontmatter is the Tier-1 snippet and the body is
      Tier-3 docs; skills attach capabilities and hooks.
    - MCP/plugin ToolSource from `mcp-server-manager`, with lexical/embedding top-N retrieval over
      large catalogs.
    - Tier-3 docs, tree-sitter outlines, script effect inspection, an `ISandbox` adapter, shadow
      AI permission judgment, and an optional `@ai-sdk/anthropic` adapter.
    - **Track M (context middleware for CLI agents):**
      - M1: compute ContextPlans over node PromptSections for *every* agent in shadow, and compare
        against PhaseTiming tokens.
      - M2: enforce rendered sections, and attach a `shep-context` MCP server (`expand_chunk`,
        `search_state`, `get_task_result`) through the existing `mcpConfigPath` channel so Claude
        Code, Codex and Gemini can escalate.
      - M3: a Claude Code PreToolUse hook calling `shep harness hook pre-tool-use`, so the
        deterministic policy governs CLI agents and replaces blanket
        `--dangerously-skip-permissions`. Spike first: hook injection via `--settings` and
        `ask` semantics in `-p` mode.
  - **V2: read-only subagents and shared retrieval.**
    - Child HarnessTasks with a dedupe key (normalized goal + scope + snapshot + type): reuse a
      completed match, join a running one.
    - Read-only parallelism.
    - A `RetrievalSnapshot` feeding background jobs after implement (review, test/eval generation,
      explanation, security). This complements `code-review` and ASPM; results are
      `background_result` chunks.
  - **V3: routing and parallel writes.**
    - The spec-110 complexity tiers become a `RouteEstimate`, including context-load,
      reintegration, cache-loss and retry costs.
    - Security-aware provider filtering by chunk sensitivity, and `--shadow-model-router` first.
    - Task-level worktrees inside a feature, reusing the worktree service, with serial patch merge
      and conflicts as blocked tasks.

  ## Testing Strategy (TDD: tests first)

  - **Domain (unit):** state-machine transition table (every illegal transition throws), budget
    fitter (pinned never dropped, downgrade order, reason codes), visibility ladder, fingerprints,
    permission precedence (hard deny beats everything).
  - **Persistence (integration, `SHEP_HOME` temp):** migrations up/down, repository round-trips,
    event sequence monotonic under concurrent appends, blob CAS dedupe/permissions, a kill/reopen
    test (child process killed after N events, state intact), and a drift test with a real temp
    git repo (gpgsign off).
  - **Adapters (unit):** each tool against a temp repo; ajv rejects bad arguments before the
    executor spy is called; command inspector table tests; YAML policy fixtures; decision
    providers with a stubbed model (no network).
  - **Runtime (integration):** `ScriptedHarnessModelProvider` drives full loops:
    - query-aware vs baseline on the same script;
    - escalation doesn't re-run the tool (executor spy count);
    - a permission ask→allow/deny/timeout;
    - degraded mode when the decision provider throws;
    - resume after a simulated crash mid tool call (unknown side effect → ask, never replayed).
  - **Executor contract:** the harness executor passes the shared IAgentExecutor contract tests
    (stream error → reject, no terminal event → reject, max turns → reject).
  - **Feature agent:** golden snapshots prove every prompt builder renders byte-identical
    strings; a parametrised test proves promptSections/callContext reach every executor call
    site.
  - **Presentation:** CLI command tests with the DI-override pattern (`usage.command.ts`); web
    component unit tests plus Storybook stories (Default/Loading/Error/Empty + permission
    variants); a server-action test per action; one Playwright flow (flag → settings → standalone
    run with scripted backend → approve → Context tab → Why drawer).
  - **Evals:** component suites run as Vitest in CI; the paired e2e runner is exercised with the
    scripted backend in CI, and real-model runs are manual/nightly.

  ## Risk Mitigation

  | Risk | Mitigation |
  | --- | --- |
  | Harness coding quality below mature CLI agents | experimental flag; the thesis is measured harness-baseline vs harness-query-aware; Claude Code is only an informational reference column |
  | Over-aggressive hiding causes extra turns | conservative thresholds, `uncertain → long`, pinned/current-task forced visible; evals report turns and required-evidence recall; shadow mode before enforcement |
  | Decision cost/latency per turn | deterministic default; one batched call per turn; candidate cap; decisions carry latency/cost and are summed in the report |
  | Blocking permission wait stalls a feature | stage timeout → deny with reason; notification + canvas badge + inbox; the non-interactive policy resolves ask→deny |
  | Secrets leak into prompts or blobs | hard-deny default paths; `secret` sensitivity never rendered; redacted events; blob file modes |
  | Unknown side effects replayed after crash | idempotency key + args hash per ToolCall; `running` at restart → `unknown` → ask |
  | Scope creep (spec lists V1–V3 ideas) | V0 is exactly tasks 1–34; later versions are separate specs; ADR required before any irreversible V0 deviation |
  | SQLite growth | CAS dedupe; views cached by fingerprint; retention integration in V1 |
  | Name collisions (Task, Session, Tool) | Harness-prefixed entities; `shep harness` CLI group |
  | Windows paths | `path.isAbsolute`/`path.relative` for outside-repo checks; no shell-specific assumptions in tools (lessons) |

  ## Clean Architecture Compliance

  The harness follows shep's Clean Architecture:
  - **Domain** (`domain/harness/`) is pure.
  - **Application** (`application/services|use-cases|ports/output/harness/`) reaches models,
    tools, storage, policy, git and the file system only through ports.
  - **Infrastructure** implements those ports.
  - **CLI and web** call use cases (web through server actions).

  `tests/unit/architecture/harness-dependency-rule.test.ts` enforces this:
  - no infrastructure or provider-SDK import in the harness application layer;
  - no non-domain import in `domain/harness`;
  - no container or infrastructure import in the web harness components.

  ## Implementation Notes and Deviations (V0, as built)

  - **Prompt sections (task-25).** Derived from the rendered prompt's Markdown headings, so each
    section is byte-identical to the prompt. The prompt builders were not refactored.
    `callContext` is threaded through `buildExecutorOptions`.
  - **Storage.** Harness tables are JSON documents (indexed columns plus a `data` JSON column).
    The harness config is one `settings.harness_config` JSON column.
  - **Tool loading.** `use_capability` accepts `args` and calls the tool in the same turn
    (load-and-call), and the Tier-1 catalog lists parameter names. The paired eval showed the
    load-only form cost an extra turn on every tool's first use.
  - **Size cap.** `HarnessContextConfig.fullTokenCap` (default 4,000): a chunk over the cap gets
    its long view unless the agent expands it. Long views of dense matches are bounded
    (rare-token ranking, at most 160 lines). The long-output paired eval case measures this.
  - **Tool-call-only responses** are kept for audit but tagged `ledger_only`, so they never
    re-enter context; the ledger already records them.
  - **`gh` publishing.** `gh pr create|merge`, releases and repo publishing are `git_push`
    effects, so `deny-git-push` covers them.
  - **Repository setup** lives in /harness → "Set up a repository" (a repository picker with
    preview and confirm), not in the repository drawer.
  - **Not in V0:**
    - the canvas pending-approval badge (the drawer banner and the Approvals inbox cover it);
    - "Save as context eval case" in the Why drawer (`shep harness eval save` saves a whole
      standalone session as a task case).
  - **Conditional instructions** (`when`) are parsed and reported inactive until V1.
