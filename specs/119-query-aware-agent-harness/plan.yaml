name: "query-aware-agent-harness"
summary: |-
  Twelve phases, built inside-out, each RED-first:
  1. Domain
  2. Persistence
  3. Decisions
  4. Tools and capabilities
  5. Permissions
  6. Context engine
  7. Runtime and executor
  8. Feature-agent prompt sections
  9. Use cases and CLI
  10. Web
  11. Evals
  12. Hardening and docs
  Phases 3/4/5 and 6/8 can run in parallel once persistence lands. Everything ships behind
  `featureFlags.queryAwareHarness` in ONE pull request, built as ordered commit groups that are each green.
relatedFeatures:
  - "102-shep-brain"
  - "110-adaptive-model-selection"
  - "116-agent-harness-reliability"
technologies:
  - "TypeScript"
  - "TypeSpec"
  - "Vercel AI SDK v6"
  - "better-sqlite3"
  - "Next.js"
  - "Vitest"
  - "Playwright"
relatedLinks: []
phases:
  - id: phase-1
    name: "Domain: TypeSpec models and pure harness rules"
    description: "Enums, entities, value objects, HarnessConfig, the feature flag, AgentType.ShepHarness plus its catalog row; pure rules (task state machine, visibility ladder, budget fitter, fingerprints, permission precedence)."
    parallel: false
    taskIds: ["task-1", "task-2", "task-3"]
  - id: phase-2
    name: "Persistence: blob store, tables, event log, snapshots"
    description: "CAS blob store, migrations 148+, repositories and mappers, the append-only event log with per-session sequence, and the git repo snapshotter."
    parallel: false
    taskIds: ["task-4", "task-5", "task-6", "task-7"]
  - id: phase-3
    name: "Decision layer"
    description: "IDecisionProvider, provider registry with per-decision-kind routing, the deterministic, openai-compatible (open-source LLM servers), reranker, structured-llm and optional Jev adapters, a shared conformance suite, the fallback chain, and persisted decisions."
    parallel: true
    taskIds: ["task-8", "task-9"]
  - id: phase-4
    name: "Tools and capability routing"
    description: "Seven builtin tools, raw output persisted as chunks before rendering, the capability registry with tiered disclosure, ajv validation, and the capability router."
    parallel: true
    taskIds: ["task-10", "task-11", "task-12"]
  - id: phase-5
    name: "Permissions"
    description: "YAML policy engine, command effect inspector, permission service with grants and the pending-request wait/resolve flow."
    parallel: true
    taskIds: ["task-13", "task-14", "task-15"]
  - id: phase-6
    name: "Context engine"
    description: "Chunk renderers, instruction source, candidate retrieval, and ContextEngine.build (visibility, budget fit, stable prefix, persistence, degraded and shadow modes)."
    parallel: false
    taskIds: ["task-16", "task-17", "task-18", "task-19"]
  - id: phase-7
    name: "Runtime loop and executor"
    description: "Extracted LanguageModelFactory plus the AI-SDK harness model provider, the query-aware turn loop, baseline and shadow modes, restart/resume, the HarnessAgentExecutor and DI module."
    parallel: false
    taskIds: ["task-20", "task-21", "task-22", "task-23", "task-24"]
  - id: phase-8
    name: "Feature-agent integration"
    description: "Prompt builders emit PromptSection[] (byte-identical rendered string); promptSections and callContext are threaded to every executor call site."
    parallel: true
    taskIds: ["task-25"]
  - id: phase-9
    name: "Use cases and CLI"
    description: "Init/run/resume/inspect/explain/permissions/capabilities use cases with string tokens; the `shep harness` command group; doctor diagnostics."
    parallel: false
    taskIds: ["task-26", "task-27"]
  - id: phase-10
    name: "Web UI"
    description: "Settings plus the flag, the /harness section, the feature drawer Context tab, permission prompts, the decision Why drawer, the chunk viewer, SSE, and the repository setup dialog."
    parallel: false
    taskIds: ["task-28", "task-29", "task-30", "task-31"]
  - id: phase-11
    name: "Evaluation"
    description: "Component eval suites in CI (deterministic provider) and the paired end-to-end runner with report, CLI and web Evals tab."
    parallel: false
    taskIds: ["task-32", "task-33"]
  - id: phase-12
    name: "Hardening, acceptance and docs"
    description: "Acceptance suite mapped 1:1 to spec criteria, architecture import test, redaction, Playwright happy path, and docs."
    parallel: false
    taskIds: ["task-34"]
