# Markdown content (the actual spec)
content: |
  ## Problem Statement

  Users need the ability to route their LLM requests through a local proxy, specifically `llmproxy`, which typically runs on `localhost:4000`. This allows for local caching, custom routing, testing, and modifying LLM calls without changing the core shep codebase. The system currently supports various agents and providers (like OpenRouter, Ollama) but lacks explicit support for a generic OpenAI-compatible proxy endpoint configurable for `llmproxy`.

  ## Success Criteria

  - [ ] `llmproxy` is added as a supported `AgentType` in the TypeSpec definitions.
  - [ ] An `LlmProxyExecutorService` is implemented to execute agent tasks via the local proxy.
  - [ ] The `AgentExecutorFactory` is updated to instantiate and support the new executor.
  - [ ] Users can configure shep to use `llmproxy` and it successfully connects to `localhost:4000`.

  ## Affected Areas

  | Area       | Impact       | Reasoning       |
  | ---------- | ------------ | --------------- |
  | TypeSpec   | Low          | Need to add `llmproxy` to `AgentType` enum in `agent-config.tsp`. |
  | Domain     | Low          | Generated types will update from TypeSpec compilation. |
  | Infra/Agents | Medium     | New executor service `LlmProxyExecutorService` needs to be created and wired into `AgentExecutorFactory`. |

  ## Dependencies

  None identified.

  ## Size Estimate

  **S** - This requires adding a new agent provider which follows a well-established pattern in the codebase. We already have SDK-based executors (like Ollama and OpenRouter) that can serve as templates.

