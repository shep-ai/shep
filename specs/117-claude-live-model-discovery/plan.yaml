content: |
  ## Architecture Overview

  ```
  web picker / validation ─▶ IAgentExecutorFactory.listAvailableModels(ClaudeCode)
                                   │
                                   ▼
                  ClaudeCodeModelCatalogService (TtlModelCatalog: 1h cache, last-good)
                     1. listApiModels()  ── GET /v1/models (anthropic-models-api.ts)
                     2. listCliModels()  ── claude -p /model  (existing alias parser)
                     └─ merge with AGENT_CATALOG[ClaudeCode].models (hardcoded floor)
                                   │ empty
                                   ▼
                  factory fallback: getSupportedModels(ClaudeCode)
  ```

  Tier (`getModelTierInfo`) and display name (`getModelMeta`) consult their tables first, then
  the Claude id shape.

  ## Implementation Strategy

  Phase 1 is pure functions with no I/O, so it lands first and makes any id Phase 2 discovers
  immediately routable and readable. Phase 2 adds the API source behind injectable functions
  (fetch, env) so tests never reach the network. Phase 3 refreshes the static floor last so the
  lists, mocks and assertions change in one diff.

  ## Files to Create/Modify

  See `filesToCreate` / `filesToModify`.

  ## Testing Strategy (TDD: Tests FIRST)

  - Unit (domain): tier shape fallback — opus/fable/mythos/sonnet/haiku, dated and dotted forms,
    table precedence, non-Claude unknown stays undefined.
  - Unit (web lib): display fallback for `claude-opus-5-5`, dated and unknown ids.
  - Unit (infrastructure): credentials resolution per env combination; pagination; header choice;
    base URL; non-OK → throws; mapping of display name/context; catalog order API → CLI → []
    with stubbed fetch and CLI functions; snapshot collapsing.
  - Existing factory / catalog tests updated for the new static list.

  ## Risk Mitigation

  | Risk | Mitigation |
  | --- | --- |
  | API lists legacy models, cluttering the picker | Account-scoped list is the truth; dated snapshots collapse onto catalog ids |
  | Gateway at `ANTHROPIC_BASE_URL` lacks `/v1/models` | Non-OK throws, catalog falls back to the CLI probe |
  | Unit test hits the network when a dev has a key | Catalog takes injected `listApiModels`; tests always pass stubs |
  | Shape fallback misclassifies a provider variant | Explicit table entries still win; fallback only for `claude-` ids naming a known family |
