name: "claude-live-model-discovery"
number: 117
branch: "claude/great-johnson-vwiwf1"
oneLiner: |-
  Ask Anthropic's Models API which Claude models exist, falling back to the Claude CLI aliases and then the hardcoded catalog, so new Claude releases appear without a code change
summary: |-
  Shep missed Claude Opus 5.5 because every Claude model id is hand-maintained: the Claude Code
  catalog only learns aliases from `claude -p /model` and maps them through a fixed alias table,
  and adaptive tiers and display names come from fixed tables too. This feature lists models from
  `GET /v1/models` whenever Anthropic credentials are available, keeps the CLI alias probe and the
  hardcoded list as ordered fallbacks, and derives tier and display name for any Claude id from its
  shape so a model discovered at runtime is routable and readable.
