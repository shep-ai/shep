# Feature Specification (YAML)
# Source of truth for Spec 111 - Fleet Control Plane

name: "fleet-control-plane"
number: 111
branch: "feat/111-fleet-control-plane"
oneLiner: "Scale to 50+ parallel agents with exception-based triage, deterministic guardrail auto-approvals, and fleet circuit breaker"
summary: >
  Extends Shep's parallel agent orchestration to large fleets (50+ active/queued features).
  PR #847 ("limit the maximum number of parallel running features", spec 110) added admission
  queuing via workflow.maxParallelFeatures. It has since MERGED, so the admission queue this
  spec was written to stand apart from now exists on main and the circuit breaker can drive it.
  This feature solves the human attention bottleneck and operational safety via: (1)
  Exception-Based Fleet Triage which filters out the 80% cruising features to surface only items
  needing human action; (2) Guardrailed Auto-Approval rules allowing deterministic,
  criteria-based gate auto-approvals without blind autonomy; and (3) Fleet Circuit Breaker &
  Batch Actions to prevent runaway loops, cascade failures, and repetitive manual operations.

phase: "Requirements"
sizeEstimate: "L"

