  ## Dependencies

  - **Existing Application + Repository entities** — ASPM findings attach to
    these as their primary "asset" anchor. `Application` will be extended via
    TypeSpec with optional ASPM-relevant context (criticality, businessUnit,
    exposure, dataClassification) using an idempotent ALTER migration with
    safe defaults.
  - **Existing WorkItem entity** — `SecurityFinding` carries an optional
    `workItemId` so findings can route into the engineering backlog via the
    `convert-finding-to-work-item` use case.
  - **TypeSpec compile pipeline** (`pnpm tsp:compile`) — required to regenerate
    `domain/generated/output.ts` after each new entity/enum.
  - **SQLite migration runner** — every new table needs a numbered, idempotent
    migration with safe defaults.
  - **DI container bootstrap** (`infrastructure/di/container.ts`) — must invoke
    a new `register-aspm` module after migrations run.
  - **Existing `IAgentExecutorProvider`** — needed for any optional AI-assisted
    triage or AI-change risk classification; provider-specific code must stay
    inside infrastructure adapters.
  - **External data sources (consumed via ports)** — CISA KEV catalog, FIRST
    EPSS scores, optional CVE metadata; SARIF and CycloneDX documents from CI
    scanners. Concrete adapters can land incrementally (stub-friendly via the
    port interfaces); use-case layer must work against the ports from day one.
  - **Web UI primitives** — shadcn/ui Table, Card, Tabs, Badge, Dialog,
    Sheet, Progress; existing SSE pattern for live posture updates.

  ## Size Estimate

  **XL** — This is a new vertical slice on the scale of Shep's existing Features,
  Cycles, or Cloud-Deploy modules, *combined*. With requirements pinned, the
  scope concretely involves:

  - ~12–14 new TypeSpec entities + supporting enums/value objects + extending
    `Application` with four optional fields.
  - ~12 new SQLite migrations and matching repositories with mappers and
    cross-platform path/identifier handling.
  - 35+ use cases across ingestion, prioritization, ownership, campaigns, SLA,
    compliance, exceptions, AI-change review, and executive aggregation —
    every one of them TDD-first.
  - ~9 new web routes/pages and a feature folder of components, each with
    Storybook stories (Default/Loading/Error + variants).
  - New CLI command surface (6 subcommands × multiple verbs).
  - New integration ports + at least stub adapters (SARIF, CycloneDX, KEV,
    EPSS, ownership-yaml reader).
  - Documentation updates and e2e coverage.

  Even with the explicit MVP carve-outs (no scanning engine, no GRC replacement,
  no runtime protection, no auto-fix, no pentest automation, no graph view,
  no per-BU permissions), the in-scope MVP — extended asset/ownership model,
  unified findings ingestion, transparent risk scoring, campaigns, SLA, risk
  exceptions, executive reporting, developer task routing, AI-change review
  queue, and OWASP ASVS/CWE compliance surface — is multi-week. Recommend
  splitting the implementation plan into staged epics:

  1. Asset + ownership model (extend Application + Owner/Team/BU + ownership
     resolution use cases).
  2. Findings ingestion + unified view (IFindingIngestPort + SARIF + Finding
     entity + list use case + findings table).
  3. SBOM + exploit intel (ISbomPort + IExploitIntelPort + KEV/EPSS adapters).
  4. Risk scoring + prioritization (RiskScore + compute/rank use cases +
     finding detail panel).
  5. Campaigns + SLA + exceptions (Campaign/SecurityPolicy/RiskException +
     campaign board + dashboard tiles).
  6. Executive dashboards + developer routing (posture summary + risk trend +
     convert-finding-to-work-item).
  7. AI-change review queue (AiChangeRiskSignal + record/graduate/dismiss +
     /aspm/ai-review).
  8. Compliance/governance surface (ComplianceControl + coverage view).

  Each epic is independently shippable behind the same `/aspm` area.
