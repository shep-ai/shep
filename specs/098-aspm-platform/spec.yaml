oneLiner: "Add an Application Security Posture Management (ASPM) module to Shep that unifies application risk across code, cloud, APIs, dependencies, secrets, and AI-generated changes with ownership, prioritization, and remediation workflows."
summary: >
  Introduce ASPM as a first-class capability inside Shep. The MVP adds a new
  domain area covering security assets (applications/services/repositories/APIs/cloud
  environments), unified findings, an exposure/criticality-aware risk score, owner
  mapping, remediation campaigns, executive dashboards, developer task routing, and
  basic AI-generated code risk signals — wired through Shep's TypeSpec-first /
  Clean Architecture stack and exposed via the Next.js web UI and CLI.
