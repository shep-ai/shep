  ## Non-Functional Requirements

  - **NFR-1 (Architecture)**: Strict Clean Architecture compliance —
    application and presentation layers never import from `infrastructure/`.
    All ASPM dependencies are accessed via tsyringe-injected ports identified
    by string tokens (`'IFindingRepository'`, `'IExploitIntelPort'`, etc.).
    Architecture rule enforced by code review and (where possible) linter.
  - **NFR-2 (TypeSpec-first)**: All ASPM domain types are authored in `tsp/`.
    The generated `packages/core/src/domain/generated/output.ts` is never
    hand-edited. `pnpm tsp:compile` is idempotent.
  - **NFR-3 (TDD)**: Every use case has at least one failing test written
    before implementation. Risk-score computation has a golden-file test
    asserting determinism across multiple fixture inputs.
  - **NFR-4 (Agent-agnostic)**: No ASPM module imports a provider SDK
    (Anthropic, OpenAI, etc.) outside of `infrastructure/`. Any LLM-assisted
    feature routes through `IAgentExecutorProvider`.
  - **NFR-5 (Storybook)**: Every web component under
    `components/features/aspm/` has a colocated `*.stories.tsx` with Default,
    Loading, and Error states. CI rejects PRs missing stories.
  - **NFR-6 (Performance — Ingestion)**: A 10,000-finding SARIF file ingests
    in under 30 seconds on a developer laptop; ingestion runs in a transaction
    and rolls back on failure.
  - **NFR-7 (Performance — Dashboards)**: `/aspm` dashboard initial paint
    completes in under 1 second with up to 50,000 findings in the database.
    Achieved via indexed columns (applicationId, canonicalSeverity, state,
    discoveredAt, ownerId, cveId) and aggregate caching where needed.
  - **NFR-8 (Performance — Findings table)**: Paginated findings list (25 per
    page, sorted by risk score desc) returns in under 300 ms on a 50k-finding
    dataset.
  - **NFR-9 (Determinism)**: Risk scoring, SLA state, and ownership resolution
    are pure functions. No `Date.now()`, no random, no environment access in
    the domain layer. Time is supplied via `ISlaClockPort`.
  - **NFR-10 (Determinism — Ingestion)**: Re-ingesting an identical scanner
    document is a no-op (zero new rows). The dedup key is stable across runs.
  - **NFR-11 (Cross-platform paths)**: All location paths are normalized to
    POSIX-style separators before persisting (per existing repository
    convention; ensures Windows/Linux/macOS portability).
  - **NFR-12 (Soft-delete + audit)**: Findings, campaigns, exceptions, and
    owners all extend `SoftDeletableEntity`. State changes append to an
    immutable audit log; nothing is destructively lost.
  - **NFR-13 (Security — Data handling)**: Scanner-supplied raw documents may
    contain secrets (e.g., a SAST finding that includes a key snippet). MVP
    must redact obvious secret patterns (high-entropy strings, AWS/GCP key
    shapes, common API token prefixes) in `description` and `scannerRaw`
    before persisting. Full raw is hashed and stored as a reference only.
  - **NFR-14 (Security — Adapter robustness)**: SARIF/CycloneDX parsers must
    not crash on malformed input, must enforce a max-size guard (default
    100 MB), and must reject documents that exceed it with a clean error.
  - **NFR-15 (Observability)**: Every ingestion run emits a structured audit
    record (source, file hash, counts: new/updated/duplicate, duration).
    Surfaced in the dashboard's "last ingested" tile and via
    `shep aspm ingest --json` output.
  - **NFR-16 (Accessibility)**: All new web components meet WCAG 2.1 AA:
    keyboard navigation, focus order, colour-contrast ratios, screen-reader
    labels on icon-only buttons (severity badges, KEV flag).
  - **NFR-17 (Storybook coverage)**: Findings table, finding detail panel,
    campaign board, posture cards, owner map, AI-review queue each have
    Storybook stories that include realistic mock data covering at least
    Critical / High / Medium / Low + KEV + exception + AI-graduated cases.
  - **NFR-18 (Migration safety)**: All ASPM migrations use idempotent
    DDL patterns from `LESSONS.md` (CREATE TABLE IF NOT EXISTS, safe
    defaults on ALTER, no destructive ops). Re-running the migration runner
    is a no-op.
  - **NFR-19 (File length)**: No new file exceeds ~300 lines (per
    `.claude/rules/code-quality.md`). Use cases stay single-purpose; large
    domain logic decomposes into named helpers.
  - **NFR-20 (Test coverage gate)**: Unit-test coverage for the new
    `application/use-cases/aspm/` directory must meet or exceed the
    repository's current average for `application/use-cases/`.

  ## Product Questions & AI Recommendations

  | # | Question | AI Recommendation | Rationale |
  | - | -------- | ----------------- | --------- |
  | 1 | Asset model: extend Application vs. new SecurityAsset? | Extend Application via TSP | Application is already the operational anchor; extending it keeps risk on the same object engineers and AppSec already work with and avoids duplicate ownership/exposure plumbing. |
  | 2 | Risk-scoring approach? | Transparent composite (CVSS + EPSS + KEV + exposure + criticality) | Explainable, auditable, testable, and the only option that delivers ASPM's core promise of prioritizing what matters. |
  | 3 | Ingestion formats for MVP? | SARIF + CycloneDX SBOM | Two open standards cover ~80% of real-world findings + the dependency context that makes EPSS/KEV scoring meaningful. |
  | 4 | Ownership source? | Declared via `.shep/ownership.yaml` + UI override | Source-of-truth in code with the ability to refine in the UI; matches engineering culture and survives author churn. |
  | 5 | SLA unit? | Calendar days (configurable per severity) | Matches CISA/regulatory norms, deterministic, avoids building a holiday-calendar subsystem. |
  | 6 | AI-change risk — separate or merged? | Separate `AiChangeRiskSignal` + dedicated review queue | Shep's differentiating angle; keeps Finding stats clean; clear graduation path to a confirmed Finding. |
  | 7 | Severity normalization? | Canonical 5-level + preserved raw | Cross-scanner comparability with full audit trail back to scanner intent. |
  | 8 | Risk exceptions workflow? | Self-declared with expiry + audit trail | Unblocks engineers without a permissions subsystem; expiry forces re-review. |
  | 9 | Campaign granularity? | Both — query-shaped campaigns filterable per application | One entity covers per-service sprints and fleet-wide themes. |
  | 10 | Compliance framework(s) for MVP? | OWASP ASVS + CWE Top 25 mapping | Open standards, directly applicable to AppSec audiences, foundation for regulated frameworks later. |
  | 11 | Findings → developer tasks? | On-demand `convert-finding-to-work-item` use case | Reuses Shep's existing WorkItem entity; engineers triage in `/aspm`, route the ones that matter into the backlog. |
  | 12 | Graph view in MVP? | Tabular MVP; defer React Flow graph view | Tables are where ASPM users actually work; graph view is high-effort-low-utility for MVP. |
  | 13 | Scoping by BusinessUnit? | Single workspace; BusinessUnit as field, not scope | Matches Shep's current single-tenant model; no permissions subsystem needed; data shape doesn't change when scoping is added later. |

