architecture: |
  Clean Architecture: the port gains `renameWindow` and `publishStatus`, and `open` returns the
  id the multiplexer printed. OpenControlCenterUseCase opens a log window per requested feature
  through OpenFeaturePaneUseCase. UpdateMultiplexerStatusUseCase renames windows and publishes
  status, never throwing. The console decides which features are active (domain
  isActiveFeatureState), names windows with its state symbols, and calls both use cases.

risks:
  - A user may close a window shep opened; renaming a closed window fails and is dropped from tracking

content: |
  ## Status

  - **Phase:** Planning
  - **Updated:** 2026-10-24

  ## Clean Architecture

  Commands to the multiplexer stay behind the port in infrastructure; the use cases orchestrate;
  the console only decides what to show and when to ask.

  ## TDD

  Builders (rename, status) and adapter first, then the two use cases, then the console's
  window tracker and status segment, each RED-GREEN-REFACTOR. The tmux e2e closes the loop.
