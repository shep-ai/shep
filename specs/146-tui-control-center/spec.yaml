oneLiner: One multiplexer window per active feature, named with its live state, and a tmux status segment of features waiting on you
summary: >
  `C` in `shep tui` opens a window (tmux window, WezTerm or kitty tab, Zellij floating pane) for
  every active feature, each following that feature's agent log, and keeps each window's name
  in step with the feature's state (◆ needs you, ● running, ✗ failed, ✓ done). Inside tmux the
  console also publishes `@shep_status` and `@shep_needs_you`, so a `status-right` of
  `#{@shep_status}` shows features waiting on you on every tmux screen. `shep tui --status`
  prints the same one-line summary for status bars and prompts that run a command.

