content: |
  ## Status

  - **Phase:** Research (Complete)
  - **Updated:** 2026-08-27

  ## Technology Decisions

  ### 1. Add `scrollable` Prop to TabsList (Tier 0 Primitive)

  **Chosen:** Add `scrollable?: boolean` prop to the existing `TabsList` component

  **Rejected:**
  - Create new `ScrollableTabsList` wrapper component — adds boilerplate and complexity without clear benefit
  - Apply scroll styling directly in feature-drawer-tabs.tsx — violates Tier separation of concerns

  **Rationale:**
  The `scrollable` prop approach is the minimal, most maintainable solution. TabsList is the right place to encapsulate
  scroll behavior since it's the container for tabs. The prop defaults to `false`, maintaining backward compatibility with
  existing callers. When `scrollable={true}`, the component applies `overflow-x-auto overflow-y-hidden` Tailwind classes.
  This leverages the proven pattern already used in 10+ components across the codebase (table-view, board-view, etc.).

  **Implementation details:**
  - Accept `scrollable?: boolean` in TabsList props
  - Conditionally add `overflow-x-auto overflow-y-hidden flex w-full` to className when `scrollable={true}`
  - Preserve existing classes and allow class merging via `cn()`
  - No changes to Radix UI TabsPrimitive behavior or structure

  ### 2. Keyboard Navigation and Auto-Scroll

  **Chosen:** Leverage Radix UI's native scroll-into-view support (no custom implementation)

  **Rejected:**
  - Manual scroll control — let user scroll; degrades accessibility
  - Custom Element.scrollIntoView() wrapper — risks conflicts with Radix UI; adds code complexity

  **Rationale:**
  Radix UI Tabs implements W3C ARIA tab pattern, which includes automatic scroll-into-view when a tab becomes focused
  via keyboard (Arrow Left/Right). Radix UI's implementation is proven, efficient, and requires no custom code. Testing
  involves verifying keyboard navigation works in scrolled state; Radix UI handles the mechanics internally.

  ### 3. Scrollbar Visibility and Styling

  **Chosen:** Always visible when overflow exists; use native `overflow-x-auto` with browser default scrollbar styling

  **Rejected:**
  - Hover-only scrollbar — requires custom CSS; inconsistent across browsers and touch devices
  - Visual scroll indicators (arrow buttons) — MVP scope creep; native scrollbar sufficient

  **Rationale:**
  The `overflow-x-auto` class is the established pattern in this codebase. Browser scrollbars are consistent across
  modern browsers, work reliably on touch devices, and provide clear visual feedback. This is the simplest, most maintainable
  approach. Future enhancements (arrow buttons, snap-scroll) can be added without changing the core implementation.

  ### 4. Responsive Behavior

  **Chosen:** No viewport-specific logic; scrollable tabs work across mobile, tablet, and desktop with native browser scroll

  **Rejected:**
  - Hide tabs on mobile; show dropdown — eliminates tab bar UX on mobile
  - Custom pagination or snap-scroll — deviates from standard scroll UX

  **Rationale:**
  Modern mobile browsers (iOS Safari, Chrome Mobile) support native horizontal scrolling. The feature drawer has a
  fixed-width container (not viewport-responsive), so tab bar width is consistent across all viewports. Overflow handling
  is automatic via `overflow-x-auto`. Testing should verify scroll works on mobile/tablet via touch and mouse wheel.

  ## Library Analysis

  | Library | Purpose | Decision | Reasoning |
  | --- | --- | --- | --- |
  | Radix UI (@radix-ui/tabs) | Tab component primitive; W3C ARIA implementation | **Use** | Already a dependency; provides keyboard navigation and scroll-into-view support. No API changes needed; the prop approach is purely a styling enhancement. |
  | Tailwind CSS | Utility-first CSS classes for overflow, flex layout | **Use** | Already in use; `overflow-x-auto`, `overflow-y-hidden`, `flex`, `w-full` are standard utilities. No new classes needed; no custom CSS required. |
  | React | Component composition and hooks | **Use** | Already in use. No new hooks or patterns required—prop is a simple conditional class application. |
  | TypeScript | Type safety for props | **Use** | Already in use. Props interface is straightforward: `scrollable?: boolean`. |
  | Element.scrollIntoView() | Native browser API for scroll-into-view | **Use (via Radix UI)** | Modern browser API; Radix UI handles it automatically via keyboard navigation. No direct usage needed in this implementation. |

  ## Security Considerations

  **No new security concerns introduced.**

  - **Overflow handling:** The `overflow-x-auto` class is a CSS-only feature; no user input or data is passed through it.
  - **Keyboard navigation:** Radix UI's keyboard handler is battle-tested and handles accessibility safely.
  - **XSS:** Tab content (labels, icons) is already rendered through the component; scrolling doesn't change content rendering.
  - **WCAG 2.1 Level AA compliance:** Keyboard navigation (Arrow Left/Right) is handled by Radix UI per W3C ARIA spec. Scrolling doesn't affect screen reader announcements of tab labels or roles. All tabs remain accessible via keyboard regardless of scroll position.

  ## Performance Considerations

  **Excellent performance characteristics.**

  - **CSS-only scrolling:** Using `overflow-x-auto` is a native browser feature with no JavaScript overhead. No layout recalculations or forced repaints.
  - **No JavaScript scroll listeners:** Radix UI's scroll-into-view is a single DOM API call (`Element.scrollIntoView()`), not a continuous listener. Minimal performance cost.
  - **No layout shifts:** Tab layout is determined by flex container; scrolling doesn't cause layout changes. No CLS (Cumulative Layout Shift) penalty.
  - **Smooth 60fps:** Native browser scrolling handles GPU acceleration. No jank or stuttering expected.
  - **Bundle size:** No new dependencies; no additional JavaScript code (just a conditional Tailwind class). Zero bundle impact.

  **Potential edge case:** If the feature drawer is extremely narrow (< 200px), all tabs may be hidden by overflow. Testing should verify the drawer's minimum width is large enough to show at least 1–2 tabs at once.

  ## Architecture Notes

  ### Component Tier Positioning

  This change respects the four-tier component hierarchy:

  - **Tier 0 (ui/tabs.tsx):** TabsList receives the `scrollable` prop. This is the correct layer for scroll behavior encapsulation.
  - **Tier 1 (common/feature-drawer-tabs/):** Renders TabsList with `scrollable={true}`. No custom scroll logic here; just passes the prop.
  - **No changes to Tiers 2 or 3:** The change is isolated to the tab components.

  ### Backward Compatibility

  The `scrollable` prop defaults to `false`, so existing TabsList callers are unaffected:

  ```tsx
  // Existing callers — no change needed
  <TabsList>
    <TabsTrigger value="tab1">Tab 1</TabsTrigger>
    <TabsTrigger value="tab2">Tab 2</TabsTrigger>
  </TabsList>

  // New scrollable usage
  <TabsList scrollable>
    {/* many tabs that overflow */}
  </TabsList>
  ```

  ### Storybook Stories

  The existing `tabs.stories.tsx` demonstrates TabsList with 2–3 tabs. A new story will show scrollable tabs with 8+ tabs:

  - **New story:** `Scrollable` or `ScrollableTabBar`
  - **Setup:** Render 8–11 tabs (simulating the feature drawer's max tab count) in a constrained width
  - **Testing:** Verify scroll behavior, keyboard navigation, active tab styling, and VS Code-inspired appearance

  ### Testing Strategy

  1. **Unit tests:** Verify `scrollable={true}` applies correct Tailwind classes
  2. **Storybook:** Visual regression test with 8+ tabs; manual testing of scroll feel and keyboard navigation
  3. **Integration tests:** Render feature-drawer-tabs with 6+ visible tabs; verify keyboard navigation (Arrow Left/Right) scrolls active tab into view
  4. **Accessibility tests:** Keyboard-only navigation; screen reader announces all tabs; WCAG 2.1 Level AA compliance

  ### Naming Convention

  - **Component prop:** `scrollable` (matches Tailwind class semantics)
  - **Storybook story:** `Scrollable` (capitalized, matches Storybook convention)
  - **CSS classes:** `overflow-x-auto overflow-y-hidden` (standard Tailwind naming)

