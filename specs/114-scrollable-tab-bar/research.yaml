# Structured technology decisions
decisions:
  - title: "Implementation Approach: Prop vs Component"
    chosen: "\"Add `scrollable?: boolean` prop to TabsList component\""
    rejected:
      - "\"Create new ScrollableTabsList wrapper component — adds boilerplate and complexity without clear benefit for MVP. Future enhancements (scroll buttons, snap behavior) can be added without breaking existing callers via composition.\""
      - "\"Apply scroll styling directly in feature-drawer-tabs.tsx — violates separation of concerns (Tier 0 primitives should encapsulate their own behavior). Requires duplication if other tab components need scrolling in the future.\""
    rationale: >
      "Adding the `scrollable` prop to TabsList is the minimal, most maintainable approach. It keeps all scroll-related styling
      in the primitive (Tier 0) where it belongs, maintains backward compatibility (prop defaults to false), and follows
      established codebase patterns. The Radix UI TabsPrimitive.List already has the container semantics needed for scrolling;
      we only need to conditionally apply `overflow-x-auto overflow-y-hidden` classes. When `scrollable={true}`, the existing
      layout (`inline-flex` + tab triggers) naturally fills the horizontal space, and overflow is handled by the scrollbar.
      Testing is straightforward: assert that the prop applies correct Tailwind classes. This approach scales well — if scroll
      buttons or indicators become necessary, a wrapper component can be added without modifying the prop API."

  - title: "Keyboard Navigation and Auto-Scroll Behavior"
    chosen: "\"Leverage Radix UI's native scroll-into-view support; active tab auto-scrolls into view when navigated via keyboard (Arrow Left/Right)\""
    rejected:
      - "\"Manual scroll control — let user scroll to see active tab if needed. This degrades UX for keyboard-heavy workflows and breaks accessibility expectations.\""
      - "\"Custom scroll implementation — override Radix UI's scroll-into-view with manual Element.scrollIntoView() calls. Adds complexity; Radix UI already provides the behavior.\""
    rationale: >
      "Radix UI Tabs implements W3C ARIA tab pattern, which includes keyboard navigation (Arrow Left/Right to switch tabs).
      When a new tab becomes active via keyboard, Radix UI automatically calls scrollIntoView() on the focused trigger.
      This is standard UX in modern tab implementations (browser tabs, VS Code, IDE tabs) and essential for accessibility.
      The native Element.scrollIntoView() call is efficient and works across all modern browsers. No custom implementation
      is needed — we just ensure the scrollable container allows overflow and trust Radix UI's built-in behavior. Testing
      involves verifying that keyboard navigation (simulated arrow key events) causes the active trigger to scroll into view."

  - title: "Scrollbar Visibility and Native Styling"
    chosen: "\"Always visible when overflow exists; use native browser scrollbar with `overflow-x-auto overflow-y-hidden` classes\""
    rejected:
      - "\"Hover-only scrollbar — use CSS to hide scrollbar by default, show on hover. Requires custom CSS (`scrollbar-gutter: stable` + `:hover overflow-y-scroll`) and has inconsistent behavior across browsers and operating systems (scrollbar width differs, hover detection unreliable on touch devices).\""
      - "\"Custom scroll indicators (arrow buttons) — add left/right chevron buttons for visual feedback. Adds UI complexity (state management, click handlers, styling) without solving a critical problem—users can already scroll via mouse, trackpad, or keyboard navigation.\""
    rationale: >
      "The `overflow-x-auto` Tailwind class is the proven pattern in this codebase—it's used successfully in table-view,
      board-view, timeline-view, and 10+ other components. The native scrollbar provides clear visual feedback that tabs
      are scrollable, improving discoverability. Browser scrollbars are consistent across modern browsers and work reliably
      on touch devices. Hover-only scrollbars require custom CSS and have browser inconsistencies (Safari scrollbar widths,
      Firefox behavior). Arrow buttons are MVP-scope creep; the native scrollbar is sufficient for the initial release.
      If usability testing later shows arrow buttons improve discoverability on touch devices, they can be added as an
      enhancement without changing the core scroll implementation."

  - title: "CSS Class Strategy for Scrollable Container"
    chosen: "\"Apply `overflow-x-auto overflow-y-hidden` + `flex` + `w-full` to TabsList when scrollable={true}\""
    rejected:
      - "\"Apply only `overflow-x-auto` — may not work correctly if TabsList uses `inline-flex` or has `justify-center`. Need to ensure container fills available width so scroll is triggered only by tab content overflow, not container width.\""
      - "\"Use `flex w-full` alone without `overflow-y-hidden` — risks vertical scrollbar appearing if tab content exceeds line height. Explicit `overflow-y-hidden` ensures only horizontal scroll.\""
    rationale: >
      "The feature-drawer-tabs currently renders TabsList with `w-full shrink-0 justify-start gap-0` custom classes.
      The base TabsList has `inline-flex h-9` with default `justify-center`. When scrollable is enabled, TabsList needs:
      `overflow-x-auto` (enable horizontal scroll), `overflow-y-hidden` (prevent vertical scroll), and `flex w-full`
      (ensure container fills available width so overflow is triggered by tab content, not container constraints).
      The flex class can coexist with inline-flex from the base style — Tailwind's `flex` (display: flex) will override
      `inline-flex` when both are present, which is the desired behavior for scrollable tabs."

  - title: "Responsive Behavior Across Viewport Sizes"
    chosen: "\"No viewport-specific overrides needed; scrollable tabs work across mobile, tablet, and desktop with native browser scroll behavior\""
    rejected:
      - "\"Hide tabs on mobile and show a dropdown instead — reduces complexity but eliminates the tab bar UX entirely on mobile. Users lose visual feedback about available tabs.\""
      - "\"Implement custom snap-scroll or pagination for mobile — adds complexity and deviates from the standard scroll UX.\""
    rationale: >
      "Modern browsers (iOS Safari, Chrome Mobile, Firefox Mobile) all support native horizontal scrolling with touch and
      trackpad input. The `overflow-x-auto` class works consistently across all viewports. Tab width is determined by
      content (icon + label), so on narrow viewports more tabs will overflow naturally—the scrollbar handles this without
      special responsive logic. The feature drawer itself is responsive (drawer width adapts), so tab bar width automatically
      adapts with it. Testing should verify scroll works on mobile/tablet browsers via touch input and mouse wheel."

  - title: "Testing Strategy and Coverage"
    chosen: "\"Combine unit tests (props apply correct classes), Storybook visual tests (8+ tabs demonstrate scrolling), and integration tests (keyboard navigation with scrolled viewport)\""
    rejected:
      - "\"Only unit tests — sufficient for prop validation but doesn't verify scroll behavior or keyboard navigation.\""
      - "\"Only Storybook stories — visual verification but no automated testing of keyboard/scroll interactions.\""
    rationale: >
      "Unit tests verify the mechanics: that `scrollable={true}` applies the correct Tailwind classes to the container.
      This is fast and catches regressions in the prop logic. Storybook stories demonstrate the feature visually and allow
      manual testing of scroll feel and tab styling in isolation. Stories with 8+ tabs trigger overflow and allow verifying
      that all tabs are accessible via scrolling. Integration tests (in feature-drawer-tabs context) verify that keyboard
      navigation (Arrow Left/Right) works correctly when tabs are scrolled—i.e., that the focused trigger scrolls into view.
      This requires rendering the full feature-drawer-tabs component with 6+ visible tabs and simulating keyboard events.
      Accessibility testing (keyboard-only navigation, screen reader announcement of all tabs) is included in integration tests."

  - title: "Backward Compatibility"
    chosen: "\"Default `scrollable={false}` maintains existing behavior; opt-in to scrolling via explicit prop\""
    rejected:
      - "\"Default `scrollable={true}` for all TabsList — breaks existing callers that expect non-scrollable tabs and may cause unwanted scroll behavior in other components using TabsList.\""
      - "\"Create a breaking change and update all TabsList callers — unnecessarily disruptive; the prop approach is safer.\""
    rationale: >
      "TabsList is a Tier 0 primitive used in multiple places across the codebase. Changing the default to scrollable=true
      could affect other components (e.g., settings tabs, tools tabs, features tabs elsewhere) that expect non-scrollable
      behavior. The opt-in approach via explicit `scrollable={true}` prop ensures no surprises. Callers that need scrolling
      explicitly enable it; all others are unaffected. This is a safe, additive change that maintains the existing contract."

