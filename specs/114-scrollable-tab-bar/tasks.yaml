# Markdown content (the full tasks document)
content: |
  ## Summary

  Implementing horizontal scrolling for the feature drawer tab bar in 6 focused tasks across 3 phases:

  **Phase 1 (Foundation):** Add `scrollable` prop to TabsList (Tier 0 primitive). The prop conditionally applies
  Tailwind overflow utilities to enable horizontal scrolling. Unit test verifies prop behavior; implementation is minimal
  (single prop + conditional class application using `cn()`).

  **Phase 2 (Integration):** Update feature-drawer-tabs to pass `scrollable={true}` to TabsList, enabling scrolling in
  production. Create Storybook story demonstrating scrollable tabs with 8+ tabs for visual regression testing. Integration
  test verifies scroll works with realistic tab data.

  **Phase 3 (Verification):** Write comprehensive tests ensuring keyboard navigation (Arrow Left/Right) works in scrolled
  context and Radix UI's native scroll-into-view works correctly. Run WCAG 2.1 Level AA accessibility audit. Test touch
  scrolling on mobile browsers. Final verification runs all test suites and build locally to confirm no regressions.

  **Total effort: 4h 15m across all phases**

  ## Implementation Order

  1. **Task 1** (45m) — Add prop to TabsList. Must be complete before other tasks can use it.
  2. **Task 2** (30m) — Update feature-drawer-tabs. Depends on Task 1; enables real-world usage.
  3. **Task 3** (45m) — Create Storybook story. Depends on Task 1; provides visual regression testing.
  4. **Task 4** (1h) — Keyboard navigation test. Depends on Task 2; validates keyboard accessibility in scrolled state.
  5. **Task 5** (1h) — Accessibility audit. Depends on Tasks 2-3; ensures WCAG compliance and mobile scroll works.
  6. **Task 6** (30m) — Final verification. Depends on all previous tasks; runs all local checks before commit.

  ## TDD Cycles

  Every code task follows strict RED → GREEN → REFACTOR:

  - **RED:** Write failing test first; verify it fails before implementing
  - **GREEN:** Implement minimal code to pass the test
  - **REFACTOR:** Clean up, improve naming, extract helpers, ensure types are correct

  This ensures tests are meaningful, implementation is correct, and code quality is high.

