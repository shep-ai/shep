phases:
  - id: phase-1
    name: "Domain Models & Settings Foundation"
    description: >
      Define TypeSpec models for TokenOptimizationConfig and OptimizationMetrics.
      Add tokenOptimization settings section to workflow settings with master toggle
      and per-capability toggles. Create DB migration for optimization metrics columns
      on PhaseTiming. This phase is first because all subsequent phases depend on the
      domain types and settings infrastructure.
    parallel: false

  - id: phase-2
    name: "Port Interfaces & Core Abstractions"
    description: >
      Define application port interfaces: IPromptOptimizerService,
      ICommandOutputFilterService, ISkillRoutingService, IDeltaContextService,
      ISemanticCompressorService, IAliasCompressionService, and
      IOptimizationMetricsService. These ports establish the contract that
      infrastructure implementations fulfill. Depends on phase-1 for domain types.
    parallel: false

  - id: phase-3
    name: "Command Output Filter Implementation"
    description: >
      Implement the regex-based command output filter service that reduces
      test/build/git output tokens by 50%+ while preserving all error-relevant
      lines. Includes configurable filter policies for Jest/Vitest, TypeScript
      build, git diff, and pnpm install output. Depends on phase-2 for port
      interface.
    parallel: false

  - id: phase-4
    name: "Phase-Aware Skill Routing Implementation"
    description: >
      Implement the skill routing service that maintains a phase-to-skill mapping
      table and generates prompt directives listing phase-relevant skills. The
      routing table is configurable via settings. Depends on phase-2 for port
      interface.
    parallel: false

  - id: phase-5
    name: "Delta-Context State Diffing Implementation"
    description: >
      Implement hash-based change detection for spec files using LangGraph state
      channels. When a spec file is unchanged between consecutive phases, replace
      full content with a compact summary. Add specFileHashes channel to
      FeatureAgentAnnotation state. Depends on phase-2 for port interface.
    parallel: false

  - id: phase-6
    name: "Semantic Text Compression Implementation"
    description: >
      Implement rule-based caveman compression for non-code prompt sections.
      Rules include article removal, filler word stripping, phrase shortening,
      and whitespace collapsing. Must preserve code blocks, file paths, URLs,
      YAML/JSON content, and quoted strings. Depends on phase-2 for port interface.
    parallel: false

  - id: phase-7
    name: "Alias/Meta-Token Compression Implementation"
    description: >
      Implement session dictionary builder that identifies repeated long strings
      (3+ occurrences, 20+ chars) and replaces them with short aliases. Dictionary
      is prepended to the prompt. Net-positive check ensures dictionary overhead
      does not exceed savings. Depends on phase-2 for port interface.
    parallel: false

  - id: phase-8
    name: "Prompt Optimizer Orchestrator & DI Wiring"
    description: >
      Implement the top-level PromptOptimizerService that orchestrates all
      capability services based on settings. Register all services in the DI
      container. Wire the optimizer into executeNode() in node-helpers.ts as a
      single interceptor between buildPrompt() and executor.execute(). Depends
      on phases 3-7 for all capability implementations.
    parallel: false

  - id: phase-9
    name: "Optimization Metrics Tracking"
    description: >
      Implement metrics collection in the optimizer orchestrator and persistence
      via the existing PhaseTiming infrastructure. Track original/optimized token
      estimates, savings percent, capabilities applied, and per-capability stats.
      Depends on phase-8 for the orchestrator.
    parallel: false

  - id: phase-10
    name: "Integration Testing & Validation"
    description: >
      End-to-end integration tests verifying the full optimization pipeline.
      Run pnpm validate and pnpm test to confirm zero regressions. Verify
      optimization adds less than 50ms latency. Depends on all prior phases.
    parallel: false

