# Markdown content (the full plan document)
content: |
  ## Status

  - **Phase:** Planning
  - **Updated:** 2026-04-06

  ## Architecture Overview

  The Token Optimization Layer is implemented as a set of composable services behind a
  unified `IPromptOptimizerService` interface. The optimizer is injected via DI and invoked
  from `executeNode()` in node-helpers.ts — a single interceptor between prompt assembly
  and executor invocation.

  Each optimization capability is an independent service with its own port interface
  (application layer) and implementation (infrastructure layer). The orchestrating
  `PromptOptimizerService` checks per-capability settings toggles and delegates to
  enabled services in sequence.

  ### Capability Pipeline Order

  1. **Delta-Context Diffing** — Replace unchanged spec files with compact summaries
  2. **Command Output Filtering** — Reduce test/build/git output via regex policies
  3. **Skill Routing** — Add phase-relevant skill directives to prompt
  4. **Semantic Compression** — Caveman-style rule-based text compression
  5. **Alias Compression** — Session dictionary for repeated long strings

  ### Settings Model

  ```
  tokenOptimization:
    enabled: true          # master toggle
    outputFiltering: true  # per-capability
    skillRouting: true
    deltaContext: true
    semanticCompression: true
    aliasCompression: true
  ```

  ### Key Design Decisions

  - Single interceptor in executeNode() — centralized, no prompt builder changes needed
  - Filter at prompt assembly time for skills — no filesystem manipulation
  - Rule-based caveman compression — zero latency, no LLM cost, deterministic
  - Hash-based change detection in LangGraph state — natural fit, no external storage
  - Token budget enforcement deferred to Phase 3 — needs calibration data first
  - Master toggle + per-capability toggles — balances simplicity with surgical control

  ## Risk Mitigation

  - **Safety**: Command output filter preserves all error-related lines via conservative
    keyword matching. When in doubt, preserve the line.
  - **Performance**: Target less than 50ms overhead. All operations are string-based with
    no LLM calls or I/O beyond what already exists.
  - **Backward compatibility**: Optimized prompts are functionally equivalent to originals.
    All DB changes are additive-only migrations.
  - **Testability**: Each capability is independently testable with mocked dependencies.
    The orchestrator is testable with mocked capability services.

  ---

  _Implementation plan for the Token Optimization Layer (spec 085)._
