# Markdown content (the actual spec)
content: |
  ## Problem Statement

  shep currently has no awareness of project-bedrock — a Python CLI that gives AI
  coding agents persistent, git-tracked markdown "project memory" via session-start
  and session-stop hooks installed into `.claude/`, `.cursor/`, and `.codex/`. Today
  a shep user who wants this capability must:

  1. Discover project-bedrock themselves
  2. Install it manually (`pipx install project-bedrock`)
  3. Run `bedrock init` inside every shep worktree by hand
  4. Manually reconcile bedrock's `.claude/` hook writes with shep's own
     `SkillInjectorService` outputs

  This integration removes that friction by registering bedrock as a known shep
  tool (installable, verifiable, launchable) and exposing its lifecycle through a
  proper application-layer port, so any presentation surface (CLI / TUI / Web) can
  drive it the same way.

  ## Success Criteria

  - [ ] `project-bedrock.json` descriptor exists in
        `packages/core/src/infrastructure/services/tool-installer/tools/` and is
        loaded by the existing `ToolMetadataProvider` without code changes to the
        loader.
  - [ ] Running the existing tool-installer flow installs project-bedrock via pipx
        on macOS, Linux, and Windows (or surfaces a typed, actionable error when
        the package manager is missing).
  - [ ] A new output port `IBedrockIntegrationService` is defined in
        `packages/core/src/application/ports/output/services/` exposing `init`,
        `sync`, `doctor`, and `ship` lifecycle methods, with zero infrastructure
        imports.
  - [ ] The concrete adapter `BedrockIntegrationService` lives under
        `packages/core/src/infrastructure/services/integrations/`, spawns the
        `bedrock` binary using `child_process.spawn` with `windowsHide: true` and
        no `shell: true`, and is wired into the tsyringe container by string token.
  - [ ] Three use cases exist and have RED-first unit tests with mocked ports:
        `EnableBedrockForApplication`, `RunBedrockLifecycle` (handling init / sync
        / ship via a typed `BedrockLifecycleAction` enum), `CheckBedrockHealth`.
  - [ ] The `Application` TypeSpec entity gains a `bedrockEnabled` boolean field,
        regenerates cleanly via `pnpm tsp:compile`, and is backed by a forward-only
        SQLite migration that defaults existing rows to `false`.
  - [ ] A `shep bedrock <init|sync|doctor|ship>` CLI command set exists under
        `src/presentation/cli/commands/`, each delegating to its use case and
        rendering via the shared ui module.
  - [ ] The Application detail page in the web UI renders a "Bedrock memory"
        toggle calling `EnableBedrockForApplication`, with a colocated
        `.stories.tsx` covering Default, Loading, and Error states.
  - [ ] `CheckBedrockHealth` performs the three-tier prereq check (Python 3.9+,
        pipx, bedrock binary) and returns a typed result with per-tier status.
  - [ ] `.claude/` reconciliation: when both SkillInjectorService and bedrock
        write hooks, the resulting `.claude/settings.json` (or equivalent) contains
        the union of both hook entries with no duplicates and no data loss; this is
        covered by a fixture-based integration test.
  - [ ] All new code passes `pnpm validate` (lint + format + typecheck + tsp) and
        the new unit + integration tests pass with zero warnings.
  - [ ] `LESSONS.md` has not regressed; no `.claude/` writes from this feature
        clobber existing user content.

  ## Functional Requirements

  - **FR-1 — Tool descriptor**: shep MUST register project-bedrock through a
    single JSON descriptor (`project-bedrock.json`) at
    `packages/core/src/infrastructure/services/tool-installer/tools/`. The
    descriptor MUST declare the pipx install command per OS, a verify command
    (`bedrock --version`), a docs URL, and tags (`memory`, `ai-context`, `python`).
  - **FR-2 — Install via tool-installer**: Users MUST be able to install
    project-bedrock through the existing tool-installer flow without code changes
    to the loader. If pipx is not installed, the install flow MUST emit a typed,
    actionable error referencing the remediation step.
  - **FR-3 — Application output port**: A new port
    `IBedrockIntegrationService` MUST live in
    `application/ports/output/services/` and expose:
    `init(opts)`, `sync(opts)`, `doctor()`, `ship(opts)`. The port MUST NOT
    reference any infrastructure type, Node API, or process abstraction.
  - **FR-4 — Infrastructure adapter**: The concrete `BedrockIntegrationService`
    MUST implement the port using `child_process.spawn`, set
    `windowsHide: true`, omit `shell: true`, and pass arguments as an array. It
    MUST be registered in the tsyringe DI container under a string token.
  - **FR-5 — Three-tier prereq verification**: `doctor()` MUST verify, in order,
    (a) Python ≥ 3.9, (b) pipx availability, (c) `bedrock --version` success, and
    return a typed `BedrockHealth` result with per-tier `ok | missing | error`
    status plus a human-readable remediation hint.
  - **FR-6 — Persisted enable state**: The `Application` TypeSpec entity MUST gain
    a `bedrockEnabled: boolean` field defaulting to `false`. A forward-only SQLite
    migration MUST add the column with `DEFAULT 0` for existing rows.
  - **FR-7 — Enable use case**: `EnableBedrockForApplication` MUST persist
    `bedrockEnabled = true` on the target Application via the existing repository
    port, then invoke `IBedrockIntegrationService.init()` for the application's
    worktree. The use case MUST be idempotent (re-running on an enabled
    application is a no-op for state but re-runs `init` safely).
  - **FR-8 — Lifecycle use case**: `RunBedrockLifecycle` MUST accept a typed
    `BedrockLifecycleAction` enum (`Init | Sync | Ship`) and an application id,
    refuse to run when `bedrockEnabled = false`, and emit structured results
    consumable by all presentation layers.
  - **FR-9 — Health use case**: `CheckBedrockHealth` MUST wrap `doctor()` and
    return its typed result without leaking process internals.
  - **FR-10 — `.claude/` reconciliation**: When both SkillInjectorService and
    `bedrock init` write hooks for the same project, the integration MUST produce
    the union of both hook payloads in `.claude/settings.json` (or the
    bedrock-targeted equivalent) with no duplicates and no overwritten user
    content. SkillInjectorService MUST run first; bedrock MUST run second; a
    merge helper MUST reconcile arrays.
  - **FR-11 — CLI surface**: `shep bedrock init|sync|doctor|ship` MUST exist as
    thin Commander subcommands under `src/presentation/cli/commands/`, each
    resolving its use case from DI and rendering output via the shared ui module.
  - **FR-12 — Web toggle**: The Application detail page MUST render a "Bedrock
    memory" toggle that calls `EnableBedrockForApplication`, with a colocated
    `.stories.tsx` covering Default, Loading, and Error states (mandatory rule).
  - **FR-13 — Default OFF**: Bedrock MUST be OFF for all existing and new
    applications until explicitly enabled. `shep project-init` MUST NOT call
    `bedrock init` automatically.
  - **FR-14 — Discoverable via tools registry**: project-bedrock MUST appear in
    the existing tools registry view in the web UI automatically, via the
    descriptor — no bespoke registration code.

  ## Non-Functional Requirements

  - **NFR-1 — Clean architecture**: No infrastructure imports in
    `application/` or `domain/`. All bedrock interaction in use cases MUST flow
    through `IBedrockIntegrationService`. The dependency rule MUST hold.
  - **NFR-2 — Cross-platform**: All subprocess invocations MUST work on macOS,
    Linux, and Windows. `shell: true` is forbidden; `windowsHide: true` is
    required; paths MUST go through `path.join` not string concatenation.
  - **NFR-3 — TDD discipline**: Every new use case and the adapter MUST be
    delivered RED-first (failing test committed before implementation) per
    `tdd-guide.md`. Unit tests MUST use a mocked process runner; integration
    tests MUST use real fixtures for the descriptor loader and `.claude/` merge.
  - **NFR-4 — No magic literals**: Subcommand names (`init`, `sync`, `doctor`,
    `ship`) MUST be a TypeSpec-defined enum (`BedrockLifecycleAction`), not raw
    string comparisons. DI tokens MUST be exported constants.
  - **NFR-5 — Performance**: `doctor()` MUST complete in under 2 seconds on a
    healthy machine (three short subprocess calls). It MUST be safe to run
    repeatedly (no caching pitfalls; no side effects on disk).
  - **NFR-6 — Failure surfacing**: Prereq failures MUST be typed domain errors
    with remediation strings. No swallowed exceptions; no `console.error` —
    presentation layers do the rendering.
  - **NFR-7 — Storybook coverage**: The new web toggle component MUST ship with
    a colocated `.stories.tsx` covering Default, Loading, and Error states
    (mandatory rule — commits without stories rejected).
  - **NFR-8 — File length**: No new file exceeds ~300 lines; the adapter splits
    process invocation, parsing, and reconciliation into separate small modules
    if needed.
  - **NFR-9 — No singletons leaked**: The adapter MUST be registered in tsyringe;
    no module-level instance, no global accessor. Use cases inject by string
    token only.
  - **NFR-10 — Migration safety**: The SQLite migration adding `bedrockEnabled`
    MUST be idempotent (guard with `IF NOT EXISTS` or equivalent shep migration
    convention) and forward-only.

  ## Product Questions & AI Recommendations

  | # | Question | AI Recommendation | Rationale |
  | - | -------- | ----------------- | --------- |
  | 1 | How should bedrock's .claude/ hooks coexist with SkillInjectorService? | Run-after with diff-aware merge | Keeps bedrock as opaque upstream; merge logic isolated to one helper; testable with fixtures. |
  | 2 | Persist bedrock-enabled state in the domain model? | Persist `bedrockEnabled` on Application | Matches existing per-app toggle pattern; enables deterministic use cases and a clean web toggle. |
  | 3 | Auto-bootstrap bedrock during project-init? | Opt-in via explicit enable | Default-OFF avoids surprising .claude/ writes; consistent with every other integration. |
  | 4 | Which bedrock subcommands does the port expose? | init, sync, doctor, ship | Full lifecycle keeps shep authoritative; `ship` namespaced via use case so commit semantics are explicit. |
  | 5 | How strict is prereq verification? | Three-tier verify with actionable errors | Specific remediation messages; follows shep cross-platform rule; cheap to run. |
  | 6 | What CLI surface ships for M? | Dedicated `shep bedrock` subcommands | Smallest cohesive surface exposing the full use-case API; matches existing CLI conventions. |
  | 7 | What web UI exposure ships for M? | Toggle + tool registry entry | Parity with CLI for enable/disable; defers deep dashboard to a future L feature. |

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | `packages/core/src/infrastructure/services/tool-installer/tools/` | High | Add `project-bedrock.json` descriptor (pipx install, `bedrock --version` verify, docs URL, tags). Primary registration surface. |
  | `packages/core/src/infrastructure/services/tool-installer/` | Low | Confirm `pipx` is a recognised `packageManager` value; add support if missing. Schema already supports per-OS commands. |
  | `packages/core/src/application/ports/output/services/` | Medium | New port `IBedrockIntegrationService` wrapping `init`, `sync`, `doctor`, `ship`. |
  | `packages/core/src/infrastructure/services/integrations/` | Medium | New `BedrockIntegrationService` implementing the port — spawns `bedrock` subprocess with `windowsHide` + no `shell:true`. Includes `.claude/` merge helper. |
  | `packages/core/src/application/use-cases/` | Medium | New use cases: `EnableBedrockForApplication`, `RunBedrockLifecycle`, `CheckBedrockHealth`. RED-first TDD. |
  | `packages/core/src/infrastructure/di/` | Low | Register port + adapter under a string token in the tsyringe container. |
  | `packages/core/src/infrastructure/services/skill-injector.service.ts` | Low | Ensure ordering contract (skill injector runs before bedrock init); contributes its hook payload to the merge helper. |
  | `tsp/domain/entities/application.tsp` | Low | Add `bedrockEnabled: boolean` (default false). |
  | `packages/core/src/infrastructure/persistence/migrations/` | Low | New forward-only migration adding `bedrock_enabled INTEGER NOT NULL DEFAULT 0` to `applications`. |
  | `src/presentation/cli/commands/` | Medium | Four thin commands: `shep bedrock init|sync|doctor|ship`. |
  | `src/presentation/web/app/(application detail)/` | Low | Add "Bedrock memory" toggle wired to `EnableBedrockForApplication`. |
  | `src/presentation/web/components/` | Low | Toggle component with mandatory colocated `.stories.tsx`. |
  | Tests: `packages/core/tests/unit` + `tests/integration` | Medium | RED-first: unit tests for each use case + adapter (mocked process runner); integration tests for descriptor loader and `.claude/` merge fixtures. |

  ## Dependencies

  - **Existing shep infrastructure**: `ToolInstallerService`, `ToolMetadataProvider`,
    `SkillInjectorService`, `ProjectScaffoldService`, tsyringe DI container,
    SQLite migration runner.
  - **Existing patterns to follow**: `cloud-deployment-provider.registry.ts`
    (registry of adapters), other JSON descriptors in `tool-installer/tools/`,
    the integrations folder (`noop-webhook.service.ts`), existing migration
    files for the schema change.
  - **External runtime**: project-bedrock published on PyPI; requires Python 3.9+
    and pipx on the host. shep MUST surface a clear typed error when those
    prerequisites are missing (cross-platform rule: never silently fail).
  - **TypeSpec generation**: `pnpm tsp:compile` regenerates
    `packages/core/src/domain/generated/output.ts` after the
    `Application.bedrockEnabled` field is added.
  - **No new npm dependencies** anticipated — subprocess invocation uses Node's
    built-in `child_process`, consistent with other tool integrations.

  ## Size Estimate

  **M** — A few days of focused work. Justification:

  - Tool descriptor is a single JSON file (hours).
  - New port + adapter + three use cases + DI wiring follows a well-established
    pattern in the codebase; mostly mechanical with TDD (~1.5 days).
  - TypeSpec field + SQLite migration is a small, isolated change (~2 hours).
  - `.claude/` reconciliation needs design work, a small merge helper, and
    fixture-based integration tests (~1 day).
  - CLI subcommands × 4 are thin (~3–4 hours total).
  - Web toggle + Storybook stories (~3 hours).
  - Total stays comfortably within M. Pushing to L would require a bespoke
    bedrock dashboard, bidirectional sync of bedrock memory into shep's context
    store, or deep event observability — all explicitly out of scope here.
