# Open questions (must be resolved before implementation)
openQuestions:
  - question: "How should bedrock's .claude/ hook installer coexist with shep's SkillInjectorService?"
    resolved: true
    options:
      - option: "Run-after with diff-aware merge"
        description: |
          shep writes its skills first, then invokes `bedrock init` which appends its hooks.
          A small reconciliation step parses `.claude/settings.json` (or equivalent) and
          merges hook arrays rather than overwriting. Preserves both systems' contracts,
          fails loud if a conflict is detected, and keeps bedrock's upstream contract intact.
        selected: true
      - option: "shep owns .claude/, bedrock disabled"
        description: |
          Disable bedrock's hook installation entirely; have shep mirror bedrock's hook
          payload from a known template. Simplest collision story, but couples shep to
          bedrock's internal hook format and breaks if bedrock changes upstream.
      - option: "bedrock-first, shep merges on top"
        description: |
          Run `bedrock init` first, then SkillInjectorService merges its skills in.
          Inverts current ordering, requires SkillInjectorService to become merge-aware
          everywhere — larger blast radius than option 1.
    selectionRationale: |
      Option 1 keeps bedrock as a black-box upstream dependency (we never parse or
      regenerate its hook payload), keeps shep's existing SkillInjectorService ordering,
      and contains the merge logic to a single new helper used by the integration
      service. The diff-aware merge is bounded (hooks arrays in a known JSON file) and
      testable with fixtures. This is the smallest reversible commitment.
    answer: "Run-after with diff-aware merge"

  - question: "Should bedrock-enabled state be persisted in the domain model (Application entity)?"
    resolved: true
    options:
      - option: "Persist bedrockEnabled flag"
        description: |
          Add `bedrockEnabled: boolean` to the Application TypeSpec entity and migrate
          the SQLite schema. Enables the web UI to render an explicit toggle, lets
          worktree-init use cases query state, and survives across shep restarts.
        selected: true
      - option: "Infer from on-disk presence"
        description: |
          Detect bedrock by probing for `.bedrock/` or its hook entries in `.claude/`.
          Zero schema change, but every read is a filesystem call and there is no
          authoritative "user intent" record (impossible to distinguish "never enabled"
          from "enabled then files deleted").
      - option: "In-memory only"
        description: |
          Keep bedrock state per-session, no persistence. Cheapest now, but every
          shep restart re-asks the user / re-runs detection — poor UX for a
          long-lived per-project setting.
    selectionRationale: |
      Persisting an explicit `bedrockEnabled` flag on Application matches how other
      per-application toggles (cloudDeploymentProvider, etc.) are modelled, gives the
      web UI a clean toggle, and makes use cases (`EnableBedrockForApplication`,
      `CheckBedrockHealth`) deterministic. The migration is a single nullable boolean
      column — well within M sizing.
    answer: "Persist bedrockEnabled flag"

  - question: "Should bedrock be auto-bootstrapped during shep project-init, or strictly opt-in?"
    resolved: true
    options:
      - option: "Opt-in via explicit enable"
        description: |
          shep registers bedrock as installable and discoverable, but `bedrock init`
          only runs when the user explicitly enables it on an Application (CLI flag,
          web toggle, or use case call). Default is OFF. Respects user autonomy and
          avoids surprising .claude/ writes in existing repos.
        selected: true
      - option: "Auto-enable on new projects"
        description: |
          Run `bedrock init` automatically during `shep project-init` for new
          applications. Lower friction for greenfield, but writes `.claude/` hooks
          that a user may not want; harder to reverse.
      - option: "Prompt on first init"
        description: |
          Interactive prompt during project-init asking yes/no. Better than silent
          auto-enable but breaks non-interactive flows (CI, scripted setup) unless
          we add a `--no-prompt` flag.
    selectionRationale: |
      Default-OFF is consistent with shep's posture for every other optional
      integration (cloud deploy providers, webhooks). It avoids surprise filesystem
      writes, keeps the project-init use case non-interactive, and lets the user
      enable bedrock from any presentation surface using the same use case.
    answer: "Opt-in via explicit enable"

  - question: "Which bedrock subcommands should be exposed through the application port?"
    resolved: true
    options:
      - option: "init, sync, doctor, ship"
        description: |
          Full lifecycle. `init` bootstraps, `sync` reconciles memory with git, `doctor`
          diagnoses, `ship` commits memory updates. Matches bedrock's public CLI surface
          and lets any presentation drive the entire flow.
        selected: true
      - option: "init and doctor only"
        description: |
          Minimal surface — bootstrap and health check. Smallest API but forces users
          back to the bedrock CLI for any actual memory work, defeating the integration's
          point.
      - option: "init, sync, doctor (no ship)"
        description: |
          Drop `ship` because it commits to git and overlaps with shep's own commit
          flow. Avoids potential confusion about who owns commits, but leaves users
          without a programmatic way to checkpoint bedrock memory.
    selectionRationale: |
      Exposing the full lifecycle keeps shep authoritative as the orchestration layer
      and matches the user's mental model ("everything I can do with bedrock, I can
      do through shep"). `ship` is namespaced behind a use case (`ShipBedrockMemory`)
      so its git-commit semantics are explicit at the call site — no confusion with
      shep's own commit flows.
    answer: "init, sync, doctor, ship"

  - question: "How strict should prerequisite verification be (Python, pipx, bedrock binary)?"
    resolved: true
    options:
      - option: "Three-tier verify with actionable errors"
        description: |
          Check (1) `python3 --version` >= 3.9, (2) `pipx --version`, (3)
          `bedrock --version`. Each failure surfaces a typed domain error with a
          remediation hint (e.g. "install Python 3.9+ from python.org"). Fails loud
          per shep's cross-platform rule, never silently.
        selected: true
      - option: "bedrock --version only"
        description: |
          Trust that if `bedrock` resolves, Python and pipx are fine. Simpler, but
          masks the root cause when bedrock is missing (user sees "command not
          found" instead of "Python not installed").
      - option: "No verification, fail at runtime"
        description: |
          Skip prereq checks; let the subprocess invocation fail naturally. Cheapest
          but violates shep's "never silently fail" rule and produces opaque errors.
    selectionRationale: |
      Three-tier verify follows the pattern in other infrastructure adapters
      (cross-platform checks, typed errors) and gives the user a specific, fixable
      message. The cost is three short subprocess calls in `doctor` and during
      install, which is acceptable.
    answer: "Three-tier verify with actionable errors"

