summary: |-
  Signals pile up faster than people shape them into bets. Discovery hands the pile to an agent:
  the space's unlinked signals, its feedback themes, the titles of its open opportunities (so it
  does not repeat them) and the team's knowledge documents. The agent answers with a few proposed
  opportunities, each naming the signals it rests on, the problem, a short outline of what to
  build, a review-hour estimate and a confidence. Shep keeps only proposals backed by real
  signals of the space and new titles, creates them as Proposed opportunities marked as
  discovered, links their signals and records the run. A space can run discovery every N hours;
  the daemon does it while nobody watches. People still decide: discovered opportunities rank
  like any other and wait to be accepted, dropped or built.
