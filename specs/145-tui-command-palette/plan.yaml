architecture: |
  Presentation only (Clean Architecture: no core change). The palette module owns the entry
  table (key, chord, label), availability against the selected row, fuzzy filtering and
  rendering. The view gains a Palette mode; enter closes it and calls the same handler a key
  press does.

risks:
  - The palette grows with each later spec; entries are data, so adding one is one line

content: |
  ## Status

  - **Phase:** Planning
  - **Updated:** 2026-10-24

  ## Clean Architecture

  Presentation layer only. Which actions a feature allows still comes from the core snapshot
  (`row.actions`); the palette only reads it.

  ## TDD

  RED first: palette availability and filtering, OSC 52 encoding, view palette mode (open,
  filter, run, close, ctrl+c), app copy. Then GREEN, then REFACTOR (files under 300 lines).
