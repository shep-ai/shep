content: |
  ## Problem Statement

  The console has more than fifteen keys and the key bar can show only a few at a time. Crush
  (ctrl+p), Amp and agent-deck all answer this with a palette: one key that lists every command,
  filterable by name, showing the key for next time.

  ## Success Criteria

  - [ ] `ctrl+p` and `:` open the palette; `esc` closes it; `ctrl+c` still quits
  - [ ] The palette lists only commands that apply to the selected feature (actions the core
        offers, a log only with a run, clear filter only with a filter)
  - [ ] Typing filters with fuzzy matching (every word, best match first); ↑↓ choose; enter runs
  - [ ] Running a palette entry takes the same path as pressing its key
  - [ ] Each entry shows its key
  - [ ] `c` (and the palette) copies the selected feature's full id via OSC 52 and says so
  - [ ] All strings in nine locales; help and key bar list the palette key

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | `src/presentation/tui/feature-console/console-palette.ts` | High | Entries, availability, fuzzy filter, rendering |
  | `console-keys.ts`, `feature-console-view.ts`, `console-screen.ts` | Medium | Palette mode, new keys |
  | `feature-console.app.ts`, `terminal-clipboard.ts` | Low | Copy over OSC 52 |
  | `translations/*/tui.json` | Low | Labels in nine locales |

  ## Dependencies

  - pi-tui `fuzzyFilter` and `Input`
  - Spec 142/143 console

  ## Out of Scope

  A keybindings file (rebinding keys). Settings are stored in the database, so a rebinding
  feature needs its own TypeSpec model; the palette's entry list is the registry it would use.

  ## Size Estimate

  **M** - presentation only: one new module, a mode in the view, a clipboard helper, nine locales.
