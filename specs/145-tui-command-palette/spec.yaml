oneLiner: A ctrl+p command palette in shep tui that lists every console command with its key and runs it
summary: >
  `ctrl+p` or `:` in `shep tui` opens a palette of every command the selected feature allows
  (approve, reject, stop, resume, open a shell or log pane, filter, copy the feature id, help,
  quit, and the commands later specs add). Typing narrows it with fuzzy matching; enter runs the
  command through exactly the path its key takes, so the palette can never do something the key
  would refuse. `c` copies the selected feature's id to the clipboard over OSC 52.

