summary: |-
  Shep assumes one organization per machine. Shep Brain's "Organization" memories are loaded into
  every repository's agent prompts with no filter, so a person who uses shep for both work and
  personal projects has company conventions injected into side projects and the reverse. This
  feature adds two domain concepts: a Space (a hard knowledge boundary, such as "Acme" or
  "Personal") and a Product line (a group of related repositories inside a space, such as
  "Payments"). Repositories are placed in a space and line automatically by rules (path prefix or
  git remote pattern) or by explicit assignment, and fall back to a default space. Memory gains
  Space and Product line scopes: agents read their repository's entries, plus their product
  line's, plus their space's, and nothing from any other space. A `shep space` CLI group and a
  /spaces web page manage spaces, lines, rules and assignments; the memory page filters by space.
  A single-space user sees no behaviour change: everything lives in the default space.
