  - id: task-2
    title: Pure space resolution in domain/shared
    description: >
      space-resolution.ts exports DEFAULT_SPACE_ID, normalizeRemotePattern, matchesSpaceRule and
      resolveSpace(assignment, rules, path, remoteUrl, defaultSpaceId). Path rules match whole
      segments, ignore trailing slashes and compare Windows drive letters case-insensitively;
      remote rules normalise https/ssh/scp forms, case and .git and support * and **.
      Specificity: assignment > longest matching path prefix or most literal remote pattern >
      lower priority > default.
    state: Done
    dependencies:
      - task-1
    acceptanceCriteria:
      - /code/acme does not match /code/acme-fork
      - C:/Code/Acme matches rule c:/code/acme
      - git@github.com:Acme/Repo.git matches github.com/acme/*
      - Resolution reports its source
    tdd:
      red:
        - Table-driven unit tests for matching and resolution
      green:
        - Implement the functions without third-party imports
      refactor:
        - Name the specificity score
    estimatedEffort: M

