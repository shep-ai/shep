oneLiner: Coordinate confirmed overlapping feature work through an agent-owned decision
summary: >-
  Add an opt-in first-party coordination loop for pairs of feature workcells
  whose committed Git changes overlap. A model chooses whether the currently
  transitioning feature should defer behind one eligible conflicting peer or
  continue concurrently. The existing reparent/stop/gate/rebase/spawn machinery
  enforces deferral; it does not make the coordination choice.
