content: |
  ## Summary

  Core removes the stack lock-in from new projects; the web surfaces say what each path does; docs
  explain the greenfield SDD path.

  ## Acceptance Checklist

  - [x] No stack preamble in any Feature path
  - [x] Spec-driven default for new projects
  - [x] Honest labels on every create surface
  - [x] Existing-folder hint + hand-off
  - [x] Control Center first in the sidebar
  - [x] README + guide
  - [x] Unit, integration, component and e2e tests green
