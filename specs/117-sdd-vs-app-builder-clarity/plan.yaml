content: |
  ## Architecture Overview

  ```
  CLI: shep app new ─┐                       ┌─ blank ──▶ ApplicationProjectAllocator (empty folder)
  Web: composer ─────┼─▶ StartApplicationUseCase ─┤            + Application row
     (Spec/Fast)     │   (ApplicationStarter)     │            + CreateFeatureUseCase(applicationId,
                     │                            │              prompt unchanged, Spec by default)
  Web: Quick ────────┘                            └─ vite-shadcn ▶ CreateApplicationUseCase (template)
  prototype (createApplication)

  Later features: shep feat new (in the app folder) / Add feature / create drawer
      └─▶ CreateFeatureUseCase ── applicationId ?? appRepo.findByPath(repo) ──▶ attached to the app
  ```

  ## Implementation Strategy

  Clean Architecture holds throughout: the starter is a TypeSpec enum, pure rules live in
  `domain/shared`, orchestration in application-layer use cases resolved by string token, and the
  CLI command, server action and components only map input and render.

  1. Domain helpers and the enum come first; both core and web import them.
  2. Slug/folder allocation is extracted from CreateApplicationUseCase before the blank path reuses
     it (refactor before extending a 560-line file).
  3. Oversized UI files are split before being extended (composer mode config/menu, create card).
  4. Copy lands with translations in all 9 locales in the same change.
  5. Docs last, describing what the product now does.

  ## Testing Strategy (TDD: Tests FIRST)

  Every code task runs RED → GREEN → REFACTOR: the failing test lands first, then the minimal
  change, then cleanup.

  - Unit (domain): path detection, name derivation, mode resolution, starter parsing.
  - Unit (use cases): blank app = folder + app + linked spec feature, prompt unchanged, fast honoured,
    background setup logs failures, template delegation; features auto-attach to the owning app.
  - Unit (CLI): default starter, `--starter vite-shadcn`, `--fast`, invalid starter, next steps.
  - Integration: container resolves `StartApplicationUseCase` by string token.
  - Component: composer modes/hint/hand-off; Apps page starters and gating; Add feature; sidebar;
    onboarding; shell-variant hook; webhook hydration.
  - E2E (Playwright): sidebar order, Apps copy and starters, New app → Spec-driven, hand-off URL.
  - Manual CLI run: `shep app new` with the demo agent, then `shep feat new` in the app folder;
    both features carry the app's id.

  ## Risk Mitigation

  | Risk | Mitigation |
  | --- | --- |
  | Path detection false positives on API routes | Whitelisted roots only; negative tests |
  | CreateFeatureUseCase constructor change breaks mocks | Only one test constructs it; updated in the same change |
  | Web bundle breaks on a value import from core | Domain helpers only (no .js suffix); use cases imported as type; build:web |
  | Links to Control Center in the apps-only shell | useCanStartFeatures gates every such entry point |
  | Missing Storybook mock / story | Mock updated; stories for every new component; check:stories |
