content: |
  ## Architecture Overview

  ```
  Composer (web)  ──createProjectAndFeature(action)──▶ CreateProjectFeatureUseCase (core)
     │  mode: spec|fast|application                         ├─ CreateProjectUseCase  (empty folder + git)
     │  existing-folder hint ──▶ /create?repo&mode=spec     └─ CreateFeatureUseCase  (registers repo,
     │                                                         prompt unchanged, default BuildMode.Spec)
     └─ application ──createApplication──▶ CreateApplicationUseCase (Vite + shadcn App Builder, unchanged)

  domain/shared/new-project.ts            NEW_PROJECT_DEFAULT_BUILD_MODE, resolveNewProjectBuildMode,
                                          deriveProjectNameFromDescription
  domain/shared/existing-code-reference.ts findExistingFolderReference(prompt)
  ```

  ## Implementation Strategy

  Clean Architecture holds throughout: pure rules in `domain/shared`, orchestration in an
  application-layer use case resolved by string token, and presentation reduced to mapping input
  and rendering.

  1. Domain helpers are pure and shared by core and the web composer, so they come first.
  2. The use case replaces the server action's inline orchestration; the action keeps only
     input mapping and the fire-and-forget phase 2, mirroring createFeature.
  3. Oversized UI files (applications-page-client 469 lines, control-center-empty-state 614 lines)
     are split before being extended: mode config and the new-application card move to their own
     modules.
  4. Copy changes land with translations in all 9 locales in the same commit.
  5. Docs last, describing what the UI now does.

  ## Testing Strategy (TDD: Tests FIRST)

  Every code task runs RED → GREEN → REFACTOR: the failing test lands first, then the minimal
  change, then cleanup.

  - Unit (domain): path detection positives/negatives (incl. "/health endpoint"), name
    derivation, mode resolution.
  - Unit (use case): prompt forwarded unchanged; default Spec; explicit Fast honoured; project
    failure surfaces as an error and creates no feature; phase 2 uses the created path.
  - Integration: container resolves `CreateProjectFeatureUseCase` by string token.
  - Component: composer default mode per context, mode descriptions, hint visibility + hand-off;
    new-application card options and spec option gating; sidebar order.
  - E2E (Playwright): sidebar order, App Builder copy, spec-driven default in the composer.

  ## Risk Mitigation

  | Risk | Mitigation |
  | --- | --- |
  | Path detection false positives on API routes | Whitelisted roots only; negative tests for `/health`, `/api/users` |
  | Existing tests assert old labels/defaults | Update them in the same task; grep for old strings |
  | Web bundle breaks on a value import from core | Domain helpers only (no .js suffix); use case imported as type; run build:web |
  | Missing Storybook mock / story | Update mock + add stories; run check:stories and build:storybook |
