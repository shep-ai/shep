name: "sdd-vs-app-builder-clarity"
number: 117
branch: "claude/sweet-dijkstra-z16oad"
oneLiner: |-
  Start an app, then add features: every new project is an app that starts either planned on any stack (spec-driven) or from the Vite + shadcn prototype template, and says which
summary: |-
  A user spent two days assuming Shep's Applications "Describe with AI" flow was the spec-driven
  orchestrator and abandoned Shep when it turned out to be a Vite + shadcn generator (issue 896).
  The investigation found the confusion is structural: Shep asked users to learn "everything is a
  feature, start in an empty folder", while people think "start an app, then add features". Worse,
  every web entry point that started a NEW project was stack-locked — the Control Center composer
  defaulted to Application mode and its Fast/Spec modes prepended a hard-coded React + Vite
  preamble.

  This feature adopts the users' model. Every new project is an Application. A new app starts from
  one of two starters — blank (its first feature runs the spec-driven workflow and research picks
  the stack) or the Vite + shadcn prototype template — and every later feature attaches to its
  app. The web UI, CLI and docs all use the same vocabulary and state which stack each option
  produces.
