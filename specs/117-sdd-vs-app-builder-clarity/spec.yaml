name: "sdd-vs-app-builder-clarity"
number: 117
branch: "claude/sweet-dijkstra-z16oad"
oneLiner: |-
  Make the difference between spec-driven Features (any stack) and the Vite + shadcn App Builder impossible to miss, and give new projects a stack-agnostic spec-driven path
summary: |-
  A user spent two days assuming Shep's Applications "Describe with AI" flow was the spec-driven
  orchestrator and abandoned Shep when it turned out to be a Vite + shadcn generator (issue 896).
  The investigation found the confusion is not only copy: every web entry point that starts a
  NEW project is stack-locked. The Control Center composer defaults to Application mode, and its
  Fast / Spec modes prepend a hard-coded "Build this as a React application using Vite" preamble.
  This feature removes the lock-in from the Feature path, makes spec-driven the default for new
  projects, labels every surface honestly, and documents the greenfield SDD path.
