  ## Dependencies

  - **107-auto-commit-rebase-sync** — the admission path wraps `StartFeatureUseCase`, which now
    routes its git sync through `SyncFeatureBranchUseCase`. A queued feature must run that sync at
    *admission* time, not at queue time, or it will start from a stale base.
  - Prior art to follow, not a blocking dependency: `interactiveAgent.maxConcurrentSessions`
    (settings shape, mapper, number input) and `CheckAndUnblockFeaturesUseCase` (reconciler shape).

  ## Risks

  - **Two gates, one queue.** Capacity and parent-dependency gates are independent. Modelling
    "queued" as a second meaning of `Blocked`, or as an untagged `Pending`, makes a user-deferred
    feature auto-start against the user's intent. The queued marker must be explicit and separate.
  - **Silent persistence loss.** Both new columns must be added to the repository INSERT/UPDATE
    column lists, not just the mappers — this exact defect has shipped three times (LESSONS).
  - **Deadlock.** If a slot is released only on a happy-path transition, a crashed or deleted
    running feature leaks its slot forever. The release must be driven by the running-lifecycle
    predicate on every transition (including failure and delete), not by explicit decrement.

  ## Size Estimate

  **L** — one settings field and one feature field, each needing the full four-touch persistence
  chain plus a migration; a new domain helper; two use cases modified and one added; a new
  repository count query on the port and its adapter; three presentation surfaces (web, CLI, TUI)
  plus canvas node wiring; and nine locale files. Individually mechanical, but wide, and the
  admission/release logic needs real integration tests rather than mocks.

