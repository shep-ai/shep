  | `use-cases/features/update/` (lifecycle transition)          | High   | Call site for the reconciler, next to `CheckAndUnblockFeaturesUseCase`                      |
  | `infrastructure/di/` container                               | Medium | Register the new use case with explicit `@inject` tokens (hollow-dependency guard)          |
  | `src/presentation/web/.../settings-page-client.tsx`          | Medium | Number input in the Workflow section + fallback object                                      |
  | `src/presentation/web/.../feature-node`, feature drawer      | Medium | Queued badge, queue position, "start anyway"                                                |
