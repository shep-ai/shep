summary: >
  Add a global `workflow.maxParallelFeatures` setting that caps how many features may have a live
  agent at the same time. When the cap is reached, newly created or manually started features are
  admitted to a FIFO queue instead of spawning an agent; as soon as a running feature frees a slot,
  the oldest queued feature starts automatically. `0` means unlimited, which preserves today's
  behaviour for every existing installation.
