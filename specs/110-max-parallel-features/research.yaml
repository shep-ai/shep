# Structured technology decisions
decisions:
  - title: How a capacity-queued feature is represented
    chosen: >-
      Existing `Pending` lifecycle + a new `queuedAt?: utcDateTime` marker on `Feature`
    rejected:
      - New `SdlcLifecycle.Queued` enum member
      - Reuse `Blocked` for capacity as well as dependencies
      - Untagged `Pending` (no marker)
    rationale: >
      `Pending` already means exactly "fully initialized, no agent spawned, waiting to start" — the
      queue needs no new state, only a record of *who* is holding the feature back. A `Queued` enum
      member would ripple through 36 files that reference `SdlcLifecycle`, and LESSONS.md documents
      that raw string-literal comparisons (`status === 'Pending'`) compile silently and are missed
      by an `SdlcLifecycle.` grep — a high-risk, low-value change. Reusing `Blocked` conflates two
      independent gates: a capacity-queued feature must start the moment a slot frees, while a
      dependency-blocked one must not start until its parent lands. Untagged `Pending` is worse
      still — it would auto-start features the user explicitly deferred with `--pending`. A
      timestamp rather than a boolean because it is simultaneously the flag (`queuedAt != null`),
      the FIFO ordering key, and an honest record of *when the user asked to run* — a feature
      queued later by pressing Start correctly falls in behind features queued earlier, which
      ordering by `createdAt` would get wrong.

  - title: What counts as occupying a slot, and where that predicate lives
    chosen: >
      A `RUNNING_LIFECYCLES` set in a new `domain/shared/parallel-feature-limit.ts`, consumed by
      every surface; counted in SQL via a new `countByLifecycles()` repository method
    rejected:
      - Count `AgentRun` rows with `status = running`
      - Derive the count in each consumer by filtering `list()` in memory
      - A decrementing in-memory counter or semaphore
    rationale: >
      Lifecycle is the durable, single-writer source of truth for "an agent is working on this";
      `AgentRun` rows go stale when a detached worker is killed, and short-lived rebase runs would
      count as feature work. Counting in SQL keeps the check O(1) on an indexed column instead of
      loading every feature into the process on each admission. A counter or semaphore is the one
      genuinely dangerous option: any crashed, force-deleted or externally-mutated feature leaks a
      slot permanently, whereas a derived count is self-healing by construction. LESSONS.md
      ("Shared config semantics belong in domain/") requires the set and the `0 = unlimited` rule
      to be defined once, before the second consumer exists — this feature has at least six.

  - title: Where admission control is enforced
    chosen: >
      An application-layer `FeatureCapacityService` (@injectable collaborator) consulted by
      `CreateFeatureUseCase` and `StartFeatureUseCase`, plus a shared `SpawnFeatureAgentUseCase`
      extracted from the duplicated spawn paths
    rejected:
      - Inline the capacity check in each of the three spawn call sites
      - Enforce inside `IFeatureAgentProcessService.spawn()` (infrastructure)
    rationale: >
      Three call sites already spawn a feature agent — `CreateFeatureUseCase.initializeAndSpawn`,
      `StartFeatureUseCase`, and `CheckAndUnblockFeaturesUseCase` — and the code-quality rule
      "three is a pattern that MUST be extracted" applies before a fourth concern (admission) is
      layered onto each. Extraction also fixes a defect found during this research: the
      `CheckAndUnblockFeaturesUseCase` spawn omits `agentType` and `model` from its options bag, so
      an auto-unblocked child silently starts under the default agent instead of the one its
      `AgentRun` recorded — exactly the "two paths to the same transition disagree" failure
      LESSONS.md warns about. Enforcing inside the process service was rejected because a spawn
      port that silently declines to spawn cannot report a queue position, and it would put a
      business rule in infrastructure.

  - title: How the queue is drained
    chosen: >
      `AdmitQueuedFeaturesUseCase`, invoked from `UpdateFeatureLifecycleUseCase` (event side) and
      from a `get-graph-data` sweep + settings update (state side)
    rejected:
      - Background polling timer / daemon tick
      - Drain only on feature completion
    rationale: >
      This mirrors the dependency gate exactly: `CheckAndUnblockFeaturesUseCase` fires on every
      lifecycle transition and `ReconcileBlockedFeaturesUseCase` sweeps from the state side on
      dashboard load, because — as its own doc comment records — any write that bypasses the
      transition use case would otherwise strand a feature forever. The queue has the same failure
      mode plus two more triggers that are not lifecycle transitions at all: raising the limit and
      deleting a running feature. A polling timer was rejected as a second scheduling mechanism
      with its own liveness bugs; the sweep is one indexed query and is already proven cheap enough
      to run on every dashboard load.

  - title: Default value for `workflow.maxParallelFeatures`
    chosen: '0, meaning unlimited'
    rejected:
      - Default to 3 (matching interactiveAgent.maxConcurrentSessions)
      - Default derived from CPU core count
    rationale: >
      A non-zero default silently changes behaviour for every existing installation on upgrade:
      features that used to start immediately would start queueing, which reads as "Shep is broken"
      with no error message to explain it. A core-count default is worse — the binding constraint
      is usually the agent provider's rate limit, not local CPU, so the number would be confidently
      wrong. `0 = unlimited` is opt-in, and it makes "turn the feature off" expressible without a
      second boolean field.

