decisions:
  - title: Port the code or the ideas
    chosen: >
      Re-implement the method in TypeScript and adapt the prompt texts (INV, DOM, aggregate,
      compose-round, select, experience, the answer-free and evidence-is-data blocks) with an
      Apache-2.0 attribution header and a third-party notice
    rejected:
      - Vendor harness2 and call it as a Python subprocess (Python 3.12 + uv dependency on every install; benchmark-shaped BenchmarkAdapter; OpenCode/Codex/Vertex coupling; bypasses IAgentExecutorProvider)
      - Ideas only, prompts rewritten from scratch (throws away the most tuned part of the release — the prompts encode the paper's lessons, e.g. KEEP_BASE as a valid answer, cheapest-component ordering, confounded-by-default verdicts)
    rationale: >
      About 3,000 of harness2's 7,900 lines are benchmark setup, judges, reporting and
      substrate glue that Shep replaces with its own worktrees, executors and outcome data.
      The method core (tree, recursion, selection, library, ledger) is ~2,600 lines of
      straightforward logic that maps one-to-one onto Shep's layers. The prompts are the part
      worth keeping close to the original.
  - title: What "domain" means in Shep
    chosen: >
      The scope of the existing MemoryScope: Project (repository) by default, Space or
      ProductLine when the repository belongs to one — the same boundary Shep Brain and
      knowledge sources already enforce
    rejected:
      - One global library (lessons from a work repository leak into personal ones)
      - Per feature type or per phase (too few samples per bucket to learn anything)
    rationale: >
      Harness² retrieves "by construction": a domain directory only holds same-domain entries.
      A repository is far more homogeneous than a benchmark domain, so it is the natural unit,
      and the scope boundary is already privacy-reviewed.
  - title: Does a refined harness persist across tasks
    chosen: >
      Yes. An adopted version becomes the scope's current harness for later features (a
      deliberate departure: Harness² restarts every task from the base harness H0 and only
      the improver reads the library)
    rejected:
      - Per-feature only, like the paper (Shep would pay for refinement on every feature to get any benefit)
    rationale: >
      Shep's tasks in one repository share stack, conventions and CI, so an adopted skill or
      script keeps paying off. The risk — drift and always-on bloat — is handled by a hard
      always-on character cap, per-version outcome metrics, regression flags and one-click
      rollback to the parent version.
  - title: Editable surface
    chosen: >
      An additive overlay of eight component kinds (Instructions, Guardrails, Memory,
      ToolGuidance, Skill, Script, Subagent, Hook). Shep's phase prompts are reserved, like
      harness2's RESERVED_SCRIPTS. Memory maps onto Shep Brain entries rather than a file
    rejected:
      - Let the improver rewrite node prompts (they carry workflow contracts — spec YAML schemas, gate behaviour — a bad edit breaks the pipeline, not just quality)
      - Memory as its own harness file (two memory stores that disagree)
    rationale: >
      The paper's component ablation shows skills and scripts carry most of the gain and the
      prompt group the least (−1.5 points). An overlay captures the valuable part without
      letting learning break Shep's own contracts.
  - title: How the harness reaches each agent type
    chosen: >
      An IHarnessInstaller port with a SurfaceSpec per agent type, selected through the
      executor's agent type (never hardcoded in callers). Claude Code: always-on text via
      --append-system-prompt, .claude/skills, .claude/agents, hooks via a Shep-owned settings
      file. Codex: .agents/skills plus always-on text in the prompt. All others: always-on text
      and a skill index as a PromptSection, skills readable from a git-excluded directory
    rejected:
      - Write CLAUDE.md / AGENTS.md into the worktree (collides with the repository's own committed files)
      - Claude Code only (violates the agent-agnostic rule; the skill injector already has this gap)
    rationale: >
      Mirrors harness2's per-substrate SurfaceSpec (OpenCode vs Codex trees) as data, keeps
      the shared logic once, and generalises the skill injector's never-commit pathspec.
  - title: Improver protocol
    chosen: >
      Workspace edits, as in harness2: the improver agent runs with cwd set to a scratch
      evidence workspace containing context/harness/; its edits on disk are the proposal and
      its reply carries only <notes>. Agents without file tools fall back to a JSON file map
      through outputSchema
    rejected:
      - JSON-only proposals (models are worse at emitting whole files as strings; loses the natural edit-in-place behaviour harness2 relies on)
    rationale: >
      Every CLI agent Shep supports can edit files, the workspace is the same shape for
      proposer, composer and reflector, and the validator reads it back.
  - title: Evidence used without ground truth
    chosen: >
      Trajectories plus the work's own signals — tests, lint, typecheck and build run on each
      probe, CI-fix history, gate rejection feedback, validation repairs, review and PR
      comments, cost and turns. Selection stays blind: candidate outputs are anonymised with a
      seeded shuffle and the selector never learns which harness made which
    rejected:
      - Strict answer-free like the paper (Shep's checks are part of the work definition, not a hidden rubric; ignoring them throws away the best signal)
      - Letting the merged PR or later human review score candidates during selection (that is a grader; it may only be used afterwards for metrics, like harness2-judge)
    rationale: >
      The paper's largest failure class is the selector picking a weaker output (a 95 lost to
      a 55). Objective checks per probe directly address it, while blind ids keep the
      selector from favouring the most elaborate harness.
  - title: Where Explore mode probes
    chosen: >
      The implement (or fast-implement) phase only, from the pre-implement git checkpoint, in
      sibling worktrees; k defaults to 1 (4 rollouts, 3 sessions) with a USD cap
    rejected:
      - Probe the whole pipeline (4k full feature runs including gates — unaffordable and needs the user 4k times)
      - Probe every phase (planning phases have weak signals and gates in the middle)
    rationale: >
      Implement has the strongest behavioural signals (tests, build) and dominates cost and
      failures. k = 1 already beats every baseline in the paper; larger k is a setting.
  - title: Adoption policy
    chosen: >
      Candidates are decisions (DecisionKind.HarnessChange). Policy Manual (default),
      AutoTextOnly (auto-adopt candidates touching only text components when they came from a
      probed Explore run) or Auto. Script and Hook components always need a human
    rejected:
      - Always auto-adopt (learned scripts and hooks execute in every later run — a persistent prompt-injection and supply-chain vector)
    rationale: >
      Reuses the decisions inbox every surface already renders, and puts a person in front of
      anything executable.
  - title: Lessons storage
    chosen: >
      A dedicated learned_harness_lessons table read only by improvers, ranked with the
      existing IMemoryRelevanceScorer through a small adapter from lesson to scorable entry
    rejected:
      - A new MemoryCategory in project_memory (would inject improver-facing lessons into solver prompts)
    rationale: >
      In Harness² the library guides refinement, not execution. Facts the solver needs still go
      to Shep Brain; lessons about harness edits stay with the improver.

