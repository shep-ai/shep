name: self-learning-harness
summary: >
  Re-implement Harness² natively in TypeScript inside Shep's clean architecture, adapting its
  prompts (Apache-2.0, attributed) rather than vendoring its Python. Ship the cheap
  harnessing-level loop first (reflect on every run, human-adopted candidates, versioned per
  scope with outcome metrics and rollback), then the task-level Propose–Probe–Compose loop as
  an opt-in Explore mode that probes the implement phase in worktrees forked from one git
  checkpoint.
phase: Research
updatedAt: '2026-10-28'

relatedFeatures:
  - 102-shep-brain
  - 081-skill-injector
  - 119-query-aware-agent-harness
  - 134-unified-decisions
  - 138-git-checkpoints
technologies:
