architecture: |
  ```
                           ┌──────────────── scope (repo / space / product line) ───────────────┐
                           │  learned_harness_versions ── components (8 kinds)                  │
                           │        │ parent ◄─ rollback        │ outcome metrics per version    │
                           │  learned_harness_edits (verdicts)  learned_harness_lessons (cue…)  │
                           └────────┬──────────────────────────────────────┬────────────────────┘
          GetCurrentHarness         │ adopted version                      │ lessons (improver only)
                 ▼                  ▼                                      ▼
   IHarnessInstaller ── per agent type (Claude Code / Codex / prompt-section fallback)
                 │  never committed; overlay on Shep's reserved phase prompts
                 ▼
   feature-agent graph: analyze → … → implement ─┬─(Explore) explore_implement ─┐ → merge → extract_memory → reflect_harness
                                                  │  pre-implement checkpoint    │
                                                  │  k base ─► INV×k, DOM×k ─► probe ─► compose×k ─► probe ─► blind select
                                                  └──────────────────────────────┘        (checks run per probe)
   reflect_harness (Reflect, every run that reached implement):
     BuildEvidenceBundle ─► IEvidenceWorkspace ─► IHarnessImprover (INV ∥ DOM) ─► compose ─► validate (1 retry)
       ─► Candidate version + edit rows + ≤1 lesson ─► DecisionKind.HarnessChange ─► Adopt / Reject (policy, scan)
   IHarnessImprover → IAgentExecutorProvider (agent-agnostic; cwd = evidence workspace; edits on disk = proposal)
  ```

risks:
  - A learned skill, script or hook carries injected instructions into every later run — mitigated by the evidence-is-data prompt block, a static candidate scan, mandatory human adoption for Script and Hook, provenance and rollback
  - Harness drift and always-on bloat across many adoptions — mitigated by the always-on character cap enforced by the validator, per-version outcome metrics, regression flags and rollback to the parent
  - Overlay files leak into the user's commits — mitigated by generalising the skill injector's never-commit pathspec to every installer path, with an integration test on a real git repo
  - Explore mode cost runs away — mitigated by the ledger identity (4k rollouts, 3k sessions) checked after each phase and a USD cap that falls back to the base rollout
  - Reflection on noisy evidence produces confident wrong lessons — mitigated by reflect-only verdicts being untested and lessons capped at Low confidence until an Explore run or outcome metrics support them
  - The overlay reaches only some prompts (LESSONS.md "cross-cutting context must reach every agent prompt") — mitigated by one parametrised test over every prompt builder and the interactive context builder

