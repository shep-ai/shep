  - id: task-27
    title: Web Self-learning settings section
    description: >
      A Self-learning section in Settings, shown when the selfLearning flag is on: mode (Off /
      Reflect / Explore) with a one-line explanation of each, Explore k and USD cap with the
      cost stated (about 4x the implement step at k = 1), adoption policy (Manual,
