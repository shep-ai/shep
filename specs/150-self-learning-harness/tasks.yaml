tasks:
  - id: task-1
    title: TypeSpec enums and entities for the learned harness
    description: >
      Add enums HarnessComponentKind (Instructions, Guardrails, Memory, ToolGuidance, Skill,
      Script, Subagent, Hook), LearnedHarnessStatus (Candidate, Adopted, Rejected, RolledBack,
      Superseded), HarnessOrigin (Base, Reflect, Explore, Manual), HarnessEditDimension (Inv,
      Dom, Compose), HarnessEditVerdict (Helped, Hurt, NoObservedEffect, Confounded, Untested),
      LessonConfidence (High, Medium, Low), LearningMode (Off, Reflect, Explore),
      HarnessAdoptionPolicy (Manual, AutoTextOnly, Auto). Entities LearnedHarnessVersion
      (scope via MemoryScope, repositoryPath, spaceId, productLineId, parentVersionId, status,
      origin, components, notes, sourceFeatureId, metrics), HarnessComponent (kind, path,
      content, sha256), HarnessEditRecord, HarnessLesson, HarnessRefinementRun (mode, k,
      ledger counts, costUsd, chosen label, selection reason), HarnessVersionOutcome
      (per-feature outcome on a version). Regenerate with pnpm generate.
    state: Todo
    dependencies: []
    acceptanceCriteria:
      - pnpm generate produces every enum and entity; pnpm tsp:compile has no warnings
      - Generated output and apis/json-schema are committed exactly as generated
    tdd: null
    estimatedEffort: M
  - id: task-2
