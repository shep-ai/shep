    acceptanceCriteria:
      - Section hidden with the flag off; visible and editable with it on
      - Every field round-trips through update-settings and reloads with its saved value
      - Colocated story covers default, loading, error and flag-off states
      - Writes spread the existing learning sub-object, never rebuild it (LESSONS.md)
    tdd:
      red:
        - Component unit tests for visibility, field changes and the save payload
      green:
        - Implement self-learning-settings-section.tsx and wire it into settings-page-client
      refactor:
        - Reuse settings-rows and timeout-slider controls rather than new inputs
    estimatedEffort: M
  - id: task-28
    title: Per-feature Explore toggle on every create surface
    description: >
      Add exploreHarness (boolean) and exploreK (int) to the Feature entity and the create
      input (TypeSpec, migration column, mapper, repository SQL — the four-edit rule in
      LESSONS.md). CreateFeatureUseCase stores them; the worker routes to explore_implement
      when exploreHarness is set, regardless of the scope mode. Surfaces: a toggle with k and
