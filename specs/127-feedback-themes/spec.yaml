summary: |-
  Spec 126 gave signals and opportunities, but every signal was typed by hand. This feature opens
  the front door. Each space can issue feedback keys; a support tool, a feedback widget or a
  script posts feedback to one endpoint with its key, and shep records a Feedback signal in that
  key's space — with the customer, revenue at stake and a link back. An external id makes
  re-delivery harmless. Unlinked signals are grouped into themes by the words they share, each
  theme showing how many customers and how much revenue stand behind it, and a theme is promoted
  to an opportunity with its signals linked in one step. Keys are stored as hashes, shown once,
  and revocable.
