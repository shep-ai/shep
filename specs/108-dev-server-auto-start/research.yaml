# Research Artifact (YAML)
# This is the source of truth. Markdown is auto-generated from this file.

name: dev-server-auto-start
summary: |
  Verified against the live codebase: the three-tier analyze pipeline, the
  dev_server_run_plans table, DI wiring and SSE log streaming all exist and
  work, so this feature is pure breadth-and-surface on a proven spine. Three
  findings reshape the plan. (1) No TOML parser is needed — every ecosystem
  signal we actually consume is either a sibling file's presence, a JSON/YAML
  document (js-yaml is already a direct dependency), or a line-anchored table
  header, so a new runtime dependency on a published CLI is avoidable. (2) No
  SQLite migration is needed for RunPlanSource.Manual — migration 138 declares
  plan_source as bare `TEXT NOT NULL` with no CHECK constraint and the mapper
  does an unchecked cast, so TypeSpec + `pnpm tsp:codegen` is the entire domain
  change. (3) detectDevScript has a second, undocumented consumer —
  deployment-spawner.spawnFromDetection builds an argv spawn from
  `packageManager` + `scriptName`, which a non-Node detection result cannot
  supply — so widening the detector without a shell fallback there would spawn
  `undefined`. The existing detect-dev-script suite pins exact result objects
  via toEqual, which is satisfiable unmodified only if detector provenance is
  returned as a separate projection rather than as a new field on the result.

