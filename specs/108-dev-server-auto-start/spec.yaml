summary: >
  The requested behaviour — "Start dev" analyzes the project with a deterministic script
  and falls back to an agent that starts the dev server — is ALREADY implemented end-to-end
  by spec 103 (agentic-dev-server): a LangGraph pipeline resolves a run plan via cache →
  deterministic detection → structured agent analysis, then ensures infra, installs deps,
  spawns, verifies readiness, and remediates failures. This feature therefore scopes to the
  residual gaps rather than a greenfield build. Three workstreams: (1) widen the deterministic
  tier from Node-only to the eight ecosystems `CONFIG_FILES` already fingerprints, so
  non-Node repos stop burning agent calls and stop failing outright in degraded mode;
  (2) make the resolved run plan visible, editable and re-analyzable — including a committed
  `.shep/dev.json` tier so an override survives the next feature worktree; (3) add a
  `shep dev` CLI command group so the capability is not web-only, satisfying the repo's
  Presentation-Agnostic Core API rule.
