  ## Dependencies

  Everything this feature builds on already exists and is wired:

  - **`IDevServerAgentService`** + `DevServerAgentService` — accepted-run contract,
    single-flight, degradation, failure routing. Registered in `register-deployment.ts`.
  - **`IDevServerRunPlanRepository`** + `SQLiteDevServerRunPlanRepository` — `findByRepoPath`,
    `upsert`, `deleteByRepoPath`, `stampInstallHash`; table from migration `138`.
  - **`IStructuredAgentCaller`** + `RUN_PLAN_ANALYSIS_SCHEMA` — the agent fallback tier,
    resolved via `safeResolve` so absence degrades instead of failing.
  - **`IAgentExecutorProvider`** — remediation executor, agent-agnostic per AGENTS.md.
  - **`IDeploymentService`** — spawn (`start()` accepts a verbatim `runPlan` override),
    `setTransientState`, `appendLog`, `getStatus`, `getLogs`, `recoverAll`.
  - **`computeConfigHash` / `computeInstallHash`** — `CONFIG_FILES` already enumerates the
    multi-stack manifests the widened detector will target, so cache invalidation for
    non-Node stacks works the moment detection does. `.shep/dev.json` MUST be added to
    `CONFIG_FILES` so editing it invalidates non-Manual caches.
  - **`probeBinaryDefault` / `SUGGESTED_INSTALL`** — the existing cross-platform, timeout-bounded,
    injection-guarded probe that the new ecosystem binaries plug into.
  - **`DeploymentState`** — `Analyzing`/`Installing` already modelled in TypeSpec and rendered
    by `deployment-status-badge`, `web-preview-tab`, `app-view-tabs`, `deployment-status-store`.
  - **SSE log streaming** — `app/api/deployment-logs/route.ts` + `notification-bus.ts`.

  New third-party dependencies: a TOML parser is required for `pyproject.toml` and `Cargo.toml`
  (a YAML parser for `docker-compose.yml` is already present in the workspace — verify before
  adding). Prefer an existing transitive dependency over a new direct one; this is a research-phase
  decision.

  ## Size Estimate

  **M** — days, not weeks, precisely *because* the hard part is already built. The graph,
  persistence, DI wiring, degradation semantics, state machine, and UI state rendering all
  exist and are tested; this feature adds breadth and surfaces on top of a proven spine.

  Justification by workstream:

  - **Multi-stack deterministic detection (~half the effort).** Ten detector modules
    (eight ecosystems + Node/Deno preserved + repo config), each an independent, purely
    functional, fixture-tested unit, plus the precedence registry and the `ensure_infra` /
    `install_deps` widening. Mechanical and low-risk, but there is a lot of it.
  - **Run-plan visibility/override (~quarter).** Three use cases, one TypeSpec enum member and
    codegen, thin server actions, the in-tab disclosure with mandatory Storybook stories, and
    translations.
  - **CLI parity (~quarter).** Straightforward Commander commands over the shared use cases,
    following established command conventions.

  This sits at the **upper bound of M**. The requirements phase added the `.shep/dev.json` tier
  (question 5), which is small on its own but is the item most likely to grow. Two clean de-scope
  levers keep it inside M if planning shows otherwise: drop the repo-config tier to DB-only
  overrides, or narrow question 1 from the broad eight to the core four.

  Risk is low and well-contained: the failure semantics are the delicate part (expected
  failures must surface as `failureReason`, never throw; `capturedLogs` must keep accumulating;
  degraded mode must stay non-fatal), and those contracts are already pinned by existing unit
  and integration tests that will catch regressions. The single highest-risk item is precedence
  regression for existing Node repositories — mitigated by requiring the current
  `detect-dev-script` suite to pass unmodified (NFR-5).
