phases:
  - id: phase-1
    name: "Foundation — domain contracts, detector scaffolding, hashing"
    description: |
      Everything the rest of the feature type-depends on, landed before any behaviour
      changes. Adds RunPlanSource.Manual and a DeploymentTargetType enum in TypeSpec
      (codegen only — research verified no SQLite migration is required), establishes
      the shared detector contracts (result type, Ecosystem constants, SKIP_DIRS, read
      caps, bounded stat-before-read manifest helper, explicit-port extraction), and
      closes the two upstream hashing gaps: CONFIG_FILES coverage (including
      .shep/dev.json) and per-ecosystem install-hash inputs. Comes first because a
      non-Node plan that ships before computeInstallHash knows its lockfile reinstalls
      dependencies on every single start, and would be diagnosed as "the detectors are
      slow" rather than as a caching bug.
    parallel: false

  - id: phase-2
    name: "Detector registry — ten pure modules and one ordered walk"
    description: |
      One focused module per ecosystem, each a pure `(dirPath) => DetectorResult` with
      no dependency on any other detector, fixture-tested against real temp directories.
      Starts by extracting today's Node logic verbatim so the pinned suite stays green,
      then adds Deno, Make, Python, Go, Rust, Ruby, Elixir and Compose, then the
      .shep/dev.json reader. Closes with the composition layer — the ordered
      DETECTOR_REGISTRY, the one-level subdirectory fallback shared by all ecosystems,
      the two public projections, and the spawnFromDetection shell fallback that
      prevents `spawn(undefined, ...)` on the legacy path.
    parallel: false

  - id: phase-3
    name: "Graph integration — tier zero, pinning, infra and install widening"
    description: |
      Wires the registry into the LangGraph pipeline without disturbing its failure
      semantics. analyze.node consumes detectRunPlan, persists the richer fields on
      Deterministic plans, logs the winning tier to the deployment stream (NFR-11), and
      gains a tier-zero .shep/dev.json branch ahead of the cache lookup plus a Manual
      pinning guard that survives configHash drift. remediate stops deleting Manual
      plans. ensure_infra gains ecosystem install hints (data change only — derivation
      is already command-driven). install_deps is proven to work with no packageManager.
      Degraded mode becomes genuinely useful: the "no AI agent configured" terminal
      failure now fires only when every detector falls through.
    parallel: false

  - id: phase-4
    name: "Application layer — target resolver, staleness port, three use cases"
    description: |
      The presentation-agnostic core API. One injectable DeploymentTargetResolver maps
      {targetType, targetId} — and a bare cwd, which only the CLI ever asks about — to a
      repoPath. A small IRunPlanStalenessProbe output port keeps computeConfigHash from
      being imported into application/. Get/Override/Invalidate use cases carry all
      policy: isStale derivation, cwd-subtree confinement, port range, non-empty command,
      and the repo-config conflict outcome that prevents silently accepting a DB override
      that tier zero would shadow. Registered in register-deployment.ts with both class
      registration and the string-token alias the web routes rely on.
    parallel: false

  - id: phase-5
    name: "Web surface — run-plan disclosure in the preview tab"
    description: |
      Three thin server actions mirroring the existing deploy-application.ts shape, and a
      new run-plan component family (disclosure / summary / editor) rendered collapsed by
      default inside web-preview-tab. Split three ways so the mandatory Storybook state
      matrix — default, stale, Manual, repo-config-controlled, editing, validation error
      — is expressible on small components. The Zustand deployment-status-store and the
      shared deployment-status-badge contract are deliberately untouched.
    parallel: false

  - id: phase-6
    name: "CLI parity — the shep dev command group"
    description: |
      `shep dev start|stop|status|logs|plan show|set|clear` over the exact same use cases
      the web actions call — the honest test of the presentation-agnostic rule, since a
      complete surface exercises every use case and exposes any web-shaped assumption.
      The `dev` namespace was verified free against the 34 registered top-level commands.
      Streaming goes through use cases rather than the SSE route, so the CLI never
      depends on the web daemon.
    parallel: false

  - id: phase-7
    name: "Documentation, hygiene and full local verification"
    description: |
      Document the .shep/dev.json schema and the detector precedence order so neither
      requires reading code. Correct spec 103's stale phase field. Run the full local CI
      sequence (lint, format:check, typecheck, test:unit, test:int, build,
      build:storybook) and the clean-arch grep for direct repository/infrastructure
      imports in presentation.
    parallel: false

