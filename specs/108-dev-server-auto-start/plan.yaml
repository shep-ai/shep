# Implementation Plan (YAML)
# This is the source of truth. Markdown is auto-generated from this file.

name: dev-server-auto-start

summary: |
  Breadth-and-surface work on the already-proven spec-103 dev-server spine. Three
  workstreams land in dependency order behind one structural change: the Node-only
  `detect-dev-script.ts` becomes an ordered detector registry of small pure modules,
  exposed through TWO projections over ONE registry walk — `detectRunPlan()` (rich,
  carries detector provenance, consumed by `analyze.node.ts`) and `detectDevScript()`
  (byte-identical legacy shape, consumed by `deployment-spawner.spawnFromDetection`).
  That split is what lets the pinned 492-line `detect-dev-script.test.ts` suite pass
  unmodified, which is this feature's single strongest regression guard (NFR-5).

  Research settled three questions that shrink the plan: no TOML parser is needed
  (sibling-lockfile presence + line-anchored header/key scans cover every signal we
  actually consume; `js-yaml` is already a direct dependency for Compose), no SQLite
  migration is needed for `RunPlanSource.Manual` (migration 138 declares
  `plan_source TEXT NOT NULL` with no CHECK constraint and the mapper casts unchecked),
  and `.shep/dev.json` must sit at tier ZERO — before the run-plan cache in
  `analyze.node.ts`, re-read every start and persisted only as a projection so
  `stampInstallHash` has a row to update.

  Two hazards drive task ordering. `spawnFromDetection` destructures `packageManager`
  and `scriptName` off the detection result and passes them to `spawn` as argv, so
  widening the detector without a `shell: true` fallback there spawns `undefined`.
  And `computeInstallHash` returns `''` for any repo without a Node lockfile, which
  makes `isFresh` permanently false — every non-Node start would silently re-run its
  setup commands. Both are fixed in the foundation and detector phases, before any
  ecosystem detector can reach production paths.

