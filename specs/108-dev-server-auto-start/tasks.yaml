    url: "https://docs.docker.com/reference/compose-file/services/"
  - title: "PEP 621 — pyproject.toml project metadata"
    url: "https://peps.python.org/pep-0621/"
  - title: "Cargo manifest reference"
    url: "https://doc.rust-lang.org/cargo/reference/manifest.html"
  - title: "Deno — deno.json tasks"
    url: "https://docs.deno.com/runtime/reference/cli/task/"
  - title: "Phoenix — mix phx.server and the default 4000 port"
    url: "https://hexdocs.pm/phoenix/up_and_running.html"
  - title: "Django — manage.py runserver and the default 8000 port"
    url: "https://docs.djangoproject.com/en/stable/ref/django-admin/#runserver"
  - title: "GNU Make — rule syntax and .PHONY targets"
    url: "https://www.gnu.org/software/make/manual/html_node/Rule-Syntax.html"
  - title: "Vitest — expect.toEqual ignores undefined properties"
    url: "https://vitest.dev/api/expect.html#toequal"

