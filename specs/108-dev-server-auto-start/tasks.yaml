# Markdown content (the full tasks document)
content: |
  ## Status

  - **Phase:** Implementation
  - **Updated:** 2026-08-09

  ## Summary

  Forty-three tasks across seven phases, ordered by hazard rather than by feature area.

  The **foundation** lands first because two upstream gaps would poison every later
  measurement: `computeInstallHash` knows only Node lockfiles, so a non-Node plan shipped
  before it is extended would silently re-run its setup commands on every start and present
  as slow detection rather than as a caching bug; and the shared detector contracts must be
  settled before ten modules are written against them. TypeSpec codegen for
  `RunPlanSource.Manual` and `DeploymentTargetType` lands here too, so later phases pick them
  up without churn. Research verified no SQLite migration is required — that verification is
  itself an acceptance criterion rather than an assumption.

  The **detector registry** is built next, in full, before anything wires it into a
  production path. The Node detector is extracted verbatim first, with the pinned 492-line
  `detect-dev-script.test.ts` passing unmodified as its acceptance criterion — that suite is
  the strongest guard against the spec's highest-risk item. Each of the eight ecosystems then
  arrives as an independent, purely functional, fixture-tested module that gates on
  `existsSync` before reading, followed by the `.shep/dev.json` reader. The phase closes with
  the composition layer — the ordered registry, the shared subdirectory fallback, the two
  public projections — and the `spawnFromDetection` shell fallback, so the legacy spawn path
  can never observe a non-Node result before it is able to handle one.

  **Graph integration** then changes one node per task, each with its own RED test, so any
  regression in the delicate "expected failures never throw" contract is attributable to a
  single node. Tier zero, the two Manual-pinning guards, the `ensure_infra` hint data and the
  non-Node install path all land here, and the phase exits on a multi-stack integration sweep
  that asserts zero structured-agent calls for every covered ecosystem — the behavioural
  heart of the feature.

  The **application layer** follows: one shared target resolver, a small staleness port that
  keeps `computeConfigHash` out of `application/`, and the three use cases carrying every
  piece of policy — `isStale` derivation, cwd confinement, port range, non-empty command, and
  the repo-config conflict outcome that stops the UI from silently accepting an override the
  committed file would shadow.

  Both presentation surfaces consume those same use cases. The **web** adds three thin server
  actions and a three-part component family so the mandatory Storybook state matrix is
  expressible on small components; the **CLI** adds the full `shep dev` group, which is the
  honest test of the presentation-agnostic rule because a complete surface exercises every
  use case and would expose any web-shaped assumption in the ports.

  The final phase documents the `.shep/dev.json` schema and the precedence order so neither
  requires reading code, corrects spec 103's stale phase field, and runs the full local CI
  sequence before push.
