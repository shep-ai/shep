# Task Breakdown (YAML)
# This is the source of truth. Markdown is auto-generated from this file.

name: dev-server-auto-start

summary: |
  43 tasks across 7 phases — TypeSpec/hashing foundation and shared detector contracts,
  ten pure ecosystem detectors plus the ordered registry and the spawner shell fallback,
  LangGraph integration (tier-zero .shep/dev.json, Manual pinning, ensure_infra and
  install_deps widening), three use cases over a shared target resolver, the web run-plan
  disclosure, the shep dev CLI group, then docs and full local verification.

relatedFeatures:
  - "103-agentic-dev-server"
  - "079-fix-dev-server"
  - "055-deployment-status-indicator"
  - "061-default-env-deployment"

technologies:
  - "TypeScript (ESM, NodeNext)"
  - "LangGraph (@langchain/langgraph)"
  - "tsyringe"
  - "TypeSpec"
  - "better-sqlite3"
  - "js-yaml"
  - "Commander"
  - "Next.js App Router"
  - "React + Storybook"
  - "Vitest"

relatedLinks:
