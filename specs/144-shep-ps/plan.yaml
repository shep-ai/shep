architecture: |
  ListShepProcessesUseCase reads IDaemonService and ListAgentRunsUseCase, checks liveness with
  IProcessLivenessProbe, samples CPU and memory for live PIDs with one IProcessStatsProbe call,
  joins feature names, and returns sorted rows with a ShepProcessState. StopShepProcessUseCase
  resolves a run or feature id (or prefix) and delegates to StopAgentRunUseCase. The command
  renders rows as a table, JSON or a redrawn table.

risks:
  - ps output differs between procps and BSD ps; the parser takes whitespace-separated columns and skips malformed lines

content: |
  ## Status

  - **Phase:** Planning
  - **Updated:** 2026-10-24

  ## Architecture Overview (Clean Architecture)

  ```
  shep ps ──► ListShepProcessesUseCase (application)
                 ├─ IDaemonService.read()             daemon.json
                 ├─ ListAgentRunsUseCase              runs (crashed runs reconciled first)
                 ├─ IFeatureRepository.list()         feature names
                 ├─ IProcessLivenessProbe             alive?
                 ├─ IProcessStatsProbe.sample(pids)   one ps call (infrastructure)
                 └─ GetWorkerLogPathUseCase           log path of feature workers
  shep ps stop ──► StopShepProcessUseCase ──► StopAgentRunUseCase
  shep status  ──► SampleProcessStatsUseCase ──► IProcessStatsProbe
  ```

  ## TDD

  Each core unit gets a failing test first (RED), then the implementation (GREEN), then
  refactoring. The command is tested through seams; the e2e runs the built CLI.
