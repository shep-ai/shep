  - id: task-2
    title: IProcessStatsProbe and the ps adapter
    description: One batched ps call; pure parser; Windows and failures return an empty map.
    state: Done
    dependencies: []
    acceptanceCriteria:
      - argv is ps -o pid=,pcpu=,rss= -p <comma-separated pids>
      - rss is converted from KiB to bytes; malformed lines are skipped
