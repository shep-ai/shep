      refactor: []
    estimatedEffort: M

  - id: task-5
    title: shep status through the probe
    description: Remove the command's own ps shell-out; output unchanged.
    state: Done
    dependencies:
      - task-3
    acceptanceCriteria:
      - status.command.test.ts passes with the use case mocked instead of child_process
    tdd: null
    estimatedEffort: S

