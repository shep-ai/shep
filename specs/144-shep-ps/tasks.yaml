      green:
        - Implement and register under 'IProcessStatsProbe'
      refactor: []
    estimatedEffort: S

  - id: task-3
    title: List, sample and stop use cases
    description: >
      ListShepProcessesUseCase builds sorted rows; SampleProcessStatsUseCase serves shep status;
      StopShepProcessUseCase resolves ids and delegates to StopAgentRunUseCase.
    state: Done
    dependencies:
      - task-1
      - task-2
    acceptanceCriteria:
      - Live processes and crashed runs by default; exited runs only with includeAll
      - Daemon first, then running, crashed, exited; newest first within each
      - Stop refuses the daemon and ambiguous prefixes
    tdd:
