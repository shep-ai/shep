oneLiner: A process monitor of Shep's daemon and agent workers, with CPU, memory, uptime, --json, --watch and stop
summary: >
  `shep ps` lists the processes Shep runs on this machine: the web daemon and every agent
  worker, with the feature it serves, its agent, status, uptime, CPU and memory. Runs whose
  process died while still marked active show as crashed. `--json` gives machine-readable rows,
  `--watch` redraws every 2 seconds, `--all` adds exited runs, and `shep ps stop <id>` stops an
  agent run by run or feature id. Modelled on oh-my-pi's `omp ps` and Claude Code's
  `claude agents --json`.

