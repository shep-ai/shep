oneLiner: |-
  A hidden-ref git checkpoint after every feature-agent step, so each step's changes can be
  diffed, compared with any other step, and rolled back in the feature's own worktree
summary: |-
  After each LangGraph node that can change a feature's worktree (analyze, requirements,
  research, plan, implement, every repair node, fast-implement, merge with its CI-fix loop,
  and the exploration prototype nodes) Shep snapshots the whole worktree into
  `refs/shep/checkpoints/<featureId>/<seq>-<node>` with a temporary `GIT_INDEX_FILE`
  (`read-tree HEAD`, `add -A`, `write-tree`, `commit-tree`, `update-ref`, `core.fsync`), so the
  user's branch and index are never touched. Each checkpoint is recorded in SQLite with the node,
  time, ref, commit, tree and a change summary against the previous checkpoint. The web feature
  drawer gains a Checkpoints tab (per-step diff, diff between any two steps, restore), and the
  CLI gains `shep feat checkpoints <id>`, `shep feat diff <id> --from <step> --to <step>` and
  `shep feat restore <id> <step>`. Restore only runs in the feature's own linked worktree while
  no agent is running, and never rewrites branch history. Refs and rows are deleted when the
  worktree is removed or the feature is archived.
