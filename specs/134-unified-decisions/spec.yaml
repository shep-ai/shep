summary: |-
  Shep has three renderers and three option shapes for the same moment: the chat bubble
  (`{label, description, preview}`), the PRD questionnaire (`{id, label, rationale, recommended}`)
  and the agent-questions inbox (`string[]`). The bridge that should send chat questions to the
  inbox is never constructed, gate questions show up in the inbox as a raw JSON blob, the chat
  bubble sits below the timeline instead of inside the turn that asked, `preview` is never
  rendered, and headless agents are told never to ask. This feature introduces one `Decision`
  model (questions with options `{id, label, description, preview?, recommended?}`,
  `multiSelect`, `allowCustom`, a `responseMode` of Live | Async | NotResumable and an optional
  `defaultAfter` deadline), one web `DecisionPanel` that follows T3 Code's inline-options
  interaction model, one CLI renderer, and routes every producer through them. Part 2 lets a
  headless agent ask through an `ask_decision` MCP tool, always with a recommended option and a
  deadline; when nobody answers in time the agent proceeds with the recommendation and the
  feature's activity log says so.
