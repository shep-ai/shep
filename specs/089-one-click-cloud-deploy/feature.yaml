    - id: ci-red-pr-554
      severity: critical
      blocking: true
      discoveredAt: '2026-04-14T02:00:00Z'
      summary: >
        PR #554 has 8 failing CI checks. Root cause of the seven build-path
        failures is a Next.js module-not-found error on
        packages/core/src/application/use-cases/cloud-deploy/
        initiate-cloud-deployment.use-case.ts:18 which imports
        ApplicationNotFoundError from a sibling use-case file via
        './select-cloud-provider.use-case.js'. Next.js cannot resolve
        cross-use-case '.js' suffix imports inside the core package at
        bundle time. This is exactly clean-arch violation #19 in
        clean-arch-violations.md — the error class should live in
        domain/errors/application-not-found.error.ts. Fixing #19 also
        fixes the web build. Gitleaks also flags
        src/presentation/web/components/features/settings/
        agent-settings-section.stories.tsx (a file NOT touched by this
        PR) — needs baseline investigation.
      resolution: Task t-59 — relocate ApplicationNotFoundError to domain/errors/
