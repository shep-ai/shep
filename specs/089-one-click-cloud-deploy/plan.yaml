  │                            ├── git-status-cluster.tsx                     │
  │                            ├── session-chip.tsx                           │
  │                            ├── run-dev-button.tsx (existing)              │
  │                            ├── create-github-repo-button.tsx  ◄── NEW    │
  │                            ├── deploy-button.tsx              ◄── NEW    │
  │                            │     └── provider-dropdown.tsx               │
  │                            │           └── connect-provider-modal.tsx    │
  │                            └── view-switcher.tsx                          │
  │                                                                           │
  │  hooks/use-cloud-deploy-action.ts  (consumes SSE + use cases)             │
  │  hooks/use-dev-server-coordinator.ts  (extracted orchestration)           │
  │                                                                           │
  └───────────────────────────────┬───────────────────────────────────────────┘
                                  │
                          HTTP + Server-Sent Events
                                  │
  ┌───────────────────────────────▼───────────────────────────────────────────┐
  │ Web API routes (thin — each calls exactly one use case)                   │
  │                                                                           │
  │  /api/cloud-providers                                                     │
  │  /api/cloud-providers/[provider]/connect                                  │
  │  /api/cloud-providers/github/{auth-status,auth-login}                     │
  │  /api/applications/[id]/cloud-deploy/{select-provider,initiate,status}    │
  │  /api/applications/[id]/git/create-remote                                 │
  │  /api/agent-events  ◄── extended with cloud_deployment.updated            │
  └───────────────────────────────┬───────────────────────────────────────────┘
                                  │
                              use cases
                                  │
  ┌───────────────────────────────▼───────────────────────────────────────────┐
  │ Application layer (use cases + ports)                                     │
  │                                                                           │
  │  ListCloudProvidersUseCase                                                │
  │  ConnectCloudProviderUseCase                                              │
  │  SelectCloudProviderUseCase                                               │
  │  InitiateCloudDeploymentUseCase ────► ICloudDeploymentProviderRegistry    │
  │       │                                        │                         │
  │       ├── onProgress ──► ICloudDeploymentEventBus (port)                  │
  │       └── persist ──► IApplicationRepository.update(...cloud fields)     │
  │  GetCloudDeploymentStatusUseCase                                          │
  │  CreateGitRemoteUseCase ─────────────► IGitRemoteService                  │
  │  EnsureGhAuthenticatedUseCase                                             │
  │  StreamAgentEventsUseCase (extracted from SSE route)                     │
  │  StartApplicationDeploymentUseCase (extracted from server action)        │
  │  CommitApplicationChangesUseCase (replaces in-JSX placeholder)           │
  │                                                                           │
  │  NEW PORTS: ICloudDeploymentProvider, ICloudDeploymentProviderRegistry,   │
  │             ICloudProviderTokensRepository, IGitRemoteService,            │
  │             ILogger, ICloudDeploymentEventBus                             │
  └───────────────────────────────┬───────────────────────────────────────────┘
                                  │
  ┌───────────────────────────────▼───────────────────────────────────────────┐
  │ Infrastructure                                                            │
  │                                                                           │
  │  CloudflarePagesProvider  (implements ICloudDeploymentProvider) ◄─ LIVE   │
  │  VercelProviderStub, NetlifyProviderStub, AwsAmplifyProviderStub,         │
  │    GcpCloudRunProviderStub  (enabled = false, throw on deploy)            │
  │  CloudDeploymentProviderRegistry (string-token DI, iterates enum)         │
  │  GitRemoteService         (wraps injected ExecFunction for gh + git)      │
  │  LocalSecretBox           (AES-256-GCM, zero deps)                        │
  │  SecretKeyFile            (~/.shep/secret.key, mode 0600, atomic wx)      │
  │  SqliteCloudProviderTokensRepository (3 BLOB columns)                     │
  │  InMemoryCloudDeploymentEventBus (EventEmitter-backed)                    │
  │  ConsoleLogger            (ILogger impl)                                  │
  │                                                                           │
