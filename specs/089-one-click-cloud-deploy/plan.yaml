  ## Implementation Strategy

  **MANDATORY TDD**: every phase with executable code follows RED → GREEN → REFACTOR.
  Foundation phases (TypeSpec, migrations, stubs) ship without tests because they have
  no runtime behavior to assert.

  ### Why the phase order

  1. **Domain first** — TypeSpec + regeneration has to succeed before any application
     code can reference `CloudDeploymentProvider` or `CloudDeploymentStatus`. The
     featureId helper extraction (violation #11) also lives here so later phases import
     the helper from the start rather than retrofitting it.
  2. **Crypto + tokens before repositories** — InitiateCloudDeployment depends on the
     CloudflarePagesProvider which reads tokens. Getting secret storage done early
     unblocks every downstream phase.
  3. **Application repository extension** — persistence of cloud deploy state is the
     integration surface between all upstream layers and the UI. Once the mapper +
     repository know about the new fields, use cases can update them freely.
  4. **Ports before adapters** — pure type definitions so adapters can be written
     against a stable interface. Registry + GitRemoteService are also unit tested here.
  5. **Cloudflare live adapter** — the single most complex piece of code in the feature.
     Isolated phase so it can iterate without blocking stubs, use cases, or UI.
  6. **Stub providers** — trivially parallel and independent.
  7. **Use cases** — thin orchestration, independently testable. This phase also ingests
     violations #1-#3 by creating `StartApplicationDeploymentUseCase` and rewriting
     `deploy-application.ts` to a thin adapter.
  8. **DI wiring** — everything from phases 2-7 gets registered. Splitting container.ts
     (violation #12) is done here because every new binding would otherwise widen the
     existing 831-line file.
  9. **Web API routes** — thin HTTP adapters around use cases. Parallelizable.
  10. **Web UI** — components + stories + splitting application-page.tsx. Ingests
      violations #8, #9, #10 by creating a dev-server coordination hook, extracting
      subcomponents into their own files, and wiring the placeholder commit buttons to
      a real use case.
  11. **SSE extension** — last because it consumes every upstream concept. This phase
      also ingests violations #4, #5, #6, #7, #13 by creating StreamAgentEventsUseCase,
      hiding `isProcessAlive` behind a port, adding an InteractiveSessionEventType
      TypeSpec enum, extracting the shared SdlcLifecycle→node mapping, and routing
      console output through ILogger.
  12. **Verify** — the full CI gate must pass locally, plus one Playwright smoke test.

  ### Parallelization strategy

  Phases 4, 6, 7, 9, 10 are marked `parallel: true`. Within each, tasks with no
  shared-file conflicts are dispatched to subagents in batches of 3-5. Explicit
  dependencies between tasks are declared in `tasks.yaml` so the executor respects
  them even inside a "parallel" phase. Phases with shared files (2, 3, 5, 8, 11) are
  sequential inside the phase.

  ## Files to Create / Modify

  See `filesToCreate` and `filesToModify` arrays at the top of this file.
  Total: 58 new files, 11 modified files.

  ## Testing Strategy (TDD: Tests FIRST)

  ### Unit tests (RED → GREEN → REFACTOR)

  - `LocalSecretBox` — round-trip, wrong-key failure, tamper-detection.
  - `SqliteCloudProviderTokensRepository` — round-trip, replace existing, remove, listConnected; assert ciphertext on disk differs from plaintext.
  - `SqliteApplicationRepository` (extension) — persist and load all seven new fields; preserve on update.
  - `CloudDeploymentProviderRegistry` — listAll across the five providers; get() throws for disabled.
  - `CloudflarePagesProvider` — fetch-mocked happy path, 403 on bad token, wrangler fallback when HTTP fails, status polling transitions.
  - `GitRemoteService` — happy path, gh not authenticated error, already-committed idempotency.
  - Every cloud-deploy use case — happy path + one failure mode (missing token, disabled provider, build output missing, gh not authed, etc.).

  ### Integration tests

  - Migrations 060 + 061 against an in-memory SQLite DB; assert columns and table exist and are idempotent (re-running `up()` is a no-op).
  - ConnectCloudProviderUseCase end-to-end with a mock fetch; verifies token persists encrypted.
  - InitiateCloudDeploymentUseCase end-to-end with in-memory repos + mock Cloudflare provider + in-memory event bus; verifies persisted Application state transitions through Uploading → Deploying → Deployed.

  ### E2E

  - One Playwright smoke test (`src/presentation/web/e2e/cloud-deploy.spec.ts`): seed an application with `setupComplete=true`, override the `ICloudDeploymentProvider:CloudflarePages` binding with a test fake, click Deploy, assert the button transitions and the URL chip renders. Uses an existing test-seam pattern if one exists; otherwise documents the gap in the PR description.

  ### Storybook

  - Colocated `.stories.tsx` file required for every new component. Tests that Storybook builds cleanly via `pnpm build:storybook` in phase 12.

  ## Risk Mitigation

  | Risk | Mitigation |
  | ---- | ---------- |
  | Cloudflare direct-upload HTTP contract differs from wrangler | Ship HTTP happy path + wrangler CLI fallback; integration tests mock both. |
  | `gh` CLI not installed on user machine | Detect at connect time; show clear error with install link. Existing git-fork.service already has this gap — we surface it better. |
  | Cloudflare token leaked in logs | Provider adapter NEVER logs the token; SSE events sanitize error messages. |
  | Windows file mode 0600 is advisory | Document in adapter header; rely on parent ~/.shep/ being 0o700 (already the case). |
  | Migration 060 column list drifts from mapper | Single migration test asserts pragma('table_info') includes every new column. |
  | Application page split breaks existing behavior | Phase 10 runs after all non-UI phases; Storybook + manual dev-server smoke test before merge. |
  | Clean-arch refactors expand scope | Violations are grouped into the phase that already touches the file; no speculative drive-bys. |
  | SSE route orchestration extraction is invasive | Done in dedicated phase 11 with a StreamAgentEventsUseCase that yields domain events; route shrinks to SSE framing only. |
  | DI container split may miss a registration | Composition-root bootstrap module unit-tested: resolves every declared token and asserts a non-null instance. |

  ## Clean-Arch Violation Integration

  All 13 entries in `specs/089-one-click-cloud-deploy/clean-arch-violations.md` are
  mapped to existing phases rather than dumped at the end. This avoids speculative
  refactors and ensures each fix happens in the phase that already has the file open:

  | # | Violation | Phase | Task |
  | - | --------- | ----- | ---- |
  | 1 | deploy-application.ts imports infrastructure logger | 7 | t-28 (StartApplicationDeploymentUseCase) |
  | 2 | deploy-application.ts bypasses use cases | 7 | t-28 |
  | 3 | deploy-application.ts uses node:fs existsSync | 7 | t-28 |
  | 4 | SSE route hosts business orchestration | 11 | t-48 (StreamAgentEventsUseCase) |
  | 5 | SSE route imports `isProcessAlive` from infrastructure | 11 | t-48 |
  | 6 | SSE route hardcodes interactive-session event types | 1 + 11 | t-01 + t-48 |
  | 7 | SSE route duplicates SdlcLifecycle→node mapping | 11 | t-49 (shared module) |
  | 8 | application-page.tsx orchestrates dev-server lifecycle | 10 | t-46 (use-dev-server-coordinator) |
  | 9 | application-page.tsx is 867 lines | 10 | t-47 (split subcomponents) |
  | 10 | Placeholder commit/commit-push in component | 10 | t-47 (CommitApplicationChangesUseCase + wiring) |
  | 11 | `app-` / `feat-` featureId prefix magic literal | 1 | t-03 (shared domain helper) |
  | 12 | container.ts is 831 lines | 8 | t-32 (modular split) |
  | 13 | `console.*` inside use cases + SSE route | 1 + 11 | t-02 (ILogger port) + t-50 |

