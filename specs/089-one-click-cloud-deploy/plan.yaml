content: |
  ## Status

  - **Phase:** Planning complete
  - **Updated:** 2026-04-13
  - **Task count:** 52 tasks across 12 phases
  - **Includes:** full v1 feature work + fixes for 13 clean-arch violations found during research

  ## Architecture Overview

  ```
  ┌─────────────────────────────── Web UI (thin) ─────────────────────────────┐
  │                                                                           │
  │  application-page.tsx ── app-top-bar.tsx                                  │
