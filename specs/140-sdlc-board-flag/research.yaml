relatedLinks: []

# Structured technology decisions
decisions:
  - title: Default value and storage of the flag
    chosen: '`sdlcBoard = false` in TypeSpec and defaults, migration 170 column DEFAULT 0'
    rejected:
      - 'Default on, flipped later — contradicts the owner decision'
      - 'Env-var only flag — would not show on the flags view and would not persist'
    rationale: >
      Every catalog flag is a persisted settings column. DEFAULT 0 turns the board off for
      existing installs too, which is the owner's decision; users who want it turn it on.
  - title: Where the flag is listed
    chosen: Platform group of FEATURE_FLAG_CATALOG
    rejected:
      - 'SoftwareFactory — the board is not part of the software-factory areas'
      - 'Experimental — the board is a finished view, not an experiment'
    rationale: The board is a cross-feature product view like Projects or code review.
  - title: How API routes answer while a flag is off
    chosen: A shared `featureNotFound()` 404 helper in `lib/feature-gate.ts`, used by
      /api/sdlc-events and the existing feedback/alerts intake routes
    rejected:
      - 'Reuse `intakeDisabled()` from the intake module — wrong module for an SSE route'
      - 'A second copy of the 404 response — duplication'
    rationale: >
      Spec 135 added `intakeDisabled()` for two intake routes; a third gated route makes it a
      shared concern, so it moves to a feature-gate module that `requireFeaturePage` also uses.
  - title: How server actions refuse while the flag is off
    chosen: Return `{ error }` with a shared message before resolving the use case
    rejected:
      - 'Throw — the board client already handles the `{ error }` result shape'
      - 'Leave actions ungated — they stay callable by action id even when the page is gone'
    rationale: Matches the actions' existing result contract.
  - title: Agent-side board tracking
    chosen: Keep recording board tasks regardless of the flag
    rejected:
      - 'Stop the tracker while the flag is off — turning the flag on would show a partial board'
    rationale: The flag hides a view; it does not change what the agent records.

