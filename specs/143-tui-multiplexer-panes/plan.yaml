architecture: |
  Detection is a pure domain function over an environment record. The application layer
  defines ITerminalPaneLauncher (detect, open, defaultShell) and OpenFeaturePaneUseCase, which
  resolves the feature, picks the directory (worktree on disk, else repository), builds the
  command (none for a shell, `shep feat logs -f <id>` for the log) and either opens a pane or
  returns an inline plan when no multiplexer is present. Infrastructure holds one pure argv
  builder per multiplexer and an adapter that runs it through ExecFunction.

  The console maps t/T/f/F to the use case. On an inline plan the app stops the TUI, runs the
  command with inherited stdio while ignoring SIGINT, then restarts and redraws. The filter is a
  core pure function; notifications are escape sequences chosen from the terminal environment.

risks:
  - Zellij's new-tab takes no command; a window with a command opens as a floating pane instead
  - kitty needs allow_remote_control; the error says so
  - Ctrl+C during an inline log reaches the console's process group; the console ignores SIGINT until the child exits

content: |
  ## Status

  - **Phase:** Planning
  - **Updated:** 2026-10-24

  ## Architecture Overview (Clean Architecture)

  ```
  shep tui ── t/T/f/F ──► OpenFeaturePaneUseCase (application)
                              ├─ IFeatureRepository (find by id or prefix)
                              ├─ IWorktreePathProvider + IFileSystemService (directory)
                              └─ ITerminalPaneLauncher (port)
                                    ├─ detect()  → domain detectTerminalMultiplexer(env)
                                    └─ open()    → infrastructure argv builders → ExecFunction
           ◄── Opened | Inline{cwd, command} | Failed
  Inline → app stops the TUI, runs the command with inherited stdio, restarts
  / ──► filterConsoleRows (application, pure)
  snapshot diff ──► terminalNotification(env) → BEL / OSC, tmux passthrough
  ```

  Dependencies point inward: the presentation layer reaches the launcher only through the use
  case, and the use case only through its port.

  ## TDD

  Every core task starts RED: detector, argv builders, adapter, use case and filter each get a
  failing test first, then GREEN, then REFACTOR. The view and app are driven by the existing
  fake terminal. The tmux e2e runs the built CLI in a real tmux server.
