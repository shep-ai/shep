summary: >
  The UI half is assembly over parts that already exist: shadcn's sidebar
  supports collapsible="icon", ui/file-tree.tsx is a working Radix TreeView,
  and app-shell already has `pathname` for route gating. The real work is that
  sessions become mutable for the first time — a delete capability on a
  read-only port with three provider implementations, and archive state for
  entities that deliberately have no database row. Tree assembly must live in a
  use case, because it joins three separate data sources and the
  adopted/unadopted determination is a domain rule, not a rendering concern.
