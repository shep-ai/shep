# Structured technology decisions
decisions:
  - title: Where the tree is assembled
    chosen: New BuildSessionTreeUseCase returning a ready-to-render view model
    rejected:
      - Assemble in the React component from three separate fetches
      - Extend ListSessionsForPathsUseCase to also return features
    rationale: >
      The tree joins repositories, features, and sessions, and decides which
      sessions are adopted by matching Feature.sourceAgentSessionId. That join
      and that rule are business logic — the project's code-quality rules put
      them in a use case and require presentation to receive data ready-to-use.
      Extending ListSessionsForPathsUseCase would overload a focused, cached,
      hot-path use case with an unrelated concern; composing it instead keeps
      its 30s cache intact.
  - title: How adopted sessions are identified
    chosen: Bulk map of sourceAgentSessionId built from the already-listed features
    rejected:
      - New IFeatureRepository.findBySourceAgentSessionId per session
      - New SQL index and a dedicated query per tree build
    rationale: >
      The tree already lists every feature to build its middle level, so the
      adopted-session mapping is free — build a Map from sourceAgentSessionId to
      feature while walking that list. A per-session repository lookup would be
      N queries for data already in memory. No new repository method is needed
      after all, which removes a change the spec had planned.
  - title: Where session archive state lives
    chosen: New archived_agent_sessions marker table, one row per archived session
    rejected:
      - Materialise every discovered session into a sessions table
      - Store an archived-ids array in settings JSON
      - Rename or move the provider transcript file
    rationale: >
      AgentSession is documented as read from provider storage and deliberately
      not a shep row; materialising all of them would invert that and require
      sync. Archived sessions are the sparse exception, so a marker table keyed
      by (agent_type, session_id) stores only what is true. Unarchive is a row
      delete, which makes the reversibility guarantee trivial to honour. A
      settings array would grow unbounded and be unqueryable; touching provider
      files would break the "archive never modifies provider data" promise.
  - title: How transcript deletion reaches the providers
    chosen: Optional delete(id) on IAgentSessionRepository plus a capability probe
    rejected:
      - Required delete(id) on the port
      - A separate ITranscriptDeleter port
      - Delete the file directly from the use case
    rationale: >
      Making delete required would force StubSessionRepository and every future
      provider to implement a destructive operation they may not support.
      Declaring it optional, with the use case checking for it before offering
      deletion, matches how isSupported() already gates listing. A separate port
      would split one provider's knowledge of its own storage layout across two
      interfaces — Cursor's directory-per-transcript layout means deletion is
      provider-specific knowledge, so it belongs with the repository that
      already encodes that layout. Deleting from the use case would be a
      dependency-rule violation.
  - title: Double sidenav composition
    chosen: Second Sidebar rendered as a sibling in the existing SidebarProvider, gated on pathname
    rejected:
      - Nested SidebarProvider around a second Sidebar
      - A hand-rolled fixed-position panel
      - Tree as a tab inside the existing AppSidebar
    rationale: >
      shadcn's SidebarProvider owns a single open/closed state and writes one
      cookie; nesting a second provider would make the two panels share and
      fight over that state. Rendering a second panel as a sibling inside the
      existing provider keeps one source of truth for the rail while letting the
      tree own its own open state (defaulting to open, as requested). A
      hand-rolled panel would miss the existing mobile, RTL, and keyboard
      behaviour the sidebar primitive already handles. app-shell already reads
      `pathname`, so gating to the Control Center costs nothing.
  - title: Reusing ui/file-tree.tsx
    chosen: Purpose-built tree node components, borrowing the accordion pattern only
    rejected:
      - Render the session tree through the existing TreeView component
    rationale: >
      ui/file-tree.tsx models TreeViewElement as {id, name, type: file|folder,
      children} — a filesystem shape. Session tree nodes carry an agent type, an
      adopted/unadopted state, message counts, relative timestamps, and per-node
      actions (adopt, resume, archive, delete). Forcing that through a
      file/folder element type would mean stuffing domain state into a name
      string or a parallel lookup. Small purpose-built node components stay
      under the file-size limit and leave the file tree unchanged for its
      existing IDE-tab consumer.

