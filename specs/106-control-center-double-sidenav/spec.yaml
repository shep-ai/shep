summary: >
  Spec 105 made in-flight agent sessions actionable, but only from a dropdown
  hanging off a single repository node on the canvas. There is no way to see
  every session across every repository at once, no way to tell at a glance
  which sessions have already been adopted into a feature, and no way to get
  rid of the ones that are finished or irrelevant — the list only grows. This
  feature adds a second sidenav to the Control Center: the existing AppSidebar
  collapses to a narrow icon rail, and a tree panel sits beside it, open by
  default. The tree is Repository → features → sessions, so an adopted session
  nests under the feature it became while unadopted sessions sit in their own
  per-repository bucket — the SDLC hierarchy is the browsing structure. The
  link already exists: spec 105 persists Feature.sourceAgentSessionId, so
  "converted to a feature" is a query rather than a new model. Sessions also
  become manageable. Archive is the default one-click action: shep-side only,
  reversible, and it never touches the provider's files. Delete is separate and
  gated behind an explicit confirmation, because it unlinks a transcript from
  ~/.claude or ~/.cursor — data shep reads but does not own.
