decisions:
  - title: How to snapshot the worktree without touching the user's branch or index
    chosen: >-
      Temporary GIT_INDEX_FILE: read-tree HEAD, add -A, write-tree, commit-tree -p HEAD,
      update-ref, all with core.fsync=objects,reference
    rejected:
      - git stash create (ignores untracked files unless -u, and -u stores them in a third parent)
      - A real commit on a side branch (moves HEAD or needs a second worktree)
      - Copying files into a content-addressed store of our own (reinvents git objects)
    rationale: >-
      Plumbing through a private index writes only objects and one ref. A prototype against git
      2.43 confirmed `git status` is byte-identical before and after capture, .gitignore is
      respected, and a ref written from a linked worktree lands in the common ref store, so it
      survives the worktree.
  - title: Where the capture hook lives
    chosen: >-
      A `withCheckpoint(node, fn, capture)` wrapper applied in the three graph factories to the
      nodes that can change files, with the capture callback supplied by the worker from the
      DI-resolved CaptureFeatureCheckpointUseCase
    rejected:
      - Inside executeNode() (implement, fast-implement and merge do not use it)
      - A LangGraph stream listener in the worker (no reliable "node finished" hook with the
        updated worktree, and it would also see validate nodes)
      - Module-level context like phase-timing-context (new global state is banned)
    rationale: >-
      Wrapping at the graph edge covers custom-execution nodes, keeps the nodes unchanged, and
      passes the dependency explicitly instead of through a module singleton. The wrapper runs
      the capture in `finally`, so a node that fails or interrupts at an approval gate still
      leaves its partial work as a checkpoint.
  - title: Which steps record a checkpoint
    chosen: Every wrapped node, skipping a capture whose tree equals the latest checkpoint's tree
    rejected:
      - Always record (a merge that only polled CI adds an empty step)
      - Hard-code a list of "writing" nodes and trust it (repair and merge write only sometimes)
    rationale: Tree hashes are content addresses, so equality is exact and costs nothing extra.
  - title: Restore semantics
    chosen: >-
      Capture a pre-restore checkpoint, then `git clean -fd`, `git read-tree --reset -u <tree>`,
      `git reset -q` — the working tree equals the checkpoint, the index equals HEAD, the branch
      does not move
    rejected:
      - git reset --hard to the checkpoint's HEAD (rewrites a branch the agent has pushed; next
        push is non-fast-forward)
      - git checkout <tree> -- . (does not delete files created after the checkpoint)
    rationale: >-
      The rollback becomes an ordinary change the next agent step commits, nothing pushed is
      rewritten, ignored files (node_modules, .env) survive, and the pre-restore checkpoint makes
      the restore itself reversible. Verified in a prototype.
  - title: Restore safety
    chosen: >-
      Refuse unless the feature has a worktreePath that differs from repositoryPath AND git
      reports it as a linked worktree (git-dir differs from git-common-dir), and the latest agent
      run is not pending/running
    rejected:
      - Path comparison only (a symlink or case difference could alias the main checkout)
    rationale: >-
      The main checkout is the user's; two independent checks, one of them asked of git itself,
      make it impossible to point restore at it by a stored path quirk.
  - title: Diff source and caching
    chosen: >-
      `git diff --find-renames --unified=3 <fromTree> <toTree>` parsed by a unified-diff parser
      extracted from GitPrService (GitHub review keeps its own copy today), cached in a bounded
      in-process LRU keyed by the two commit ids
    rejected:
      - Persisting diffs in SQLite (large, and derivable from immutable objects at any time)
    rationale: >-
      Checkpoint objects never change, so the cache needs no invalidation; extracting the parser
      removes an existing duplication instead of adding a third copy.
  - title: Sequence allocation
    chosen: >-
      Next sequence computed from the feature's rows, protected by UNIQUE(feature_id, sequence);
      the ref name embeds the sequence
    rejected:
      - Global counters
    rationale: >-
      One worker owns a feature at a time and restore is refused while it runs, so contention is
      only theoretical; the unique constraint turns a violation into a failed (best-effort)
      capture instead of two rows claiming one ref.

