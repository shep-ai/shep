# Markdown content (the actual spec)
content: |
  ## Problem Statement

  Local squash merge fails with an unhelpful error message. The root cause is that
  `git merge --squash` writes conflict information to stdout (not stderr), but the
  error handler only checks `error.message` (which only contains stderr from Node's
  `execFile`). This means conflicts are never properly detected or reported.

  Additionally, the repo is not fully cleaned before merge (only untracked files via
  `git clean -fd`, not dirty tracked files), and failed merges leave the repo in an
  unclean merge state.

  ## Success Criteria

  - [x] Conflict detection checks stdout from git merge --squash
  - [x] Tracked files are reset before merge via git reset --hard HEAD
  - [x] Failed merges are aborted to leave repo clean
  - [x] Error messages include stdout for better diagnostics

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | git-pr.service.ts | High | localMergeSquash method fix |

  ## Dependencies

  None identified.

  ## Size Estimate

  **S** - Focused fix in a single method

