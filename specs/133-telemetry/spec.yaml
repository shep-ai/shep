summary: |-
  Shep sends nothing today, so nobody can tell whether a page, a command or an agent is used.
  This adds opt-out telemetry in the dev-CLI style (Next.js, Astro). It is on by default with a
  first-run notice in the CLI and in web onboarding, and it is always off under CI,
  DO_NOT_TRACK=1, SHEP_TELEMETRY_DISABLED=1 and tests. Events are a TypeSpec enum and never
  carry content. Every process writes them to a local telemetry_outbox table. Only the daemon
  sends, in batches to PostHog's EU /batch/ endpoint over plain fetch, with a uuid per event,
  jittered backoff, a drop after 5 attempts and a table-size cap. Identity is an install UUID
  plus, unless the user turns identity off, a SHA-256 hash of the agent account id, the GitHub
  username and the GitHub owners of the repos Shep runs in. `shep telemetry on|off|status|show`
  and a settings section control it, and the trust promise in the README, FAQ and CLAUDE.md is
  rewritten to say exactly what is sent.
