summary: >
  Today "start dev server" is a hardcoded, Node-only detection pipeline:
  detectDevScript() scans package.json for dev/start/serve, picks a package
  manager from lockfiles, runs a blocking invisible `install` when node_modules
  is missing, and spawns the script. When anything deviates — a non-Node stack,
  a missing runtime or package manager, stale dependencies, a failing boot —
  the flow dead-ends. A dormant agentic prototype (AgentDeploymentService /
  DevEnvironmentAgentService) exists but is unreachable and cannot even apply
  its own analysis because DeploymentService has no command override.
  This feature converts dev-server startup into a proper LangGraph agent graph
  (the project way: Annotation.Root state, node factories, IAgentExecutorProvider,
  SqliteSaver checkpointer) with nodes for analyze → ensure-infra →
  install-deps → start → verify, a bounded agent-driven remediation loop, a
  persisted per-repo run plan cache, and a deterministic fast path so zero-LLM
  startups stay instant when detection is unambiguous.
