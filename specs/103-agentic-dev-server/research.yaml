# Structured technology decisions
decisions:
  - title: Orchestration framework for the agentic flow
    chosen: LangGraph StateGraph (Annotation.Root state, node factories, conditional edges) — the same stack as feature-agent and supervisor graphs
    rejected:
      - Keep one-shot IStructuredAgentCaller orchestration in a plain service (spec-068 approach)
      - Ad-hoc promise pipeline inside DeploymentService
    rationale: The flow is genuinely multi-step with conditional routing (fast path vs. agent analysis, remediation loops, bounded retries) — exactly what StateGraph models. Reusing the project's established LangGraph idioms (state annotations with reducers, single fluent wiring chain, node factories taking injected executors) keeps one way of building agents in the codebase. The one-shot structured call remains as the *analysis* step inside a node, not as the orchestrator.

  - title: Where the graph executes
    chosen: In-process within the CLI/web server process, invoked by a new DevServerAgentService behind an application port
    rejected:
      - Dedicated worker process like feature-agent-worker
      - Next.js server action running the graph directly
    rationale: The spawned dev-server child process MUST be owned by the same process that holds DeploymentService's in-memory process Map (stop/recovery/log streaming all assume it). A worker would orphan the child or need cross-process PID adoption. The graph is short-lived (seconds to a few minutes) — nothing like the hours-long feature SDLC graph that justifies a worker. Presentation still only calls use cases; the use case delegates to the port.

  - title: Model interaction inside nodes
    chosen: Existing ports — IStructuredAgentCaller for schema-validated repo analysis; IAgentExecutorProvider/IAgentExecutor for free-form remediation executions
    rejected:
      - Direct provider SDK (@anthropic-ai/*) calls inside nodes
      - New bespoke agent-caller port
    rationale: Mandatory agent-agnostic rule. Both ports already exist, are DI-registered, and were proven by DevEnvironmentAgentService (analysis) and the feature-agent CI-fix loop (remediation-style prompts). No new port needed for model access.

  - title: Fast path vs. always-agentic
    chosen: Deterministic fast path as the first graph node — detectDevScript() plus a fresh-deps check short-circuits to start; agent analysis runs only on ambiguity, cache miss, or failure. If no agent executor is available, degrade to the deterministic path rather than fail.
    rejected:
      - Always call the agent on every start
      - Feature-flag the whole agentic path (settings featureFlags toggle)
      - Two separate services (deterministic vs. agentic) selected upstream
    rationale: Startup latency is user-facing (preview auto-starts after every agent turn). An LLM call per start would add seconds and token cost for the ~90% case that a plain `pnpm dev` covers. Embedding the fast path as a node keeps ONE flow, one state machine, and one set of logs. Graceful degradation removes the need for a feature flag (13-touchpoint wiring per LESSONS.md) — behaviour without a configured agent is identical to today.

  - title: Run-plan persistence and cache invalidation
    chosen: New dev_server_run_plans SQLite table (additive migration) keyed by repository path, storing the plan plus a hash of the config files that produced it; invalidate when the hash changes
    rejected:
      - In-memory per-process cache only (spec-068 approach)
      - Re-analyze on every start
      - Storing the plan on the Application entity
    rationale: In-memory caching evaporates on restart and can't help the recovery path. Hashing the same CONFIG_FILES set the analysis reads (package.json, lockfiles, Cargo.toml, go.mod, pyproject.toml, ...) gives cheap, correct invalidation. A separate table (not Application columns) is right because plans are keyed by repository path and also serve feature worktrees and bare repositories.

  - title: Dependency staleness detection for install_deps
    chosen: Content hash of the lockfile (or manifest when no lockfile) stamped after successful install (stored on the run-plan row); node_modules existence remains the cheap first check
    rejected:
      - node_modules existence only (status quo)
      - Always run install
      - mtime comparison of lockfile vs node_modules
    rationale: Existence-only misses every dependency update (the concrete gap in this feature's premise). Always-install adds tens of seconds per start. mtimes are unreliable across git operations and worktree churn; content hashes are deterministic and we already persist a run-plan row to stamp.

  - title: DeploymentState lifecycle extension
    chosen: Add Analyzing and Installing to the existing TypeSpec DeploymentState enum (additive); keep Booting/Ready/Stopped semantics unchanged
    rejected:
      - New parallel DevServerPhase enum alongside DeploymentState
      - Overload Booting for everything (status quo)
    rationale: The UI already keys off DeploymentState and fakes "Installing dependencies and booting…" copy during Booting. Additive enum values are backward compatible with the dev_servers table (TEXT column), keep one source of truth, and per code-quality rules status strings must be TypeSpec enums. Polling loop extends its active set to {Analyzing, Installing, Booting, Ready}.

  - title: Checkpointing
    chosen: Optional SqliteSaver checkpointer (createCheckpointer helper), thread_id `dev-server:<targetId>`, following the supervisor-graph pattern; no resume-from-error replay — a failed run starts fresh
    rejected:
      - Mandatory checkpoint DB per run with resume semantics (feature-agent-worker pattern)
      - No checkpointer at all
    rationale: Runs are short and idempotent-ish (analysis is cached, install is safe to re-run), so resume adds complexity without value; the feature-agent's delete-checkpoint-on-error lesson shows stale checkpoints are a liability. Accepting the compile({ checkpointer }) parameter keeps the graph testable and consistent with project patterns while defaulting to fresh runs.

  - title: Fate of the spec-068 prototype
    chosen: Delete AgentDeploymentService and fold DevEnvironmentAgentService's analysis prompt/schema/CONFIG_FILES into the new dev-server-agent analyze node; keep IDevEnvironmentAgent port only if the CLI doctor path needs it, otherwise remove
    rejected:
      - Leave the dormant services in place alongside the new path
      - Wire the old services up as-is
    rationale: Two agentic deployment paths violate the no-duplication rule, and the old one is unreachable dead code whose core limitation (no command override) this feature fixes properly. The valuable parts — the analysis JSON schema, config-file inventory, and prompt — migrate into the graph node with their tests.

  - title: Remediation loop bounds and safety
    chosen: Bounded conditional edge (max 2 remediation attempts) feeding captured stdout/stderr to an agent execution with cwd pinned to the target repo; infra-level installs restricted to user-space, non-interactive commands (per-LESSONS non-interactive flags); escalate with an actionable error otherwise
    rejected:
      - Unbounded retry-until-green loop
      - Automatic system-level installs (sudo/brew) without bounds
    rationale: Mirrors the proven routeValidation bounded-retry pattern from the feature-agent graph. Unbounded loops burn tokens and can wedge the UI in a perpetual Booting state. System-level mutation from a background flow is a footgun; user-space bootstrap (corepack enable pnpm, npm i -g inside the user prefix, pipx-style) covers the realistic gap, and anything beyond that surfaces as a clear error with the suggested command.

