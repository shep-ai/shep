# Markdown content (the full research document)
content: |
  ## Status

  - **Phase:** Research
  - **Updated:** 2026-07-04

  ## Context: what exists today

  Two parallel implementations exist:

  1. **Live path** — `DeploymentService.start()` + `detectDevScript()`:
     deterministic, Node-only (`dev`/`start`/`serve` scripts, lockfile-based
     package-manager pick, bun first), synchronous invisible
     `execFileSync(pm, ['install'])` when `node_modules` is missing, spawn with
     `buildDevServerEnv()` scrubbing, port parsed from stdout via regex
     (`parse-port.ts`), state machine Booting → Ready → Stopped persisted in
     the `dev_servers` table, `recoverAll()` reconciliation at boot.
  2. **Dormant agentic prototype (spec 068)** — `AgentDeploymentService` +
     `DevEnvironmentAgentService` (`IStructuredAgentCaller` one-shot analysis,
     language-agnostic CONFIG_FILES inventory, JSON schema
     `{deployable, reason, command, cwd, expectedPort, language, framework,
     setupCommands}`), DI-registered but never called, and unable to apply its
     command because `DeploymentService.start()` has no override parameter
     (flagged in-code as follow-up).

  ## Technology Decisions

  ### 1. Orchestration: LangGraph StateGraph

  **Options considered:** LangGraph graph (project way) · keep one-shot
  structured call in a plain service · promise pipeline in DeploymentService.

  **Decision:** LangGraph `StateGraph`, mirroring the supervisor graph's
  small-graph idiom and the feature-agent's node-factory + conditional-edge
  patterns.

  **Rationale:** The flow has real branching (cache hit vs. miss, deterministic
  vs. agent analysis, remediation loops with bounded retries). StateGraph
  models this declaratively, gives per-node observability, and keeps a single
  way of building agents in the repo. Graph shape:

  ```
  START → analyze → ensure_infra → install_deps → start_server → verify
                        ↑                                          |
                        └────────── remediate (≤2 attempts) ←──────┘
                                            (failure)
  verify --success--> END
  remediate --exhausted--> fail (surface actionable error) → END
  ```

  ### 2. Execution locus: in-process service, not a worker

  The dev-server child process must be owned by the process holding
  `DeploymentService`'s in-memory `Map<targetId, DeploymentEntry>` — stop,
  recovery (`recoverAll`), and log streaming all assume same-process ownership.
  A `DevServerAgentService` (infrastructure) implements a new
  `IDevServerAgentService` application port; the existing
  `Start{Application,Feature,Repository}DeploymentUseCase` delegate to it,
  keeping their public API stable. Single-flight per targetId prevents
  concurrent graph runs against one target (the auto-deploy double-fire lesson).

  ### 3. Model access: existing agent-agnostic ports only

  - **Analysis node:** `IStructuredAgentCaller.call<T>(prompt, ANALYSIS_SCHEMA,
    { cwd, maxTurns: 3, silent: true })` — the schema and CONFIG_FILES
    inventory migrate from `DevEnvironmentAgentService`.
  - **Remediation node:** `IAgentExecutorProvider.getExecutor()` →
    `executor.execute(prompt, { cwd, timeout })`, prompt carrying the failed
    command, captured stdout/stderr tail, and environment probe results —
    the same shape as the feature-agent CI-fix loop.
  - No node imports a provider SDK; no hardcoded agent type anywhere.

  ### 4. Deterministic fast path & graceful degradation

  `analyze` first consults (a) the persisted run-plan cache (config-hash
  valid), then (b) `detectDevScript()`. Only on miss/ambiguity/prior-failure
  does it invoke the structured agent call. If
  `IAgentExecutorProvider.getExecutor()` is unavailable (no configured agent,
  no credentials), the graph runs deterministic-only — identical behaviour to
  today, no feature flag needed.

  ### 5. Run-plan persistence

  New `dev_server_run_plans` table (additive migration, following
  `040-create-dev-servers-table` conventions):
  `repo_path TEXT PK, plan_source TEXT (RunPlanSource enum), command TEXT,
  cwd TEXT, package_manager TEXT NULL, expected_port INTEGER NULL,
  language TEXT NULL, framework TEXT NULL, setup_commands TEXT (JSON),
  config_hash TEXT, install_stamp_hash TEXT NULL, created_at, updated_at`.
  TypeSpec-first `DevServerRunPlan` model + `RunPlanSource { Deterministic,
  Agent }` enum; mapper + SQLite repository behind `IDevServerRunPlanRepository`
  with full-column INSERT/UPDATE and non-default round-trip tests
  (repository-SQL-drift lesson).

  ### 6. Missing-dependency handling, end to end

  - **Infra level (`ensure_infra`):** probe required binaries from the run plan
    (runtime + package manager) via `command -v` / `where` with short
    timeouts. Missing → remediation attempt (user-space, non-interactive:
    e.g. `corepack enable pnpm`) via the agent executor; still missing →
    actionable error ("pnpm is required — install with `npm i -g pnpm`").
  - **Package level (`install_deps`):** needed when node_modules absent OR
    lockfile hash ≠ stamped hash. Runs `spawn` (async, NOT execFileSync),
    streams output lines into the deployment logger (SSE-visible), applies
    `buildDevServerEnv()` scrubbing, uses non-interactive flags, stamps the
    hash on success. UI shows the new `Installing` state truthfully instead of
    faked copy.

  ### 7. DeploymentService changes

  `start()` gains an optional `runPlan` override `{ command, cwd, env? }` —
  when present, spawn uses it verbatim instead of `detectDevScript()`; the
  embedded blocking install is deleted (the graph owns installation).
  `Analyzing`/`Installing` states are set by the graph via the service so the
  existing polling/SSE surfaces them. `recoverAll()` and stop/kill semantics
  (unix process-group SIGTERM→SIGKILL, Windows taskkill) are untouched.

  ## Library Analysis

  No new libraries. `@langchain/langgraph ^1.1.4`, `@langchain/core ^1.1.22`,
  and `@langchain/langgraph-checkpoint-sqlite ^1.0.1` are already direct
  dependencies used by the feature-agent and supervisor graphs.

  ## Security Considerations

  - Agent-remediation executions run with cwd pinned inside the target repo,
    bounded attempts, and non-interactive commands only; no sudo/system
    package-manager mutation is ever run automatically.
  - All spawned processes (install + dev server + remediation) get
    `buildDevServerEnv()` scrubbing so user projects never inherit
    `ANTHROPIC_API_KEY`/`CLAUDE_CODE_OAUTH_TOKEN`/`NEXT_ASSET_PREFIX`/`PORT`.
  - Run-plan commands originate from repo analysis (untrusted repo content →
    executed command). This is the same trust boundary as today's
    package.json `dev` script execution — starting a dev server has always
    meant executing repo-defined code — but agent-derived commands are
    additionally persisted, logged verbatim to the SSE log stream, and capped
    in length, so the executed command is always inspectable.

  ## Performance Implications

  - Fast path (cache hit or unambiguous detection + fresh deps): zero LLM
    calls, latency identical to today.
  - First-ever start of an ambiguous/non-Node repo: one structured agent call
    (~seconds), then cached until config files change.
  - Event loop is no longer blocked during installs (execFileSync →
    streamed async spawn), fixing UI freezes during first-run installs.

  ## Open Questions

  All questions resolved.

