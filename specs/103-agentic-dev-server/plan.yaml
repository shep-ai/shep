content: |
  ## Status

  - **Phase:** Planning
  - **Updated:** 2026-07-04

  ## Architecture Overview

  ```
  Presentation (web actions / CLI)              — unchanged API
        │  resolve<StartXDeploymentUseCase>('...')
        ▼
  Start{Application,Feature,Repository}DeploymentUseCase   (application)
        │  validates target, resolves path (as today)
        ▼
  IDevServerAgentService (new application output port)
        ▼
  DevServerAgentService (infrastructure/agents/dev-server-agent)
        │  single-flight per targetId · builds graph deps · thread_id dev-server:<targetId>
        ▼
  ┌──────────────────── LangGraph StateGraph ────────────────────┐
  │ START → analyze → ensure_infra → install_deps → start_server │
  │            │            ▲                            │       │
  │   (cache / detect /     └──── remediate (≤2) ◄───────┤       │
  │    structured agent)                                 ▼       │
  │                                                   verify ──► END
  └──────────────────────────────────────────────────────────────┘
        │ analyze:      IDevServerRunPlanRepository (cache) ·
        │               detectDevScript() · IStructuredAgentCaller
        │ ensure_infra: binary probes · IAgentExecutor (user-space fix)
        │ install_deps: DependencyInstaller (async spawn, log-streamed,
        │               lockfile-hash staleness, env-scrubbed)
        │ start_server: DeploymentService.start(target, path, type,
        │               { runPlan }) — explicit command override
        │ verify:       port/URL from parse-port + expectedPort TCP probe
        │ remediate:    IAgentExecutor with failure logs (CI-fix-loop shape)
        ▼
  DeploymentService (existing) — owns child processes, states, dev_servers
  table, SSE logs, recoverAll(); gains Analyzing/Installing states + runPlan
  override; loses its embedded blocking install.
  ```

  ## Implementation Strategy

  **MANDATORY TDD:** every phase with executable code follows RED → GREEN →
  REFACTOR; tests are written first in each task's `tdd.red` list.

  Bottom-up, dependency-ordered:

  1. **Phase 1 — Domain & persistence.** TypeSpec first (`DevServerRunPlan`,
     `RunPlanSource`, additive `DeploymentState` values) because everything
     downstream imports the generated types; then the additive migration and
     the run-plan repository behind its port. New enum values ripple into the
     UI and fixtures — doing this first surfaces every touchpoint via
     `pnpm typecheck` immediately (per LESSONS: required-field/enum ripple).
  2. **Phase 2 — Deployment service groundwork.** The `runPlan` override on
     `DeploymentService.start()` and the standalone async `DependencyInstaller`
     are pure prerequisites for the graph and independently testable. Removing
     the embedded blocking install happens here, guarded by tests that pin
     stop/recovery semantics unchanged.
  3. **Phase 3 — The graph.** State annotation + skeleton first (structure
     tests pin nodes/edges — supervisor-graph pattern, single fluent chain per
     LESSONS), then nodes in execution order. Each node is a factory taking
     injected deps (executor, structured caller, repo, installer, deployment
     service) — no DI decorators inside graph code, mirroring feature-agent.
  4. **Phase 4 — Wiring.** `DevServerAgentService` implements the port,
     the three start use cases delegate to it (public API unchanged), DI
     registrations land as class + string tokens with bootstrap-test coverage
     (per LESSONS: every new token in CRITICAL_INFRA_TOKENS), and the dormant
     spec-068 services are deleted with their salvageable assets migrated.
  5. **Phase 5 — Surface & hardening.** Web status rendering for the two new
     states (all 9 locales), integration tests against fixture repos with a
     mocked executor, docs.

  Ordering rationale: the graph (phase 3) cannot be built before the override
  and installer exist (phase 2), which cannot compile before the generated
  types exist (phase 1). Wiring before UI keeps the web diff trivially small
  and reviewable. The dormant-path removal sits in phase 4 because the analyze
  node (phase 3) first harvests its schema/prompt/config-file assets.

