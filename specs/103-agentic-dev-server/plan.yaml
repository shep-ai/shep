  ## Testing Strategy (TDD: Tests FIRST)

  ### Unit Tests (RED → GREEN → REFACTOR)

  - **Graph structure:** nodes/edges/conditional routing pinned (supervisor-graph test style); remediation bound (≤2) exhausts to failure.
  - **Nodes:** each node factory tested with mocked deps — cache hit skips agent; deterministic detection skips agent; agent path parses/validates schema output; ensure-infra probe hit/miss/remediate; install staleness matrix (no node_modules / stale hash / fresh); start passes runPlan verbatim; verify success + timeout; remediate builds prompt from captured logs.
  - **DependencyInstaller:** async spawn, line-streamed logs, env scrubbed (no ANTHROPIC_*/PORT/NEXT_ASSET_PREFIX), non-interactive flags, hash stamped on success only.
  - **DeploymentService:** override spawn path; no install inside start(); Booting/Ready/Stopped semantics + stop/kill + recoverAll pinned unchanged (regression suite).
  - **Mapper/repository:** full-column round-trip with non-default values for EVERY field (repository-SQL-drift lesson).
  - **Web:** status pill + preview tab render the two new states; polling set includes them.

  ### Integration Tests

  - Run-plan repository against real SQLite (migration applied, round-trip, config-hash invalidation).
  - End-to-end graph run against a fixture Node repo with a mocked executor/structured-caller: deterministic fast path (zero agent calls asserted), agent path (mock analysis → override spawn), install path (node_modules absent → installer invoked → Ready), remediation path (first start fails → remediate → second start succeeds), degradation path (no executor available → deterministic only).
  - DI bootstrap resolves all new tokens.

  ## Risk Mitigation

  | Risk | Mitigation |
  | ---- | ---------- |
  | Regressing stop/recovery/kill semantics while changing `DeploymentService.start()` | Pin existing behaviour with a regression test suite BEFORE the change (phase-2 RED step); override is additive-optional |
  | Fast path becomes slower (extra graph hops / DB reads per start) | Fast path = one cache read + existing detection; assert zero executor calls in the fast-path integration test; no checkpoint DB writes by default |
  | Agent-derived command is wrong or unsafe | Command logged verbatim to SSE before spawn; persisted for inspection; same trust boundary as executing package.json scripts; remediation bounded to 2 attempts, user-space + non-interactive only |
  | New enum values break exhaustive switches / fixtures across the codebase | Phase-1 typecheck sweep; grep DeploymentState consumers (status-pill, provider, derive-app-status, dev_servers recovery) and update in the same task |
  | Stale run-plan cache after repo changes | Cache keyed on config-file content hash; verify/remediate failures invalidate the cached plan before re-analysis |
  | tsyringe boot bombs from new injectables | Constructor params are class types or @inject(token) only; tokens registered class+string; bootstrap test extended (LESSONS) |
  | Windows behaviour drift (kill, `where` vs `command -v`) | Platform-branched probes; reuse existing cross-platform kill helpers; Windows CI watched on the PR |

