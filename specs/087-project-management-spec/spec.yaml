  - `webhook_events` — Webhook delivery log

  ## Phased Implementation Strategy

  Given the massive scope, implementation should be broken into phases:

  ### Phase 1: Foundation (MVP)
  - TypeSpec domain models for Project, WorkItem, WorkItemState, Label, Comment, Activity
  - SQLite repositories and migrations for core entities
  - Use cases for CRUD operations on projects and work items
  - Web UI: List view with basic filtering and grouping
  - Web UI: Work item detail page with properties panel
  - CLI: Basic work item commands (create, list, update, close)

  ### Phase 2: Views & Organization
  - Board (Kanban) view with drag-and-drop
  - Table (Spreadsheet) view with inline editing
  - Calendar view
  - Saved views with filters and display options
  - Labels, priorities, assignees management
  - Sub-work items (parent-child hierarchy)

  ### Phase 3: Sprint & Module Management
  - Cycle/Sprint entity with active/upcoming/completed lifecycle
  - Module entity with state management
  - Cycle and module analytics (burndown, progress charts)
  - Transfer incomplete items between cycles
  - Timeline (Gantt) view with dependency lines

  ### Phase 4: Advanced Features
  - Epics and Initiatives
  - Work item types with custom properties
  - Relations and dependencies (6 types)
  - Pages/Wiki with rich text editor
  - Real-time collaborative editing (Yjs)
  - Time tracking and worklog reports

  ### Phase 5: Intelligence & Integrations
  - AI-powered triage and classification
  - Duplicate detection
  - Smart summaries and dashboard generation
  - Enhanced GitHub integration (bidirectional sync)
  - Slack integration
  - Webhook system
  - Notification center
  - Import/Export tools

  ### Phase 6: Team & Permissions
  - Workspace and project role management
  - Permission checks throughout use cases
  - Teamspaces
  - Guest access
  - Audit logging

  ## Size Estimate

  **XL (multi-month)** — This is the largest feature set that could be added to Shep. It introduces
  25+ new domain entities, 50+ use cases, 30+ database tables, 5 major view components, a rich text
  editor, real-time collaboration, analytics dashboards, and integration systems. Even broken into
  phases, the MVP alone (Phase 1) is an L-sized effort. The full feature set rivals an entire
  standalone product (Plane itself is 500K+ lines of code across Python/Django backend and
  Next.js/React frontend). The phased approach is essential — each phase delivers standalone value
  while building toward the complete vision.

