  ## Dependencies

  **Existing infrastructure to leverage**:
  - SQLite persistence layer with Umzug migrations
  - tsyringe DI container and bootstrap pattern
  - SSE real-time update pipeline (DB polling -> SSE -> Service Worker -> React)
  - React Flow canvas for board/timeline visualization
  - Storybook component development workflow
  - LangGraph agent orchestration for AI features
  - Server actions pattern for web UI mutations

  **New libraries likely needed**:
  - Rich text editor: TipTap or ProseMirror (for pages/wiki with collaborative editing)
  - Yjs + y-prosemirror (CRDT for real-time collaboration)
  - Date library: date-fns or dayjs (calendar/timeline views)
  - Charting library: Recharts or Victory (analytics dashboards)
  - DnD library: @dnd-kit (drag-and-drop across all views)
  - Gantt/Timeline: Custom build on React Flow or dedicated library
  - Full-text search: SQLite FTS5 extension
  - CSV parsing: papaparse (import/export)
  - Excel export: exceljs or xlsx

  **Infrastructure requirements**:
  - Database schema expansion: 30+ new tables, junction tables for many-to-many relationships
  - File storage: Attachment upload/download system (local filesystem or S3-compatible)
  - WebSocket or SSE enhancement: Real-time collaborative editing requires persistent connections
  - Background jobs: Recurring work item creation, auto-archive, auto-close stale items

  ## Database Schema Overview

  **Core tables** (new):
  - `projects` — Project definitions within a workspace
  - `project_members` — User-project role assignments
  - `work_items` — Central issue/task table
  - `work_item_types` — Custom work item type definitions
  - `work_item_states` — Per-project workflow states
  - `work_item_relations` — Blocking, relates-to, duplicate-of links
  - `labels` — Project-scoped labels with optional parent grouping
  - `custom_properties` — Custom field definitions per work item type
  - `custom_property_values` — Custom field values per work item
  - `comments` — Threaded comments on work items
  - `activities` — Change log per work item
  - `cycles` — Sprint/cycle definitions
  - `cycle_work_items` — Cycle-to-work-item junction
  - `modules` — Module definitions
  - `module_work_items` — Module-to-work-item junction
  - `epics` — Epic definitions
  - `initiatives` — Workspace-level initiative groupings
  - `initiative_epics` — Initiative-to-epic junction
  - `pages` — Rich text documents
  - `page_versions` — Version history snapshots
  - `intake_items` — Triage queue entries
  - `intake_forms` — Public form configurations
  - `time_entries` — Time logged per work item
  - `notifications` — User notification records
  - `notification_preferences` — Per-user notification settings
  - `dashboards` — Custom dashboard definitions
  - `dashboard_widgets` — Widget configurations per dashboard
  - `views` — Saved view configurations (layout + filters + display)
  - `estimate_systems` — Per-project estimate configurations
