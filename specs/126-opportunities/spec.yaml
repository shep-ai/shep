summary: |-
  Shep can build almost anything it is pointed at; the scarce resource is the people who review
  and merge the result. This feature adds the decision layer in front of the factory. A signal is
  one piece of evidence (a customer request, an incident, a tracker issue, a discovery finding or
  a note) with an optional customer, monthly revenue at stake and urgency. An opportunity is a bet
  worth building, with the signals behind it, an estimate in review hours and a confidence. Each
  space has weights (reach, revenue, urgency, strategic) and a weekly review capacity. Shep scores
  every opportunity as value per review hour, ranks them, and draws the line: the accepted
  opportunities that fit this week's capacity. A person accepts, drops (with a reason) or builds
  an opportunity; building creates a work item in a project that carries the problem and its
  evidence, so the existing pipeline takes it from there. Later specs feed signals automatically
  (feedback 127, discovery 128, incidents 129) and close the loop (outcomes 130, autopilot 132).
