content: |
  ## Summary

  Phase 1 lands the vocabulary and the only piece of genuine logic — a family-aware,
  catalog-intersected tier resolver that treats the pinned model as a ceiling. Phase 2 makes the
  mode persistable through the full four-touch settings chain. Phase 3 is where behaviour
  changes: the plan agent labels tasks, and the implement node batches consecutive same-model
  tasks so each batch runs on the cheapest model that fits. Phase 4 exposes the resolved mapping
  through one presentation-agnostic use case, and phase 5 consumes it from the CLI and the web
  Settings page, with the per-phase model surfaced in the Activity tab so the routing is
  observable on a real run.
