content: |
  ## Architecture Overview

  The change has one new piece of real logic and a lot of plumbing around it.

  ```
  Settings.models.adaptive ─┐
                            ├─→ GetAdaptiveModelPlanUseCase ─→ CLI / Web settings
  IAgentExecutorFactory ────┘        (preview + overrides)
        .getSupportedModels()

  plan.prompt.ts  ──writes──→ tasks.yaml { complexity: High|Medium|Low }
                                    │
                                    ▼
  implement.node.ts ──resolveTaskComplexity()──→ domain/shared/model-tier.ts
                                    │                    resolveModelForComplexity()
                                    ▼
                     groupConsecutiveByModel(tasks) ──→ buildExecutorOptions(state, {model}, 'implement')
  ```

  `domain/shared/model-tier.ts` is pure, dependency-free data + functions, following the
  precedent set by `domain/shared/build-mode.ts` and `domain/shared/worktree-config.ts`:
  shared semantics live in the domain so no surface re-derives them. Relative imports inside
  `domain/` carry **no** `.js` extension (LESSONS).

  ## Key Design Decisions

  1. **Ceiling, not target.** `resolveModelForComplexity` clamps the requested tier to the tier
     of the pinned model. A user who pinned Sonnet never gets billed for Opus.
  2. **Family-scoped degradation.** A `gemini-3.1-pro-preview` pin degrades to
     `gemini-3-flash-preview`, never to a Claude id. Cross-family substitution is impossible by
     construction because candidates are filtered by family before tier.
  3. **Catalog-intersected.** Candidates must appear in the agent's own supported list, so
     Cursor (no Haiku) degrades High→Medium and Low→Medium rather than emitting a model its CLI
     rejects.
  4. **Unknown ids pass through.** OpenRouter/Ollama/custom ids that are not in the tier catalog
     resolve to themselves — adaptive mode becomes a no-op rather than a source of
     `Unsupported model` errors (the failure mode of spec 098).
  5. **Consecutive-run batching.** Preserves intra-phase dependency order while collapsing
     executor calls. Parallel phases already fan out one call per task, so each simply carries
     its own model.
  6. **Off by default.** `adaptive.enabled = false` short-circuits before any resolution, so the
     existing path is untouched for every current user.

  ## Implementation Strategy

  Phases are ordered so nothing references capability that does not yet exist: domain first,
  then persistence, then the agent behaviour that consumes both, then the use case that exposes
  it, and finally the two presentation layers (LESSONS: "Static repo polish ships LAST").

  ## Risk Mitigation

  | Risk | Mitigation |
  | ---- | ---------- |
  | Adaptive routing sends a model the agent CLI rejects | Candidates are intersected with `factory.getSupportedModels(agentType)`; unknown ids pass through unchanged. |
  | Splitting a phase reorders dependent tasks | Batch only *consecutive* same-model runs; never reorder. |
  | Plan agent omits `complexity` | Deterministic heuristic classifier fills every gap. |
  | Settings column silently dropped on write | Round-trip integration test with non-default values for every new column (LESSONS). |
  | New required tsp field breaks ~30 fixtures | `complexity` and `adaptive` are both declared optional. |
