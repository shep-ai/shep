oneLiner: Route each implementation task to a model tier matched to its complexity instead of running every task on the single pinned model.
summary: >
  Today a feature pinned to `claude-opus-5` runs every phase and every task on Opus — including
  trivial work like adding a translation key or a barrel export. This feature adds an adaptive mode:
  the plan phase classifies each task in tasks.yaml as High / Medium / Low complexity, and the
  implement node executes each task with the model tier that matches, degrading from the pinned
  model (never upgrading above it). Tier resolution is family-aware and catalog-driven, so a
  Gemini or GPT pin degrades within its own family.
