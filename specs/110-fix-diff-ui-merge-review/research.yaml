content: |
  ## Status

  - **Phase:** Research
  - **Updated:** 2026-08-31

  ## Technology Decisions

  ### Handling large `git diff` output in GitPrService.getFileDiffs

  **Options considered:**

  1. Pass an explicit larger `maxBuffer` option to the `execFile` call.
  2. Stream/paginate the diff output incrementally.
  3. Truncate diff output beyond a size threshold and show a placeholder.

  **Decision:** Pass an explicit `maxBuffer: 10 * 1024 * 1024` (10MB), reusing
  the `COMMAND_MAX_BUFFER_BYTES`-style constant pattern from
  `worktree-hook-runner.ts`.

  **Rationale:** Node's `child_process.execFile` defaults to a 1MB
  stdout/stderr buffer. Increasing it directly at the call site is the
  smallest possible change that fixes the reported symptom, follows an
  existing precedent in this codebase, and avoids the scope/risk of
  streaming or truncation-based redesigns of the diff UI.

  ### Surfacing partial failures to the user

  **Options considered:**

  1. Populate the existing `warning` field on `MergeReviewData` when
     `getFileDiffs` fails.
  2. Leave the current silent `.catch(() => undefined)` behavior unchanged.
  3. Let the failure propagate and fail the whole Merge Review page load.

  **Decision:** Populate the existing `warning` field, reusing the pattern
  already used for diff-summary failures in the same file.

  **Rationale:** Consistent with existing code, requires no new UI, and
  converts a completely silent failure into a visible, non-blocking warning —
  directly addressing the bug report's core complaint (users see nothing and
  don't know why).

  ## Library Analysis

  No new libraries are introduced by this fix; it uses Node's built-in
  `child_process.execFile` `maxBuffer` option, already supported by the
  existing `ExecFunction` abstraction.

  ## Security Considerations

  No security implications identified. The `maxBuffer` increase only affects
  how much of a trusted local `git diff` command's own output can be
  buffered; it does not change what commands are run or their inputs.

  ## Performance Implications

  A 10MB buffer is a small, fixed increase in worst-case memory usage per
  `getFileDiffs` call, consistent with the same trade-off already accepted
  for `worktree-hook-runner.ts`. No measurable performance regression is
  expected for typical (small) diffs.

  ## Open Questions

  All questions resolved.

