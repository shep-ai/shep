# Structured technology decisions
decisions:
  - title: Handling large `git diff` output in GitPrService.getFileDiffs
    chosen: >
      Pass an explicit `maxBuffer: 10 * 1024 * 1024` (10MB) option to the
      `execFile` call in `getFileDiffs`, mirroring the existing
      `COMMAND_MAX_BUFFER_BYTES` constant/pattern already used in
      `worktree-hook-runner.ts`.
    rejected:
      - "Stream/paginate the diff output incrementally"
      - "Truncate diff output and show a 'diff too large' placeholder"
      - "Increase Node's global default maxBuffer via process-wide config"
    rationale: >
      A larger fixed maxBuffer is the simplest, lowest-risk change and matches
      an established pattern already in the codebase. Streaming/pagination
      would require significant UI rework (virtualized diff rendering) that is
      out of scope for a bug fix. Truncating loses information the user needs
      to review. A process-wide default change is riskier/broader than
      necessary since only this one call site is affected in practice.
  - title: Surfacing partial failures to the user
    chosen: >
      Change `get-merge-review-data.ts` so that when `getFileDiffs` fails, the
      returned `MergeReviewData` includes a `warning` message (reusing the
      existing `warning` field already used for the diff-summary failure
      case), instead of silently swallowing the error via
      `.catch(() => undefined)`.
    rejected:
      - "Leave the silent `.catch(() => undefined)` as-is"
      - "Throw and fail the whole Merge Review page load"
    rationale: >
      The `MergeReviewData` type already has a `warning?: string` field used
      for the diff-summary failure path, so reusing it for file-diff failures
      is consistent with the existing UX pattern and requires no new UI. It
      preserves current graceful-degradation behavior (rest of the Merge
      Review tab still renders) while making failures visible instead of
      silent. Failing the whole page load would be a worse regression for an
      edge case that should now rarely occur post-maxBuffer-fix.

