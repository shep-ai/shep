# Markdown content (the actual spec)
content: |
  ## Problem Statement

  In the Merge Review tab, the "Changed Files" diff section (rendered by
  `DiffView` in `src/presentation/web/components/common/merge-review/diff-view.tsx`)
  sometimes fails to display at all, with no error message shown to the user.
  This happens more often when the number of changes is large.

  Root cause: `GitPrService.getFileDiffs()`
  (`packages/core/src/infrastructure/services/git/git-pr.service.ts`) runs
  `git diff --unified=3 <baseBranch>...HEAD` via an injected `execFile`-based
  `ExecFunction` with no `maxBuffer` option set. Node's `child_process.execFile`
  defaults to a 1MB stdout/stderr buffer; once the diff output for a feature
  with many changed files/lines exceeds that limit, `execFile` throws an
  `ENOBUFS`/"maxBuffer exceeded" error. That error is caught and rethrown by
  `getFileDiffs`, but the caller in
  `src/presentation/web/app/actions/get-merge-review-data.ts` invokes it as
  `gitPrService.getFileDiffs(worktreePath, defaultBranch).catch(() => undefined)`,
  silently discarding the error. The resulting `fileDiffs: undefined` is passed
  to `MergeReviewContent`, which only renders `<DiffView>` when
  `fileDiffs && fileDiffs.length > 0` — so for large diffs the entire diff
  section vanishes with zero user-facing indication that anything went wrong.

  The codebase already has a precedent for this exact fix: `worktree-hook-runner.ts`
  defines `COMMAND_MAX_BUFFER_BYTES = 10 * 1024 * 1024` (10MB) and passes it as
  the `maxBuffer` option to its own `execFile` calls.

  ## Success Criteria

  - [ ] `git diff` output for large diffs (well beyond Node's default 1MB
        buffer) is retrieved successfully instead of throwing a maxBuffer error.
  - [ ] If retrieving the diff genuinely fails for any reason, the user sees a
        visible warning message in the Merge Review tab instead of the diff
        section silently disappearing.
  - [ ] No regression to existing small/typical diff rendering behavior.
  - [ ] Existing and new automated tests cover both the large-buffer fix and
        the surfaced-warning behavior.

  ## Affected Areas

  | Area                                | Impact   | Reasoning                                                                                      |
  | ------------------------------------ | -------- | ------------------------------------------------------------------------------------------------ |
  | `GitPrService.getFileDiffs`          | Direct   | Needs an explicit `maxBuffer` option on its `git diff` `execFile` call to handle large diffs.    |
  | `getMergeReviewData` server action    | Direct   | Needs to surface a warning when file-diff retrieval fails instead of silently swallowing it.     |
  | Merge Review UI (`MergeReviewContent`, `DiffView`) | Indirect | Benefits from the upstream fix and warning; no component code changes expected.        |

  ## Dependencies

  None identified.

  ## Size Estimate

  **S** - Small, targeted fix confined to one service method and one server
  action, following an existing pattern already used elsewhere in the
  codebase (`worktree-hook-runner.ts`). No new domain models, no TypeSpec
  changes, no DI wiring changes.

