summary: |-
  Teams that develop docs-first describe a change to its users before building it, and treat
  that description as the contract. This feature makes it a space policy. With docs first on,
  the planning agent is told to write or update the user-facing documentation for the feature
  in the repository's documentation paths before planning code, and the implementing agent is
  told to build exactly what those docs say and to change them in the same change when the build
  must differ. Before merging, shep lists the changed files; when none is under the space's
  documentation paths, the run cannot auto-merge — the merge gate opens and says why, just as
  unverified CI does. The paths are the space's to choose (docs/ and README.md by default).
