architecture: |
  ```
  SQLite (features, agent_runs, agent_questions)
          │  one batched read per tick
          ▼
  GetFeatureConsoleSnapshotUseCase ──rows carry state, reason, activity, question, version
          │
          ▼
  GetAgentActivityUseCase ── WatchAgentActivityUseCase ── WaitForAgentActivityUseCase
          │                         │                              │
          │        ReplyToFeatureUseCase (gate decision / answer question / cancel)
          ▼                         ▼                              ▼
   MCP tools        A2A JSON-RPC handler (/api/a2a, SSE)     CLI feat status / wait
                                          TUI ──► ReportHostActivityUseCase ──► IActivityHostReporter
                                                                               (Herdr | no-op)
  ```

  Domain decides (explainFeatureState, activityOf, activityVersion, overallActivity).
  Application batches reads and polls (waitForNextTick). Infrastructure adapters only
  translate: MCP JSON text, A2A ProtoJSON objects and SSE frames, Herdr argv.

risks:
  - Changing deriveFeatureState could shift a state on some surface — mitigated by keeping it a
    wrapper over explainFeatureState and running the existing feature-state tests unchanged
  - A2A wire-format drift — mitigated by the integration test that drives the server with the
    official @a2a-js/sdk client
  - Next.js may not route an app directory named `.well-known` — verify with `pnpm build:web`;
    fall back to a rewrite in next.config.ts to the same handler
  - Herdr is not installable in CI — the adapter is tested against a fake exec; a manual run
    inside Herdr is documented, not automated

content: |
  ## Status

  - **Phase:** Planning
  - **Updated:** 2026-10-26

  ## Clean Architecture

  - Domain: pure functions over generated types; no I/O.
  - Application: use cases inject ports by string token and other use cases by class; polling
    uses the existing `waitForNextTick` helper; no `process.env`, no timers beyond it.
  - Infrastructure: the Herdr adapter is the only code that reads `HERDR_*` and spawns; the A2A
    handler and MCP tools resolve use cases and translate shapes; DI picks the reporter.
  - Presentation: route handlers frame JSON / SSE; CLI and TUI format and call use cases.

  ## TDD

  RED-GREEN-REFACTOR for every behavioural task. Every one starts RED: domain branch tables, use-case tests with in-memory
  fakes, adapter tests with fake exec / fake use cases, then the integration test with the A2A
  SDK client and an e2e CLI test against a seeded SHEP_HOME.

  ## Testing Strategy

  | Layer | Tests |
  | ----- | ----- |
  | Domain | `feature-state.test.ts` (reasons for every branch, states unchanged), `agent-activity.test.ts` |
  | Application | snapshot rows, get / watch / wait / reply / report use cases |
  | Infrastructure | Herdr argv + sequence + failure tolerance, MCP tools, A2A handler (each method, errors, version) |
  | Integration | A2A over HTTP with `@a2a-js/sdk` client (card, send, get, list, cancel, subscribe); MCP round trip |
  | E2E | `shep feat status` / `shep feat wait` against a seeded database |
