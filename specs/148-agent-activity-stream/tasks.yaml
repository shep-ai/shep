  - id: task-2
    title: explainFeatureState with reasons
    description: >
      deriveFeatureState's branches return { state, reason }; deriveFeatureState returns
      .state. Every existing feature-state test stays green.
    state: Done
    dependencies:
      - task-1
    acceptanceCriteria:
      - Each branch reports its reason (gate, review, plan review, running, process died, failed, interrupted, cancelled, completed, maintain, queued, deferred, waiting on parent, archived, deleting, in progress)
      - deriveFeatureState output unchanged for every case
    tdd:
      red:
        - feature-state.test.ts reason table
      green:
        - Implement explainFeatureState
      refactor:
        - deriveFeatureState delegates
    estimatedEffort: S
  - id: task-3
    title: Domain agent-activity mapping
    description: activityOf, activityVersion, overallActivity, isSettledActivity in domain/shared/agent-activity.ts.
    state: Done
    dependencies:
      - task-2
    acceptanceCriteria:
      - Gate / question / review → blocked; running → working; queued, deferred, parent → waiting; done, archived → done; errors → failed
      - A pending agent question makes any non-settled state blocked with reason agent-question
      - Version is the newest timestamp in ms; overall is blocked > working > waiting > failed > done
    tdd:
      red:
        - agent-activity.test.ts
      green:
        - Implement
      refactor: []
    estimatedEffort: S
