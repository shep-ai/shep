content: |
  ## Summary

  21 tasks in 7 phases: enums, domain reasons and activity, five use cases, three adapters
  (Herdr, MCP, A2A + routes), CLI and TUI, e2e and docs, then the web UI (routes, hooks,
  card, page, sidebar badge, Connect agents).

  ## Acceptance Checklist

  - [ ] All spec success criteria met
  - [ ] pnpm validate, test:unit, test:int, build, build:web, build:storybook green
  - [ ] A2A interop test with the official SDK client green
  - [ ] Docs updated
