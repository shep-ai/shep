content: |
  ## Summary

  15 tasks in 6 phases: enums, domain reasons and activity, five use cases, three adapters
  (Herdr, MCP, A2A + routes), CLI and TUI, then e2e and docs.

  ## Acceptance Checklist

  - [ ] All spec success criteria met
  - [ ] pnpm validate, test:unit, test:int, build, build:web green
  - [ ] A2A interop test with the official SDK client green
  - [ ] Docs updated
