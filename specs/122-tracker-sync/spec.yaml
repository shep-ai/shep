summary: |-
  Teams keep their backlog in Linear or Jira, while shep's agents work from shep projects. Today
  the two never meet: shep has no Linear code, an unregistered single-ticket Jira fetcher, and no
  external identity on work items. This feature adds connections (a Linear API key, or a Jira
  Cloud site, email and API token, stored encrypted and owned by a space) and sync rules (a Linear
  team or a Jira JQL query feeding a shep project, import-only or two-way, every N minutes). The
  daemon runs due rules continuously: new issues become work items, remote changes to title,
  description, status and priority are applied, and in two-way rules local changes are pushed
  back (status through Linear workflow states or Jira transitions). Each work item remembers the
  issue it came from and the values last synced, so changes are detected per field and a field
  changed on both sides resolves in the tracker's favour and is counted as a conflict.
