summary: |-
  Spec 120 keeps knowledge apart between spaces, but every agent still runs with the host's one
  set of credentials: the same Claude login, the same `gh` account and the same git author for
  personal side projects and for an employer's repositories. This feature gives each space
  optional agent settings: a Claude config directory (its own Claude login), a gh config
  directory (its own GitHub account), a git author name and email, an AWS profile and whether to
  route Claude through Bedrock, and the agent types the space allows. Feature runs apply their
  repository's space settings to the worker process before any agent, gh or git process starts,
  and refuse to run an agent the space does not allow; interactive chat sessions apply the same
  settings per session. Host credentials that would override a space login (GH_TOKEN,
  ANTHROPIC_API_KEY, ...) are removed from the environment the space controls. A space without
  settings behaves exactly as today.
