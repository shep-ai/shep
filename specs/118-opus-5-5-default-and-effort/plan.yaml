content: |
  ## Architecture Overview

  ```
  settings.models.effort ─┐
  feat new --effort / drawer ─┴─> CreateFeatureUseCase ── pins ──> AgentRun.effort (SQLite)
                                                                       │
     start / spawn / resume / approve / reject  ── read run.effort ────┘
                                   │
                                   ▼
             FeatureAgentProcessService.spawn(..., { effort })  → worker argv `--effort <level>`
                                   │
                                   ▼
                   feature-agent-worker parses + validates → state.effort
                                   │
                                   ▼
            buildExecutorOptions(state) → AgentExecutionOptions.effort
                                   │
                ┌──────────────────┴─────────────────────┐
                ▼                                        ▼
    ClaudeCodeExecutor (supports AgentFeature.effort)   other executors: ignore
       argv += ['--effort', level]
  ```

  Clean Architecture layering is preserved:
  - The enum and validator live in the domain.
  - Use cases pin and forward effort through ports (`IFeatureAgentProcessService`,
    `AgentExecutionOptions`).
  - Only the infrastructure executor knows the `--effort` flag.
  - Presentation calls use cases and server actions only.

  ## Implementation Strategy

  1. **Domain first.** Add the TypeSpec enum and fields, then regenerate. A domain helper
     (`parseAgentEffort`) is the single validator every boundary uses. `DEFAULT_MODEL_ID`
     replaces the four hardcoded defaults.
  2. **Persistence.** One idempotent migration adds both nullable columns. The mappers treat
     unknown strings as unset.
  3. **Plumbing.** Follow `modelId` and `model` exactly: every place that forwards `run.modelId`
     also forwards `run.effort`. The executor change is the only behaviour change, and it happens
     only when effort is set.
  4. **Presentation.**
     - CLI: `shep settings effort` and `feat new --effort`.
     - Web: a shared `EffortSelect` used by the settings control and the create drawer, plus
       a read-only badge in the overview.
     - `SetDefaultEffortUseCase` owns validation and the set/clear rule, and CLI and web both
       call it. `updateSettingsAction`'s deep merge skips `undefined`, so it cannot clear a
       field.
     - `settings-page-client.tsx` (2,272 lines) gets only the row import and mount. Refactoring
       that file is out of scope and flagged in the PR.
  5. **E2E.**
     - Web: set, reload, clear.
     - CLI: `settings effort` round trip, and the fresh-install default model.

  ## Testing Strategy (TDD: Tests FIRST)

  Each task runs RED-GREEN-REFACTOR: write the failing test, make it pass minimally, then clean up.

  - **Unit (domain).**
    - `parseAgentEffort` accepts exactly the five values and rejects others.
    - The factory default model equals `DEFAULT_MODEL_ID`.
    - The generated TypeSpec default equals `DEFAULT_MODEL_ID`.
  - **Integration (persistence).**
    - The migration is idempotent.
    - Settings and agent-run repositories round-trip `effort`, including a null value.
  - **Unit (application).**
    - Create pins `input.effort`, falling back to the settings value, and leaves it unset when
      neither is set.
    - Spawn, resume, approve and reject forward `run.effort`.
  - **Unit (infrastructure).**
    - The process service appends `--effort`.
    - The worker parses and validates it.
    - `buildExecutorOptions` includes it.
    - The Claude Code `buildArgs` includes `--effort` only when set.
    - `supportsFeature(effort)` is true for Claude Code and false for other executors.
    - The Cursor map converts `claude-opus-5-5`.
  - **Unit (presentation).**
    - The CLI command option algebra.
    - `EffortSelect` renders the options and emits undefined for "Agent default".
    - The create action forwards effort.
  - **E2E.** Playwright effort settings spec; CLI `settings-effort` test; updated `settings-init`
    default-model assertion.

  ## Risk Mitigation

  | Risk | Mitigation |
  | --- | --- |
  | Older `claude` CLI rejects `--effort` | Flag is only sent when effort is set; unset is the default, so argv is unchanged for everyone who doesn't opt in |
  | New default breaks non-Claude agents | Cursor map gains `claude-opus-5-5`; the agent/model picker already resets the model when switching agents; persisted settings are untouched |
  | Resume path forgets effort | Every `run.modelId` forwarding site has a matching test for `run.effort` |
  | Bad value in DB or argv | `parseAgentEffort` at every boundary; unknown → unset, never passed to the CLI |
  | Generated file drift | Run `pnpm generate` and commit output; CI re-checks |
