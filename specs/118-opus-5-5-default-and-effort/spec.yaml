name: "opus-5-5-default-and-effort"
number: 118
branch: "claude/quirky-faraday-inagpw"
oneLiner: |-
  Make Claude Opus 5.5 the default model and add an agent effort setting (low/medium/high/xhigh/max)
  that flows from settings or a per-feature override to the agent CLI
summary: |-
  #901 made Claude Opus 5.5 selectable, but new installs still default to Claude Sonnet 4.6, and
  Shep has no way to set reasoning effort, the main cost/quality lever on current Claude models
  (Opus 5.5's API default is `medium`, one level below Opus 5's `high`). This feature makes
  `claude-opus-5-5` the default from a single domain constant. It adds an `AgentEffort` TypeSpec
  enum with a global default (`settings.models.effort`) and a per-feature override pinned on the
  agent run next to the model. Effort is carried through the feature worker into
  `AgentExecutionOptions`, and the Claude Code executor passes it as `--effort`. The setting is
  exposed in the web settings page, the feature create drawer, the feature overview, and the CLI
  (`shep settings effort`, `shep feat new --effort`).
phase: "Requirements"
