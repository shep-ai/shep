oneLiner: Bulk-import every git repo under a parent folder, and adopt the Claude Code / Cursor sessions already running in those repos into shep as features.
userQuery: |
  I want to be able to import all my existing code base folder, and work on the
  different sessions I have currently running and I already worked on in claude
  code / vscode easily
summary: >
  Getting an existing machine's worth of work into shep is currently a
  click-per-repo chore, and the sessions already in flight outside shep are
  visible but inert. Adding a local repository is web-only and one folder at a
  time (folder picker → addRepository action → AddRepositoryUseCase); the CLI's
  `shep repo add` only clones from GitHub and never exposes the path-based use
  case at all. Session discovery, by contrast, already works well — the core
  Claude Code and Codex CLI session repositories parse ~/.claude/projects JSONL
  through IAgentSessionRepository, and every repo node on the canvas shows its
  sessions with a five-minute "active" dot. What is missing is the ability to
  act on one. The dropdown offers only clipboard operations and a vscode://
  link, and its "Create feature from session" path is a presentation stopgap:
  repository-node.tsx builds the agent prompt inside a React component, pushes
  a URL, and never reads the transcript — it just instructs the agent to go
  read the JSONL itself. This feature adds non-recursive local folder discovery
  plus bulk import behind one presentation-agnostic use case (web and CLI), and
  makes session adoption real by reading the transcript in core, deriving a
  feature from it, and recording the originating session so work continues
  under shep orchestration. Secondary resume paths — shep's embedded PTY
  terminal, VS Code, an external terminal — reuse the same core resume
  descriptor.
phase: planning
sizeEstimate: L

