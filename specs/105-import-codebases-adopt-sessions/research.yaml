summary: >
  Technical analysis for 105-import-codebases-adopt-sessions. The headline
  finding is that almost nothing here needs new machinery — it needs existing
  machinery connected correctly. Adoption should reuse the
  IStructuredAgentCaller + MetadataGenerator pattern rather than calling
  IAgentExecutorProvider directly, and should call
  CreateFeatureUseCase.createRecord() rather than execute() to satisfy the
  "no branch, no agent run" decision. Both agent executors already implement
  --resume via options.resumeSession, so the resume descriptor is a
  domain-level mapping, not new integration work. The one genuinely
  underestimated item is deleting session-scanner.ts: the web scanner and the
  core session repositories are not equivalent, and core is missing three
  capabilities the canvas currently depends on.
