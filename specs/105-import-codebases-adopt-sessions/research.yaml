# Structured technology decisions
decisions:
  - title: Where subfolder listing and git detection live
    chosen: New IRepositoryDiscoveryService output port with a node:fs adapter in infrastructure
    rejected:
      - Extend IFileSystemService with listSubdirectories() + isGitRepository()
      - Call node:fs directly from the use case
      - Reuse the web /api/directory/list route from core
    rationale: >
      IFileSystemService is a deliberately tiny mutation-oriented port
      (removeDirectory, pathExists) consumed by eight use cases across
      clusters, deployments, cloud-deploy, doctor, and repositories. Adding
      read/enumerate semantics to it would widen a port that every one of
      those consumers would then over-depend on. A separate discovery port
      keeps the boundary honest and gives the bulk-import use case a single
      mockable seam for TDD. Calling node:fs from the use case is a direct
      dependency-rule violation. The web route is presentation and cannot be
      imported by core.
  - title: How adopted-session summarisation reaches the model
    chosen: IStructuredAgentCaller.call() with a JSON schema, following the MetadataGenerator pattern
    rejected:
      - Inject IAgentExecutorProvider and parse free-form output
      - Spawn a full feature agent run to do the summarisation
    rationale: >
      The spec said "via IAgentExecutorProvider", but research found the
      correct existing abstraction one level up: IStructuredAgentCaller
      already wraps the difference between agents with native structured
      output (Claude Code --json-schema) and those needing prompt-based JSON
      extraction, and throws StructuredCallError on unparseable responses.
      MetadataGenerator is a working precedent doing exactly this shape
      (userInput -> {slug, name, description}) with a METADATA_SCHEMA const
      and input truncation. Adoption is the same shape plus a remainingWork
      field, so it should be a sibling collaborator, not a new integration.
      Parsing free-form output would re-implement StructuredCallError
      handling; a full agent run contradicts the no-agent-run decision.
  - title: How an adopted feature is created without a branch or agent run
    chosen: Call CreateFeatureUseCase.createRecord() with pre-supplied name/description
    rejected:
      - CreateFeatureUseCase.execute()
      - CreateFeatureUseCase.execute() with pending true
      - Write the Feature entity directly via IFeatureRepository
    rationale: >
      execute() is createRecord() + initializeAndSpawn(), and phase 2
      unconditionally calls worktreeService.create() — so any path through
      execute() creates a branch, violating the resolved decision. The
      pending flag looked like the answer but sets lifecycle to
      SdlcLifecycle.Pending, not Requirements, so it fails the decision on a
      different axis. createRecord() is public, documented as the fast
      DB-only phase ("No AI calls, no git operations"), already used in
      exactly this split fashion by create-feature.ts (web action) and
      CreateFeatureFromRemoteUseCase, and defaults to
      SdlcLifecycle.Requirements for BuildMode.Application. It also accepts
      pre-supplied name/description, which lets the summariser output feed
      straight in and skips the redundant second AI metadata call. Writing
      the entity directly would bypass slug resolution, the agent-run record,
      and parent-gate logic.
  - title: Shape of the resume descriptor
    chosen: Agent-type-keyed descriptor built by a domain helper, consumed by all three resume surfaces
    rejected:
      - Keep building a command string in the React component
      - Hardcode the claude binary in a use case
    rationale: >
      Both executors already support resume — claude-code-executor pushes
      ['--resume', options.resumeSession] and declares a 'session-resume'
      capability; cursor-executor pushes the same flag but its binary is
      cursor-agent, not cursor. So a single hardcoded `claude --resume` string
      is wrong for Cursor sessions the moment Cursor parity lands. The
      correct form is always the binary for the session's agentType plus
      --resume <id>, executed with cwd set to the project path — there is no
      --project flag on any of them, which is precisely the shipped bug. A
      domain helper mapping AgentType to binary keeps the terminal, IDE, and
      clipboard paths agreeing, and matches the LESSONS.md rule that shared
      semantics belong in domain before the second consumer exists.
  - title: Whether core can absorb the web session scanner as-is
    chosen: 'No — core needs three new capabilities first; scanner deletion is gated on them'
    rejected:
      - Point the API routes at existing core use cases and delete the scanner immediately
      - Leave the scanner in place indefinitely
    rationale: >
      Direct comparison shows the two implementations are not equivalent, and
      the web one is ahead in ways the canvas depends on. Core is missing:
      (1) Cursor discovery entirely — stub-session.repository.ts returns
      nothing, while the scanner reads
      ~/.cursor/projects/<encoded>/agent-transcripts and handles both flat
      .jsonl files and the directory-per-transcript layout;
      (2) worktree-aware collection — the scanner's includeWorktrees matches
      sibling project dirs by prefix AND derives the shep worktree dir from
      sha256(normalizedRepoPath).slice(0,16) under ~/.shep/repos, which
      ClaudeCodeSessionRepository.collectSessionFilesForPath does not do, so
      repo nodes would silently lose all worktree sessions;
      (3) filePath on the session model — AgentSession has no filePath field,
      but SessionSummary.filePath is what gates the adopt action in the
      dropdown. Deleting the scanner before these three land is a visible
      regression, so the plan must sequence them first.
  - title: Batch session lookup for the canvas
    chosen: New list-sessions-for-paths use case returning a path-keyed map
    rejected:
      - Loop the existing single-path use case in the API route
      - Keep /api/sessions-batch assembling results itself
    rationale: >
      SessionsProvider polls /api/sessions-batch every 30s for every repo on
      the canvas and consumes a sessionsByPath record. Looping a single-path
      use case inside the route would put fan-out and merge logic back in
      presentation, which is the violation this feature exists to remove.
      A core use case that takes paths and returns the map keeps the route a
      thin adapter and gives the CLI the same capability for free.
  - title: Persisting session provenance on Feature
    chosen: Two optional TypeSpec fields plus an additive umzug migration
    rejected:
      - Store provenance in the existing messages/metadata JSON blob
      - Add a separate adopted_sessions join table
    rationale: >
      sourceAgentSessionId and sourceAgentType are single-valued, always
      known at adoption time, and wanted for display and traceability — two
      nullable columns model that exactly. Migration 135
      (add-active-plugins-to-features) is the pattern to copy: pragma
      table_info guard, ALTER TABLE ADD COLUMN, no-op down. Migrations are
      auto-discovered from the migrations/ directory by filename order, so no
      registry edit is needed. A join table would be premature for a 1:1
      relationship; burying provenance in a JSON blob makes it unqueryable
      and repeats the mistake the enum-literal lesson in LESSONS.md warns
      about.

