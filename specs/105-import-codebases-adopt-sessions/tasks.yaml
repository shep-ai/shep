    state: Done
    dependencies:
      - task-4
      - task-5
    acceptanceCriteria:
      - '`shep repo import <dir>` lists annotated candidates and imports the selection'
      - A non-interactive flag imports without prompting, for scripting
      - Already-tracked candidates are visibly marked and not re-imported
      - Per-path failures are reported individually; exit code reflects overall outcome
