  - id: task-13
    title: SessionAdoptionSummarizer with deterministic fallback
    description: >
      Derive feature metadata from a transcript, following the MetadataGenerator
      precedent exactly: a module-level JSON schema const, a typed result
      interface, input truncation before the call, and
      IStructuredAgentCaller.call() as the model boundary. Schema is
      {slug, name, description, remainingWork}. When the structured call throws
      StructuredCallError (or any error), fall back to deterministic extraction
      — first user message for the description, slugified for the name, files
      and tools touched for remaining work — so adoption degrades in quality but
      never in availability. Security: truncate the prompt and do not carry raw
      transcript content into persisted output.
    state: Todo
    dependencies:
