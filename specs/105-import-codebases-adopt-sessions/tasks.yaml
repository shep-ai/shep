tasks:
  # ── Phase 1 — Foundation ────────────────────────────────────────────
  - id: task-1
    title: Add TypeSpec fields for session provenance and session filePath
    description: >
      TypeSpec-first, per the project mandate. Add `filePath?: string` to
      AgentSession in tsp/agents/agent-session.tsp (the web SessionSummary
      already carries filePath and it gates the adopt action, but the domain
      model has no such field). Add `sourceAgentSessionId?: string` and
      `sourceAgentType?: AgentType` to Feature in
      tsp/domain/entities/feature.tsp. Run `pnpm tsp:codegen` to regenerate
      packages/core/src/domain/generated/output.ts. Never hand-edit the
      generated file.
    state: Done
    dependencies: []
    acceptanceCriteria:
      - AgentSession has an optional filePath with an @doc annotation
      - Feature has optional sourceAgentSessionId and sourceAgentType with @doc annotations
      - '`pnpm tsp:compile` passes and generated/output.ts contains the three new fields'
      - No manual edits to generated/output.ts
    tdd: null # Foundational — codegen only, no executable logic
    estimatedEffort: S

  - id: task-2
    title: Migration and mapper for the new Feature columns
    description: >
      Add migrations/140-add-source-session-to-features.ts copying the
      established pattern from 135-add-active-plugins-to-features.ts: read
      `pragma table_info(features)`, guard each ALTER TABLE ADD COLUMN behind a
      name check, and leave `down()` a no-op. Migrations are auto-discovered
      from the directory by filename order, so no registry edit is needed. Then
      extend feature.mapper.ts — the FeatureRow type, toRow, and toDomain — to
      round-trip source_agent_session_id and source_agent_type. The mapper is
      277 lines; if the additions push it past ~300, split the row-type
      declaration into a sibling module first.
    state: Done
    dependencies:
      - task-1
    acceptanceCriteria:
      - Migration adds both columns and is idempotent when re-run
      - down() is a safe no-op, matching house convention
      - Mapper round-trips a Feature with and without provenance set
      - Existing feature persistence tests still pass
    tdd:
      red:
        - Integration test asserting both columns exist after migration and that re-running is a no-op
        - Mapper round-trip test for a Feature with provenance set, and one with it absent
      green:
        - Write the migration with pragma guards; extend row type, toRow, toDomain
      refactor:
        - Extract the row type if the mapper exceeds ~300 lines
    estimatedEffort: S

  # ── Phase 2 — Part A: discovery and bulk import ─────────────────────
  - id: task-3
    title: '[P] IRepositoryDiscoveryService port and node:fs adapter'
    description: >
      Create the output port in
      application/ports/output/services/repository-discovery-service.interface.ts
      exposing subfolder enumeration with per-entry git detection. Deliberately
      a NEW port rather than an extension of IFileSystemService, which is a
      minimal mutation-oriented port (removeDirectory, pathExists) injected
      into eight use cases that would all then over-depend on read semantics.
      Implement FsRepositoryDiscoveryService in
      infrastructure/services/repositories/ using node:fs with `withFileTypes`
      to avoid a redundant stat, and register it in the DI container.
      Non-recursive by resolved decision.
    state: Done
    dependencies:
      - task-1
    acceptanceCriteria:
      - Port is documented with JSDoc and lives in application/ports/output/services/
      - Adapter enumerates immediate children only — no recursion
      - Each entry reports whether it contains .git
      - Missing or unreadable directory yields a typed failure, not an unhandled throw
      - Registered in the DI container and passes the di-graph-validation diagnostic
    tdd:
      red:
        - 'Adapter tests over a temp dir tree: git child, non-git child, file (not dir), missing dir, unreadable dir'
      green:
        - Implement the node:fs adapter to satisfy the port
      refactor:
        - Extract entry-mapping helper; confirm no node:fs import leaked outside infrastructure
    estimatedEffort: M

  - id: task-4
    title: '[P] DiscoverImportCandidatesUseCase'
    description: >
      Use case that takes an absolute directory path and returns every
      immediate subfolder as an import candidate, each annotated with
      isGitRepository (from the discovery port) and alreadyTracked (from
      IRepositoryRepository.findByPath, matching AddRepositoryUseCase's
      normalisation so annotations cannot disagree with what import will
      actually do). Filters nothing — the resolved decision is that the user
      decides and shep only annotates.
    state: Done
    dependencies:
      - task-3
    acceptanceCriteria:
      - Returns all immediate subfolders, none filtered out
      - Each candidate annotated with isGitRepository and alreadyTracked
      - Path normalisation matches AddRepositoryUseCase so annotations are accurate
      - Soft-deleted repositories are reported distinctly from never-tracked ones
      - Rejects relative paths with a clear domain error
    tdd:
      red:
        - 'Use-case tests with mocked discovery port and repository: mixed children, all tracked, none tracked, soft-deleted path, relative input, empty folder'
      green:
        - Implement the use case against the two injected ports
      refactor:
        - Extract candidate-annotation mapping if the use case exceeds ~150 lines
    estimatedEffort: M

  - id: task-5
    title: '[P] ImportLocalRepositoriesUseCase'
    description: >
      Bulk import that accepts selected absolute paths and delegates each to
      the existing AddRepositoryUseCase — reusing its normalisation, dedupe,
      and soft-delete restore rather than reimplementing them. Returns a
      per-path result so partial failures are visible instead of silent, which
      is an explicit success criterion. One failing path must not abort the
      remaining imports.
    state: Done
    dependencies:
      - task-3
    acceptanceCriteria:
      - Delegates every path to AddRepositoryUseCase — no duplicated normalisation logic
      - Returns one result entry per input path with outcome and error message where applicable
      - A throwing path does not prevent the others from importing
      - Duplicate paths in one request collapse to a single import
      - Empty selection returns an empty result without error
    tdd:
      red:
        - 'Tests with a mocked AddRepositoryUseCase: all succeed, one throws mid-list, duplicates, empty input'
      green:
        - Implement sequential delegation collecting per-path outcomes
      refactor:
        - Extract the result-shape builder; ensure no logic duplicated from AddRepositoryUseCase
    estimatedEffort: M

  - id: task-6
    title: '[P] CLI command for bulk import'
    description: >
      Add src/presentation/cli/commands/repo/import.command.ts exposing
      `shep repo import <dir>` and wire it into repo/index.ts. Fills the gap
