    tdd:
      red:
        - Command tests with mocked use cases asserting output and exit codes for success, partial failure, empty dir
      green:
        - Implement the command and register it in repo/index.ts
      refactor:
        - Extract candidate rendering into a helper if the command exceeds ~150 lines
    estimatedEffort: M

  - id: task-7
    title: '[P] Web bulk import entry point and dialog'
    description: >
      Add a third option to AddRepositoryButton's popover beside the existing
