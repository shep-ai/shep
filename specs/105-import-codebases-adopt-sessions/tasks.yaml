      - Module-level schema const requiring all four fields with additionalProperties false
      - Prompt is truncated to a bounded length before the call
      - StructuredCallError triggers deterministic extraction rather than propagating
      - Deterministic path produces a usable name/description from a transcript alone
      - No raw transcript content is copied into the persisted description
    tdd:
      red:
        - 'Tests with mocked caller: happy path maps all fields; throwing caller falls back; long transcript is truncated; empty transcript still yields a name'
      green:
        - Implement the summarizer with both paths
      refactor:
