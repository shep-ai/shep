oneLiner: Fix Control Center workspaces being lost after closing and reopening the browser
summary: >
  Workspaces created in the Control Center's workspace switcher
  (`src/presentation/web/hooks/use-workspaces.ts`) are persisted to
  `localStorage` only. A race between the hook's hydration effect and its
  persist effect — compounded by `loadState()` returning the shared
  `INITIAL_STATE` object by reference on several code paths — causes newly
  created workspaces to be silently dropped from `localStorage` before or
  during a browser close/reopen cycle. This feature fixes the hook so
  workspace state hydrates before anything is persisted, and so every
  `loadState()` branch returns a fresh object that React can detect as a
  state change.
