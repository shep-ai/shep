# Markdown content (the actual spec)
content: |
  ## Problem Statement

  When a user creates one or more new workspaces in the Control Center's
  workspace switcher and then closes and reopens the browser, the created
  workspaces are gone — only the default workspace remains. The bug is in
  `useWorkspaces()`: on mount, a hydration effect (`setState(loadState())`)
  and a persist effect (`saveState(state)`, deps `[state]`) both run. The
  persist effect can fire with the pre-hydration `INITIAL_STATE` value and
  overwrite `localStorage` before hydration has propagated into state.
  Separately, `loadState()` returns the literal `INITIAL_STATE` object by
  reference from three of its four branches, so `setState(loadState())` is
  sometimes a referential no-op that never re-triggers the persist effect
  to correct the clobbered value.

  ## Success Criteria

  - [ ] Creating one or more workspaces in the Control Center, then closing
        and reopening the browser (simulated as a hook remount in tests),
        preserves every created workspace and the active workspace selection.
  - [ ] The persist effect in `useWorkspaces` never writes to `localStorage`
        until after hydration from `localStorage` has completed.
  - [ ] `loadState()` returns a freshly constructed object on every code
        path — no branch returns the shared `INITIAL_STATE` reference.
  - [ ] New unit tests cover: (a) the persist-effect-must-wait-for-hydration
        ordering, (b) referential freshness of every `loadState()` branch,
        and (c) multiple workspaces surviving a simulated remount of the hook.
  - [ ] No regression to existing Control Center / workspace UI behavior —
        all existing Control Center tests remain green.

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | `src/presentation/web/hooks/use-workspaces.ts` | High | Contains both root-cause bugs: the unguarded persist effect and the referential-identity bug in `loadState()`. |
  | `src/presentation/web/components/features/control-center/**` | Low | Consumes `useWorkspaces()` indirectly via `workspace-selector.tsx` / dialogs; no behavior change expected, covered by existing integration tests as a regression check. |

  ## Dependencies

  None identified. This is a client-only fix scoped to a single React hook —
  no domain model, TypeSpec model, migration, or backend persistence is
  introduced (the hook is explicitly documented as a client-only prototype;
  promoting it to backend-persisted storage is a separate, larger feature).

  ## Size Estimate

  **S** - Single hook file fix plus focused unit tests. No new layers,
  entities, or use cases are involved.

