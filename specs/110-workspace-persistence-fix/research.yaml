# Structured technology decisions
decisions:
  - title: Keep workspaces client-only (localStorage) rather than promoting to backend persistence
    chosen: Fix the localStorage race in useWorkspaces(); leave the prototype boundary in place
    rejected:
      - Promote Workspace to a full Clean Architecture entity (tsp model, domain, use cases, SQLite repository/migration)
      - Move persistence to sessionStorage
    rationale: >
      use-workspaces.ts explicitly documents itself as a prototype boundary with
      no backend, domain model, or infrastructure adapter. The reported bug is a
      client-side race condition, not a missing backend — grepping
      packages/core/src/domain, application/use-cases, infrastructure/persistence
      and tsp/ confirms there is no existing Workspace persistence layer to wire
      up. Promoting workspaces to backend-persisted entities is a materially
      larger feature (new tsp model, migration, repository, use cases, server
      actions) that is out of scope for a bug fix and would violate the
      single-responsibility scope of this spec. sessionStorage would make the
      bug worse, not better, since it is cleared on tab close by design.
  - title: Race-condition fix strategy in useWorkspaces
    chosen: Lazy useState(loadState) initializer that hydrates synchronously on the first render, eliminating the separate hydrate effect entirely, plus fresh-object returns from every loadState() branch
    rejected:
      - useRef-based hydration guard gating a separate hydrate-then-persist effect pair
      - Merge hydrate and persist into a single combined useEffect
      - Rewrite the hook around useSyncExternalStore
      - Debounce/delay the persist effect
    rationale: >
      Empirically verified with a RED test asserting no localStorage.setItem
      call during/after mount may ever contain fewer workspaces than what was
      already persisted: the two-effect pattern (a `useEffect(() =>
      setState(loadState()), [])` hydrate effect plus a `useEffect(() =>
      saveState(state), [state])` persist effect) has both effects run in the
      same initial passive-effect flush using the SAME pre-hydration render
      closure — so the persist effect's first invocation always fires with
      the un-hydrated default state, is captured by the test as a stale
      write to localStorage, and only "self-corrects" on the next render once
      hydration's setState commits. That self-correction is not guaranteed to
      win every race in a real browser (e.g. another tab reading storage in
      that window, or a fast close). The initially-planned useRef hydration
      guard set *inside* the hydrate effect does not actually prevent this:
      because both effects run in one synchronous pass in source order, the
      ref is already flipped to true by the time the persist effect's guard
      checks it, so the guard does not skip that first stale write either.
      Switching to a lazy `useState` initializer (`useState<WorkspacesState>
      (loadState)`) removes the race by construction: `loadState()` runs
      once, synchronously, during the component's first render — before any
      effect (including the persist effect) can run — so `state` is already
      the hydrated value from the very first render, and there is no
      "pre-hydration" render for the persist effect to ever observe. This
      also mirrors the existing sibling hook in the same directory,
      `use-viewport-persistence.ts`, which already reads its localStorage
      default synchronously via `useRef(readViewport()).current` rather than
      through a mount effect — so this fix follows established precedent in
      this exact component tree rather than introducing a new pattern.
      useSyncExternalStore is a bigger rewrite than the bug warrants.
      Debouncing treats a symptom (extra writes) without fixing the actual
      defect (writing stale data). Separately, every loadState() branch is
      changed to return a freshly constructed object (via a `freshInitialState()`
      helper) rather than the shared `INITIAL_STATE` reference, since React's
      setState bails out on referential equality — this is retained as a
      correctness improvement even though it is no longer load-bearing for
      the primary race once the lazy initializer removes the hydrate effect.

