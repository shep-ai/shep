tasks:
  - id: task-1
    title: Fix the hydrate/persist race and referential-identity bug in useWorkspaces
    description: >
      Eliminate the hydrate/persist race in `useWorkspaces` and make every
      branch of `loadState()` return a freshly constructed object instead of
      the shared `INITIAL_STATE` reference. Implemented via a lazy
      `useState(loadState)` initializer that hydrates synchronously on the
      first render — removing the separate hydrate effect (and the race
      against the persist effect) entirely, rather than gating the persist
      effect behind a `useRef` guard as originally planned (a RED test proved
      the ref-guard approach does not actually work, since both effects run
      in one synchronous pass and the ref is already flipped before the
      persist effect's guard checks it).
    state: Done
    dependencies: []
    acceptanceCriteria:
      - loadState() returns a new object (not the INITIAL_STATE reference) from every fallback branch (undefined window, missing localStorage key, malformed JSON, non-array workspaces), via a freshInitialState() helper.
      - No localStorage.setItem call during/after mount ever contains fewer workspaces than what was already persisted.
      - A workspace created immediately after mount is persisted correctly.
      - pnpm typecheck and pnpm lint pass with no new errors.
    tdd:
      red:
        - 'Wrote a test seeding localStorage with 2 previously-saved workspaces, mounting useWorkspaces, and asserting every localStorage.setItem call made during/after mount still contains the pre-existing workspace — this failed against the original two-effect hook, proving the transient stale-default write.'
        - 'Wrote a test asserting a workspace created immediately after mount is present in the persisted localStorage payload.'
      green:
        - 'Replaced `useState<WorkspacesState>(INITIAL_STATE)` + a separate `useEffect(() => setState(loadState()), [])` hydrate effect with a lazy initializer: `useState<WorkspacesState>(loadState)`. loadState() now runs once, synchronously, on the first render, before the persist effect (or any effect) exists to race against it.'
        - 'Rewrote loadState() so every fallback branch returns a freshly constructed object via a new `freshInitialState()` helper instead of `return INITIAL_STATE`.'
      refactor:
        - 'Added a comment above the useState call explaining why there is no separate hydrate effect (references LESSONS.md).'
    estimatedEffort: S

