architecture: |
  The four use cases wrap the interactive use cases and return render-ready data; they never
  throw. The chat view is a pi-tui-style component owned by the console view, active in Chat
  mode; the app polls the chat while attached and stops started sessions on quit.

risks:
  - Booting a session needs a real Claude Code or Cursor CLI; the e2e test therefore covers the
    attach, transcript and "unavailable" paths, and unit tests cover sending and answering

content: |
  ## Status

  - **Phase:** Planning
  - **Updated:** 2026-10-24

  ## Clean Architecture

  Presentation reaches the interactive session service only through use cases. Transcript
  shaping (tool rows, blocks, question extraction) is core logic.

  ## TDD

  RED-GREEN-REFACTOR: failing tests first for every use case (mapping, errors, settings off), the chat view (render, input,
  answers), and the app (polling while attached, stop on quit).
