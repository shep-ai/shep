name: "feature-log-view-fix"
number: 105
branch: "feat/105-feature-log-view-fix"
oneLiner: "Harden DI container tests so a wrong @inject token in a worker-critical use case fails CI instead of crashing the feature-agent-worker at runtime"
summary: "The feature-agent-worker for feature a0c58720-292d-4e51-babf-adb1801e59eb crashed at boot with \"Attempted to resolve unregistered dependency token: ConflictResolutionService\" because check-and-unblock-features.use-case.ts injected the wrong string token (missing the 'I' prefix). That one-line bug is already fixed on this branch (commit 5ace9fe), but nothing in the test suite would have caught it — the existing DI bootstrap test resolves individual string tokens directly, never the actual use-case classes (CheckAndUnblockFeaturesUseCase, UpdateFeatureLifecycleUseCase) whose constructors depend on them. This feature closes that gap by extending container-bootstrap.test.ts to resolve every use-case class that feature-agent-worker.ts eagerly constructs at boot, using the real production DI container.\n"
phase: "Requirements"
sizeEstimate: "S"
relatedFeatures: []
technologies:
  - "TypeScript"
  - "tsyringe (DI container)"
  - "Vitest"
relatedLinks: []
openQuestions:
  - question: "Should the new regression coverage resolve the two use cases by class reference, by their registered string tokens, or both?"
    resolved: true
    options:
      - option: "Class reference only"
        description: "Resolve via container.resolve(CheckAndUnblockFeaturesUseCase) and container.resolve(UpdateFeatureLifecycleUseCase). This exactly mirrors the real crash path — feature-agent-worker.ts:402 calls container.resolve(UpdateFeatureLifecycleUseCase) by class, not by string token. Resolving by class also transitively exercises every @inject decorator inside the constructor chain (including the string-token ConflictResolutionService dependency), so it catches the exact bug class with the fewest new lines of test code.\n"
        selected: true
      - option: "String token only"
        description: "Add 'CheckAndUnblockFeaturesUseCase' / 'UpdateFeatureLifecycleUseCase' to the existing CRITICAL_INFRA_TOKENS: readonly string[] list, reusing register-use-cases.ts's useFactory string-token re-exports. Simpler (no new list/type needed) but does not mirror the actual worker code path, and silently depends on the useFactory re-export staying in sync with the class registration.\n"
        selected: false
      - option: "Both class and string token"
        description: "Cover both entry points for maximum belt-and-suspenders coverage. Doubles the assertions for marginal benefit since resolving by class already exercises the full constructor chain; adds maintenance surface without closing any additional gap.\n"
        selected: false
    selectionRationale: "Resolving by class reference is the only option that reproduces the exact call the worker makes (container.resolve(UpdateFeatureLifecycleUseCase) at feature-agent-worker.ts:402) and it already forces tsyringe to walk the full constructor graph, including the string-token ConflictResolutionService dependency that actually broke. It requires a new readonly-class-array alongside the existing readonly-string-array lists (CRITICAL_INFRA_TOKENS resolves by string token via container.resolve<T>('Token'), which is a different call shape), but that's a small, well-precedented addition to an already-list-driven test file.\n"
    answer: "Class reference only"
  - question: "Should this feature narrowly cover only the two use cases named in the incident, or audit and cover every use-case class that feature-agent-worker.ts eagerly resolves at boot?"
    resolved: true
    options:
      - option: "Narrow: only the two incident use cases"
        description: "Add only CheckAndUnblockFeaturesUseCase and UpdateFeatureLifecycleUseCase. Smallest possible diff, fastest to ship, but leaves the ~13 other classes feature-agent-worker.ts resolves eagerly at boot (InitializeSettingsUseCase, CleanupFeatureWorktreeUseCase, SelectProjectMemoryUseCase, RecordProjectMemoryUseCase, FeatureAgentLifecyclePublisher, FeatureAgentGateQuestionPublisher, FeatureAgentSupervisorGateEvaluator, etc.) exposed to the exact same undetected-crash pattern if any of them ever gets a mistyped @inject token.\n"
        selected: false
      - option: "Broad: every worker-eagerly-resolved use-case class"
        description: "Enumerate every class feature-agent-worker.ts calls container.resolve(ClassRef) on during boot (per the file's resolve-call sites) and add all of them to the new worker-critical-classes list. This is the only option that actually satisfies the feature's own stated goal — \"the same class of mistake ... can reappear on any future use case\" — rather than just the one that already bit us. Cost is proportional to the number of extra list entries (roughly a dozen), not new test infrastructure, since the harness and pattern are unchanged.\n"
        selected: true
      - option: "Broad, but as a separate follow-up feature"
        description: "Ship the narrow two-class fix now and file a separate feature for the full worker-boot audit. Keeps this feature's diff minimal but means the regression gap for the other worker-critical use cases stays open for however long the follow-up takes to schedule.\n"
        selected: false
    selectionRationale: "The problem statement explicitly frames the goal as closing the gap for \"any future use case,\" not just the one that crashed. Auditing feature-agent-worker.ts's resolve() call sites and adding each eagerly-resolved class to the new list is mechanical (no new harness, no new patterns) and keeps this feature at its existing S size — it's the same shape of work repeated a dozen times, not new complexity. Deferring it to a follow-up would leave known-vulnerable code in the exact state that just caused a production incident.\n"
    answer: "Broad: every worker-eagerly-resolved use-case class"
  - question: "How should the TDD RED phase be demonstrated, given the actual runtime bug is already fixed on this branch (commit 5ace9fe)?"
    resolved: true
    options:
      - option: "Temporarily revert the fix locally to observe RED"
        description: "Before writing the final test, locally change the @inject decorator back to 'ConflictResolutionService' (the buggy string), run the new test to confirm it fails with the exact tsyringe error from the incident log, then revert the decorator back to 'IConflictResolutionService' and confirm GREEN. Nothing about this revert is committed — it's a local verification step proving the new assertions actually catch the bug class, not just that they compile and pass.\n"
        selected: false
      - option: "Add a standalone unit test with a fake mis-registered token"
        description: "Build an isolated mini-container with a deliberately wrong token to simulate the failure generically, independent of the real registration modules. Demonstrates RED without touching production files, but tests a synthetic scenario rather than the real production container — weaker guarantee that the real registration modules stay correct.\n"
        selected: false
      - option: "Skip formal RED demonstration"
        description: "Since the bug is already fixed, treat \"test didn't exist, now it does and passes\" as sufficient without reproducing the original failure. Fastest, but violates the project's MANDATORY TDD rule and leaves unverified whether the new assertions would actually have caught the original bug.\n"
        selected: true
    selectionRationale: "The project's TDD rule is MANDATORY (RED before GREEN). Reverting the already-identified one-line fix locally is the cheapest way to prove the new assertions genuinely reproduce the incident's tsyringe error before relying on them going forward — it directly tests the real production container and the real registration modules, not a synthetic stand-in, and requires no new test infrastructure. The revert itself is never committed; only the passing GREEN state (fix restored + new assertions added) ships.\n"
    answer: "Skip formal RED demonstration"
  - question: "Where should the new class-based assertions live relative to the existing WEB_ROUTE_TOKENS / CRITICAL_INFRA_TOKENS string-token lists?"
    resolved: true
    options:
      - option: "New dedicated class list + describe block"
        description: "Add a new `WORKER_CRITICAL_USE_CASE_CLASSES: readonly (new (...args: any[]) => unknown)[]` (or equivalent typed array of class references) alongside the existing `readonly string[]` lists, with its own `describe('every worker-critical use case resolves', ...)` block that loops and calls `container.resolve(Class)` for each, asserting a non-null instance — mirroring the existing loop pattern exactly but for class references instead of string tokens.\n"
        selected: true
      - option: "Coerce into the existing string-token lists"
        description: "Force class-based resolution into the existing `readonly string[]` arrays by also registering/resolving via each use case's re-exported string token (e.g. 'UpdateFeatureLifecycleUseCase'). Avoids a new list/type but resolves via the useFactory re-export rather than the class the worker actually calls, undermining the fidelity decided in the first open question above.\n"
        selected: false
    selectionRationale: "A new typed list keeps the class-reference resolution (needed for fidelity with the real worker code path) cleanly separate from the existing string-token lists' type (`readonly string[]`), while reusing the exact same list-plus-loop-plus-assert pattern the file already establishes for both WEB_ROUTE_TOKENS and CRITICAL_INFRA_TOKENS — no new conventions introduced.\n"
    answer: "New dedicated class list + describe block"
content: "## Problem Statement\n\nThe worker log for feature `a0c58720-292d-4e51-babf-adb1801e59eb` (screenshot attached to this\nspec) shows the feature-agent-worker dying immediately after \"Updating status to running (PID\n29351)...\":\n\n```\nWorker fatal error: Cannot inject the dependency \"checkAndUnblock\" at position #1 of\n\"UpdateFeatureLifecycleUseCase\" constructor. Reason:\n  Cannot inject the dependency \"conflictResolutionService\" at position #5 of\n  \"CheckAndUnblockFeaturesUseCase\" constructor. Reason:\n    Attempted to resolve unregistered dependency token: \"ConflictResolutionService\"\n```\n\nRoot cause: `check-and-unblock-features.use-case.ts` decorated its constructor parameter with\n`@inject('ConflictResolutionService')`, but the container registers the service under\n`'IConflictResolutionService'` (see `register-services.ts:311-313`). tsyringe resolves tokens by\nexact string match, so the mismatched literal threw at construction time — every feature run\nthat reaches a lifecycle transition (which calls `UpdateFeatureLifecycleUseCase` →\n`CheckAndUnblockFeaturesUseCase`) crashes the worker.\n\nThis exact one-line bug is **already fixed** on this branch as commit `5ace9fe` (\"fix(agents):\nuse correct DI token for conflict resolution service\"), which changed the decorator to\n`@inject('IConflictResolutionService')`. That commit predates this analysis and is not\nre-litigated here.\n\nThe real problem this feature must solve: **nothing in CI would have caught this bug**, and\nwithout a regression guard the same class of mistake (a hand-typed string token in an `@inject`\ndecorator that doesn't match the registration string) can reappear on any future use case and\nwill again only surface as a live worker crash, not a test failure. Per the resolved product\nquestions above, this feature closes that gap for every use-case class\n`feature-agent-worker.ts` eagerly resolves at boot — not only the two implicated in this\nincident — by resolving each one by class reference against the real production container.\n\n## Success Criteria\n\n- [ ] `container-bootstrap.test.ts` gains a new class-reference-based list and describe block\n  that resolves `CheckAndUnblockFeaturesUseCase` and `UpdateFeatureLifecycleUseCase` via\n  `container.resolve(ClassRef)` against the real production container.\n- [ ] The same list additionally covers every other use-case/service class that\n  `feature-agent-worker.ts` calls `container.resolve(ClassRef)` on during boot (audited from the\n  worker's resolve-call sites), so the regression guard is not limited to the two classes named\n  in this incident.\n- [ ] RED verified locally: temporarily re-introducing the fixed bug (reverting the `@inject`\n  decorator to `'ConflictResolutionService'`) causes the new test to fail with the same\n  tsyringe error chain seen in the incident log. This revert is never committed.\n- [ ] GREEN confirmed: with the real fix in place (already committed as `5ace9fe`), all new and\n  existing `container-bootstrap.test.ts` assertions pass.\n- [ ] The file's header doc-comment is updated to instruct future maintainers to add new\n  worker-critical use-case classes to the new list (mirroring its existing instruction for web\n  routes and CLI commands).\n- [ ] `pnpm test:int` passes with zero failures.\n- [ ] `pnpm lint`, `pnpm format:check`, `pnpm typecheck`, and `pnpm build` all pass.\n- [ ] No files under `packages/core/src/**` (production source) are modified by this feature —\n  the runtime fix already shipped in `5ace9fe`; this feature is test-only hardening.\n\n## Functional Requirements\n\n- **FR-1**: `container-bootstrap.test.ts` MUST construct `CheckAndUnblockFeaturesUseCase` via\n  `container.resolve(CheckAndUnblockFeaturesUseCase)` against the real, fully-registered\n  production container and assert it resolves to a non-null instance without throwing.\n- **FR-2**: `container-bootstrap.test.ts` MUST construct `UpdateFeatureLifecycleUseCase` via\n  `container.resolve(UpdateFeatureLifecycleUseCase)`, mirroring the exact call at\n  `feature-agent-worker.ts:402`, and assert it resolves to a non-null instance without throwing.\n- **FR-3**: The test file MUST audit every `container.resolve(ClassRef)` call site in\n  `feature-agent-worker.ts` and add each resolved class to the same new list, so the coverage\n  is not limited to the two classes named in this incident.\n- **FR-4**: New assertions MUST reuse the existing list-plus-loop-plus-assert pattern already\n  established by `WEB_ROUTE_TOKENS` and `CRITICAL_INFRA_TOKENS` (one `it(...)` per entry via a\n  `for` loop), rather than introducing a new testing convention.\n- **FR-5**: A failing assertion MUST surface tsyringe's native error chain (constructor\n  position, parameter name, and unresolved token name) unmodified in the test output, so a\n  future regression is diagnosable directly from CI output the same way the original incident\n  log was.\n- **FR-6**: The file's header doc-comment MUST be updated to instruct future maintainers that\n  adding a new worker-critical use case also requires adding it to the new class list — mirroring\n  its existing instruction for web routes and CLI commands.\n- **FR-7**: Implementation MUST follow RED → GREEN TDD: the new assertions must be verified to\n  fail against a locally (uncommitted) reverted version of the `@inject('IConflictResolutionService')`\n  fix before being verified to pass against the current, already-fixed code.\n\n## Non-Functional Requirements\n\n- **NFR-1 (Maintainability)**: The new class list and its describe/loop block must match the\n  existing file's structure and naming conventions exactly (e.g. `readonly ...[]` const arrays,\n  `describe('every ... resolves', ...)` blocks) so the file remains a single consistent pattern\n  rather than two divergent styles.\n- **NFR-2 (Diagnosability)**: No custom error wrapping or try/catch around the new\n  `container.resolve(...)` calls — let tsyringe's native error propagate so CI failures retain\n  the same actionable detail as the original worker crash log.\n- **NFR-3 (Test performance)**: Added assertions must not introduce new I/O, mocks, or fixtures;\n  each `container.resolve(ClassRef)` call reuses the same in-memory SQLite container and\n  registration modules the file already sets up in `beforeAll`, so runtime impact is negligible.\n- **NFR-4 (No scope creep)**: This feature must not modify any file under `packages/core/src/**`\n  — the runtime fix is already committed (`5ace9fe`); only test files and this spec change.\n\n## Product Questions & AI Recommendations\n\n| # | Question | AI Recommendation | Rationale |\n| - | -------- | ----------------- | --------- |\n| 1 | Resolve the use cases by class, string token, or both? | Class reference only | Mirrors the actual worker crash path (`container.resolve(UpdateFeatureLifecycleUseCase)` by class) and transitively exercises the full constructor chain, including the string-token dependency that broke. |\n| 2 | Cover only the two incident use cases, or audit all worker-eagerly-resolved classes? | Broad: every worker-eagerly-resolved use-case class | Matches the feature's own stated goal of closing the gap for \"any future use case,\" at mechanical (not architectural) extra cost. |\n| 3 | How to demonstrate TDD RED when the real bug is already fixed? | Temporarily revert the fix locally to observe RED | Cheapest way to prove the new assertions actually catch the incident's exact tsyringe error, using the real container and modules, without committing the revert. |\n| 4 | Where should class-based assertions live relative to existing string-token lists? | New dedicated class list + describe block | Keeps class-reference resolution (a different call shape/type) cleanly separate from the existing `readonly string[]` lists while reusing the same list-loop-assert pattern. |\n\n## Affected Areas\n\n| Area | Impact | Reasoning |\n| ---- | ------ | --------- |\n| `tests/integration/infrastructure/di/container-bootstrap.test.ts` | High | Add a new class-reference list covering `CheckAndUnblockFeaturesUseCase`, `UpdateFeatureLifecycleUseCase`, and every other class `feature-agent-worker.ts` eagerly resolves at boot, so a future mis-typed `@inject` token inside any of their constructors fails CI instead of the live worker. |\n| `packages/core/src/application/use-cases/features/check-and-unblock-features.use-case.ts` | None (already fixed) | Confirmed `@inject('IConflictResolutionService')` now matches the registration; no further code change needed here. |\n| `packages/core/src/application/use-cases/doctor/diagnostics/di-graph-validation.diagnostic.ts` | Low (optional, not required) | Its `REQUIRED_TOKENS` allowlist could also gain the worker-critical use-case tokens for an earlier `shep doctor` signal, but `container-bootstrap.test.ts` is the authoritative regression guard for this feature — deferred as a future nice-to-have, not part of this feature's scope. |\n| `feature-agent-worker.ts` resolve-call sites | Medium → closed by FR-3 | Every class this file resolves eagerly at boot (`InitializeSettingsUseCase`, `CleanupFeatureWorktreeUseCase`, `SelectProjectMemoryUseCase`, `RecordProjectMemoryUseCase`, `FeatureAgentLifecyclePublisher`, `FeatureAgentGateQuestionPublisher`, `FeatureAgentSupervisorGateEvaluator`, and others) is now in scope for the new class list per the resolved \"broad\" audit decision above, rather than left as a future risk. |\n\n## Dependencies\n\n- Depends on the existing `container-bootstrap.test.ts` harness (in-memory SQLite DB,\n  `createInMemoryDatabase()` helper, full set of `register*` modules) — no new test\n  infrastructure is needed, only additions to its token/class lists.\n- No TypeSpec, migration, or persistence changes required.\n\n## Size Estimate\n\n**S** — The actual runtime bug is a one-line fix already committed (`5ace9fe`). The remaining\nwork is adding a new class-reference list (and its describe/loop block, and header doc-comment\nupdate) to an existing, well-documented integration test file, covering the two incident use\ncases plus the handful of other classes `feature-agent-worker.ts` resolves eagerly at boot. No\nnew services, ports, or architecture layers are involved. Estimated at hours, not days.\n\n---\n\n_Generated by feature agent — proceed with research_\n"
