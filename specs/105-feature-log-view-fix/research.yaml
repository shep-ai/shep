# Markdown content (the full research document)
content: |
  ## Technology Decisions

  ### 1. Class-reference list structure and placement

  **Chosen:** New `WORKER_CRITICAL_USE_CASE_CLASSES` const array of class references,
  placed after `CRITICAL_INFRA_TOKENS`, with its own `describe('every worker-critical
  use case resolves', ...)` loop block mirroring the file's existing two string-token
  blocks exactly.

  **Rejected:**
  - Coercing class resolution into the existing string-token arrays — resolves via a
    different tsyringe code path (registered string token vs. structural class
    resolution) than the one that actually crashed.
  - Ad-hoc individual `it()` blocks per class with no shared array — introduces a
    second, divergent style in a file that currently has exactly one list-loop-assert
    convention.

  **Rationale:** `container.resolve(ClassRef)` is the exact call shape
  feature-agent-worker.ts uses at every eager-boot site (lines 281, 306, 311, 347, 402,
  416, 421, 427). Passing a class walks tsyringe's `@injectable()`/`@inject()` metadata
  for the full constructor graph, so resolving `UpdateFeatureLifecycleUseCase` alone
  already re-exercises the exact `IConflictResolutionService` token chain that broke.

  ### 2. Scope: incident-only vs. full worker-boot audit

  **Chosen:** All 9 classes the worker resolves by class reference at boot:
  `InitializeSettingsUseCase`, `CleanupFeatureWorktreeUseCase`,
  `SelectProjectMemoryUseCase`, `RecordProjectMemoryUseCase`,
  `UpdateFeatureLifecycleUseCase`, `CheckAndUnblockFeaturesUseCase`,
  `FeatureAgentLifecyclePublisher`, `FeatureAgentGateQuestionPublisher`,
  `FeatureAgentSupervisorGateEvaluator`.

  **Rejected:**
  - Narrow (2 incident classes only) — leaves 6 other classes exposed to the identical
    undetected-crash pattern.
  - Broad audit deferred to a follow-up feature — the audit is mechanical (grep +
    array entries), so deferring buys nothing and leaves known-vulnerable code
    unguarded in the meantime.

  **Rationale:** `grep -n 'container\.resolve(' feature-agent-worker.ts` surfaces every
  call site; filtering to non-string-literal arguments gives exactly these 9 classes
  (counting `CheckAndUnblockFeaturesUseCase` as a direct addition per the resolved open
  question above). None of the 9 has an explicit `container.register()` call anywhere
  in the DI modules — they resolve purely from their own `@injectable()` decorators,
  which is why the existing string-token-only test pattern never caught this class of
  bug.

  ### 3. TDD RED/GREEN verification

  **Chosen:** Revert `@inject('IConflictResolutionService')` back to the buggy
  `@inject('ConflictResolutionService')` locally, run the integration test file, confirm
  the new assertions fail with tsyringe's native error chain, then revert back before
  committing. The revert is never part of any commit.

  **Rejected:**
  - Synthetic mini-container unit test — weaker guarantee since it doesn't exercise the
    real registration modules.
  - Skipping RED entirely — violates the project's MANDATORY TDD rule; the local revert
    costs nothing since it's never committed.

  **Rationale:** The real bug was fixed before this spec existed (commit `5ace9fe`), so
  there is no naturally-failing production code left to drive RED. A local, uncommitted
  revert against the real container and real registration modules is the closest
  approximation to genuine RED available, and directly proves the new assertions would
  have caught the original incident.

  ## Library Analysis

  | Library | Purpose | Decision | Reasoning |
  | ------- | ------- | -------- | --------- |
  | tsyringe | DI container | Use (already in place) | `container.resolve(ClassRef)` is a built-in overload of `DependencyContainer.resolve<T>(token: InjectionToken<T>)` where `InjectionToken<T> = string \| symbol \| constructor<T>` — no new API surface needed, just a new set of arguments to an existing call. |
  | vitest | Test runner | Use (already in place) | File already uses `describe`/`it`/`expect`/`beforeAll`/`afterAll` from vitest; new block reuses the same imports. |
  | better-sqlite3 | In-memory test DB | Use (already in place) | `createInMemoryDatabase()` helper already provides the `Database` token the scoped container needs; no new fixture required per NFR-3. |

  ## Security Considerations

  No security-relevant surface. This is a test-only change with zero production code
  modification (NFR-4) — no new inputs, no new trust boundaries, no data handling
  changes. The only "sensitive" behavior touched is that the existing `beforeAll` hook
  already overrides `SHEP_HOME`/`HOME` to a temp directory so `loadOrCreateSecretKey()`
  doesn't touch the real `~/.shep` — untouched by this feature.

  ## Performance Implications

  Negligible. Each new `container.resolve(ClassRef)` call reuses the same in-memory
  SQLite database and the same fully-registered `scopedContainer` already built once in
  `beforeAll` for the entire test file (NFR-3) — no new I/O, no new mocks, no new
  fixtures. Constructing 9 additional use-case/service instances synchronously is on the
  order of microseconds; the file's existing 75+ token resolutions already dominate any
  runtime cost and the suite's total run time is dominated by SQLite migrations and
  cloud-provider registry construction, not by DI resolution count.

  ## Architecture Notes

  This slots into the file's existing two-tier convention without introducing a third:
  `WEB_ROUTE_TOKENS` and `CRITICAL_INFRA_TOKENS` are both `readonly string[]` resolved via
  `scopedContainer.resolve(token)` (string overload); the new
  `WORKER_CRITICAL_USE_CASE_CLASSES` is a `readonly (constructor)[]` resolved via
  `scopedContainer.resolve(ClassRef)` (class overload) — same method, same container,
  same instance-per-`beforeAll` setup, different `InjectionToken` variant. This keeps
  the test file's role as the single authoritative "does the real production container
  construct everything it needs to construct" gate, per the Clean Architecture
  boundary this repo enforces: use cases stay the only entry point resolved
  (`code-quality.md` — "Use Cases as the Only Entry Point"), and this test is what
  proves, at the DI-wiring level, that every use case the feature-agent worker depends
  on is actually constructible end-to-end.
