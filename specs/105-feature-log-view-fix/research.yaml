    chosen: >
      Add a new `WORKER_CRITICAL_USE_CASE_CLASSES: readonly (new (...args: never[]) => object)[]`
      const array immediately after the existing `CRITICAL_INFRA_TOKENS: readonly string[]`
      array in container-bootstrap.test.ts, populated with class references (imported
      at the top of the file, same pattern already used for `SelectProjectMemoryUseCase`)
      for all 9 classes feature-agent-worker.ts resolves via `container.resolve(ClassRef)`:
      InitializeSettingsUseCase, CleanupFeatureWorktreeUseCase, SelectProjectMemoryUseCase,
      RecordProjectMemoryUseCase, UpdateFeatureLifecycleUseCase, FeatureAgentLifecyclePublisher,
      FeatureAgentGateQuestionPublisher, FeatureAgentSupervisorGateEvaluator, and
      CheckAndUnblockFeaturesUseCase (added explicitly even though it's only reached
      transitively through UpdateFeatureLifecycleUseCase's constructor, per FR-1/FR-2,
      so the incident's own use case has a direct, named assertion rather than relying
      on transitive coverage alone). A new `describe('every worker-critical use case
      resolves', ...)` block loops the array with one `it(...)` per class, calling
      `scopedContainer.resolve(UseCaseClass)` and asserting the result is defined and
      non-null — the exact structural mirror of the existing `describe('every web-route
      token resolves', ...)` and `describe('every critical infra token resolves', ...)`
      blocks two sections above it in the same file.
    rejected:
      - "Reuse CRITICAL_INFRA_TOKENS (string array) by adding each class's registered string token instead of a class reference — rejected because feature-agent-worker.ts:281,306,311,347,402,416,421,427 all call container.resolve(ClassRef) directly (tsyringe resolves unregistered @injectable() classes structurally, with no string-token registration at all for most of them), so a string-token entry would resolve via a different tsyringe code path than the one that actually crashed, weakening the fidelity the spec's first open question explicitly selected class-reference resolution to preserve."
      - "Inline the 9 class resolutions as ad-hoc it() blocks without a shared array/loop — rejected because it introduces a second describe-block style in a file that has two existing list-driven describe blocks; NFR-1 requires the new block match the file's existing structure exactly, and a hand-written it() per class drifts from that pattern the first time someone forgets to add a new entry."
    rationale: >
      tsyringe's DependencyContainer.resolve() is overloaded to accept either a string
      token or a constructor function (InjectionToken<T> = string | symbol | constructor).
      Passing the class directly, as feature-agent-worker.ts does at every one of its
      eager-boot call sites, walks tsyringe's own @injectable()/@inject() metadata to
      build the full constructor argument graph — including any transitively-injected
      string tokens deep in that graph (e.g. IConflictResolutionService buried inside
      CheckAndUnblockFeaturesUseCase, itself buried inside UpdateFeatureLifecycleUseCase).
      This is precisely why resolving by class was selected in the spec's first open
      question: it reproduces the real crash with the fewest new lines, and a single
      loop over a typed array keeps the addition indistinguishable in style from the
      file's two existing list-driven describe blocks (WEB_ROUTE_TOKENS, CRITICAL_INFRA_TOKENS).

