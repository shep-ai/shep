name: "feature-log-view-fix"
summary: >
  container-bootstrap.test.ts already resolves ~75 string tokens against the real
  production DI container but never resolves the use-case/service classes that
  feature-agent-worker.ts eagerly constructs via container.resolve(ClassRef) — the
  exact call shape that crashed on the mismatched 'ConflictResolutionService' /
  'IConflictResolutionService' token. Fix: add a new readonly class-reference array
  (WORKER_CRITICAL_USE_CASE_CLASSES) covering all 9 classes the worker resolves by
  class at boot, with its own describe/loop block mirroring the file's existing
  string-token pattern. No production code changes — packages/core/src/** stays
  untouched since the runtime fix already shipped in 5ace9fe.

