  mirrored describe/loop/assert block, and extend the header doc-comment so future
  maintainers know to keep the list in sync. Phase 2 (tasks 5-6) is pure verification —
  no new code — proving via a local, never-committed revert of the already-fixed
  @inject decorator that the new assertions genuinely reproduce the original incident's
  tsyringe error chain (RED), then confirming the real fix passes cleanly (GREEN) with
  zero residual changes under packages/core/src/**. Phase 3 (task 7) runs the standard
  pre-push gate (lint, format, typecheck, unit + integration tests, build) required by
  this repo's CI/CD rules before the change is considered done. No production code is
  touched at any point — the runtime fix already shipped in commit 5ace9fe.
