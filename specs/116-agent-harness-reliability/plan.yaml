content: |
  ## Architecture Overview

  No new components. Each fix tightens an existing seam:

  ```
  executor ──events──▶ StreamingExecutorProxy ──result/throw──▶ graph node ──▶ AgentRunner.mark*
  worker ──updateStatus(allowedFrom)──▶ agent_runs ◀──updateStatus(allowedFrom)── Approve/Reject/Stop
  agent_messages/questions ──poll──▶ StreamAgentEvents (seeded cache) ──SSE──▶ useAgentEvents
  ```

  ## Implementation Strategy

  Phases touch disjoint files and run in parallel. Each task is RED first: a test reproducing the
  reference failure against the current code, then the minimal fix.

  ## Testing Strategy (TDD: Tests FIRST)

  Unit tests with fake executors / fake child processes for phase 1; the in-memory SQLite
  repository for the conditional-write claims in phase 2 (a real `UPDATE … WHERE status IN`
  exercised twice); use-case tests with fake repositories and fake timers for phase 3.

  ## Risk Mitigation

  | Risk | Mitigation |
  | --- | --- |
  | A legitimate empty turn now fails | Only reject where the terminal event is mandatory (Claude `result`) or the process was signalled |
  | Resume from `interrupted` refused by the boot claim | Resume/approve write `running` before spawn; the worker claim allows `pending`/`running` |
  | Error-message classification relies on "Agent execution timed out" | Keep that prefix; append the budget |
