    - Extract shared helpers where two executors repeat the same outcome rule
  estimatedEffort: M
- id: task-5
  phaseId: phase-2
  title: Worker status writes cannot clobber Stop
  description: Boot, heartbeat and node-start writes of running use allowedFrom [pending, running]; terminal
    writes use allowedFrom [running]; a refused boot claim exits before the graph runs.
  state: Done
  dependencies: []
  acceptanceCriteria:
  - run interrupted before boot -> worker does not invoke the graph
  - heartbeat after Stop leaves status interrupted
  - completed write after Stop leaves status interrupted
  tdd:
    red:
    - 'Write a test reproducing: run interrupted before boot -> worker does not invoke the graph'
    - 'Write a test reproducing: heartbeat after Stop leaves status interrupted'
    - 'Write a test reproducing: completed write after Stop leaves status interrupted'
    green:
    - Minimal change making the tests pass
    refactor:
    - Extract shared helpers where two executors repeat the same outcome rule
  estimatedEffort: M
- id: task-6
  phaseId: phase-2
  title: Approve and Reject claim the run atomically
  description: The waitingApproval -> running transition is a conditional update; the loser does not spawn.
  state: Done
  dependencies: []
  acceptanceCriteria:
  - two concurrent approves -> spawn called once
  - approve + reject concurrently -> one worker
  tdd:
