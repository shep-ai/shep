name: agent-harness-reliability
summary: 12 tasks across 3 parallel phases; each fix is RED-first.
relatedFeatures: []
technologies: []
relatedLinks: []
tasks:
- id: task-1
  phaseId: phase-1
  title: StreamingExecutorProxy reports failed and truncated streams
  description: execute() rejects on an error event or when no result event arrived; the shared channel
    is closed once by AgentRunnerService, not after every node call.
  state: Done
  dependencies: []
  acceptanceCriteria:
  - error event -> execute() rejects with its content
  - stream without a result event -> rejects
  - a second execute() on the same proxy still pushes events to the channel
  tdd:
    red:
    - 'Write a test reproducing: error event -> execute() rejects with its content'
    - 'Write a test reproducing: stream without a result event -> rejects'
    - 'Write a test reproducing: a second execute() on the same proxy still pushes events to the channel'
    green:
    - Minimal change making the tests pass
    refactor:
    - Extract shared helpers where two executors repeat the same outcome rule
  estimatedEffort: M
- id: task-2
  phaseId: phase-1
  title: Subprocess executors reject signal kills and missing terminal events
  description: A signal kill rejects even with partial output (codex, cursor, copilot, kimi, cline); Claude
    exit 0 with no result event rejects.
  state: Done
  dependencies: []
  acceptanceCriteria:
  - 'codex/cursor/copilot/kimi/cline: close(null,''SIGKILL'') after partial text rejects naming the signal'
  - 'claude: exit 0 without a result event rejects'
  tdd:
    red:
    - 'Write a test reproducing: codex/cursor/copilot/kimi/cline: close(null,''SIGKILL'') after partial
      text rejects naming the signal'
    - 'Write a test reproducing: claude: exit 0 without a result event rejects'
    green:
    - Minimal change making the tests pass
    refactor:
    - Extract shared helpers where two executors repeat the same outcome rule
  estimatedEffort: M
- id: task-3
  phaseId: phase-1
  title: Max-turns and error results fail in stream mode
  description: Claude executeStream emits an error for error_max_turns / is_error results; cursor honours
    is_error; AI SDK stream rejects on finishReason length/content-filter/error.
  state: Done
  dependencies: []
  acceptanceCriteria:
  - claude stream error_max_turns -> error event, no result event
  - AI SDK stream finishReason 'length' -> throws
  tdd:
    red:
    - 'Write a test reproducing: claude stream error_max_turns -> error event, no result event'
    - 'Write a test reproducing: AI SDK stream finishReason ''length'' -> throws'
    green:
    - Minimal change making the tests pass
    refactor:
    - Extract shared helpers where two executors repeat the same outcome rule
  estimatedEffort: M
- id: task-4
  phaseId: phase-1
  title: Timeouts name their budget and upstream fetches are bounded
  description: Timeout errors keep the 'Agent execution timed out' prefix and append the budget; AI SDK
    TimeoutError classifies as timeout; model-catalog fetches pass AbortSignal.timeout.
  state: Done
  dependencies: []
  acceptanceCriteria:
  - message contains the timeout in seconds
  - TimeoutError -> timeout classification
  - catalog fetch receives a signal
  tdd:
    red:
    - 'Write a test reproducing: message contains the timeout in seconds'
