content: '## Summary


  Phase 1 makes turn outcomes truthful, phase 2 guards run-state writes, phase 3 removes stream replays.


  ## Acceptance Checklist


  - [ ] Every task''s RED test fails on the old code

  - [ ] pnpm lint, typecheck, test:unit, test:int, build pass

