content: |
  ## Problem Statement

  The reference list ("harness bugs") names failure modes of an agent runtime. Triage against
  shep found these reproduce, each cited in research.yaml:

  | Reference bug | shep equivalent |
  | --- | --- |
  | cut stream parsed as a successful empty turn | `StreamingExecutorProxy.execute()` ignores `error` stream events and returns `''`; subprocess `execute()` resolves on any close, including a signal kill after partial output |
  | providers treating any connection close as done | the same — no executor requires its terminal event before resolving |
  | sub agents hitting the turn limit, all reporting completed | Claude `executeStream`, Cursor and the AI SDK stream map `error_max_turns` / `is_error` / `finishReason` other than `stop` to a normal result |
  | stop button clobbered by a stale write from the step it was stopping | every worker write of `running` (boot, heartbeat, node start) and every terminal write is an unconditional `UPDATE … WHERE id = ?`, so a Stop is overwritten by the worker it stopped |
  | two parallel approvals both waking one turn, executed twice | Approve / Reject check the status, await, then write `running` and spawn — two concurrent approvals start two workers on one worktree |
  | failure cleanup timing out and logging skipped | an exception from the worker's `failed` write skips the lifecycle reset, the `run:failed` event and the log line |
  | retry budget of 1 killing turns one step from done | CI watch runs with `maxAttempts: 1` and a failed watch burns a CI-fix attempt |
  | 120s idle guard / opaque error; no read timeout on upstream clients | every timeout rejects with a bare "Agent execution timed out"; the AI SDK `TimeoutError` is not classified as a timeout; model-catalog fetches have no timeout |
  | cached tokens double billed | `shep usage` adds cache-read and cache-creation tokens on top of an input count that already contains them |
  | poison message re-flushed on every reconnect / reset loop every N seconds | every agent-events SSE connection replays the full message/question/decision history as new, and the direct EventSource client reconnects every ~61s because the server heartbeat is an SSE comment the browser never dispatches |
  | approval hook registered 171 times | the agent-events poll loop adds an `abort` listener to the request signal every 2s and never removes it |
  | 10MB session log replayed | `/api/feature-logs` compares a byte size to a UTF-16 length, so any non-ASCII log is re-read whole every 2s forever |

  ## Success Criteria

  - A stream that ends with an `error` event, or with no `result` event, makes
    `StreamingExecutorProxy.execute()` reject; the channel stays open across node calls.
  - A subprocess killed by a signal rejects even when partial output was captured; Claude exit 0
    with no `result` event rejects; max-turns / `is_error` results reject in stream mode.
  - After Stop, no worker write can move the run out of `interrupted`; a worker that finds its run
    no longer claimable exits without executing the graph.
  - Two concurrent Approve (or Approve + Reject) calls on one run spawn exactly one worker.
  - Timeout errors state the budget that elapsed; AI SDK timeouts classify as `timeout`.
  - `shep usage` total tokens count each cached token once.
  - An SSE reconnect emits no event for a message, question or decision the connection history
    already contains; the abort-listener count stays constant across poll ticks; the direct
    client does not reconnect while the server is healthy.
  - The feature-log tail reads only appended bytes.

  ## Affected Areas

  | Area | Impact | Reasoning |
  | --- | --- | --- |
  | `infrastructure/services/agents/streaming` | High | proxy outcome + channel lifetime |
  | `infrastructure/services/agents/common/executors` | High | terminal-event and signal-kill outcome |
  | `infrastructure/services/agents/feature-agent` | High | guarded status writes, boot claim, failure path |
  | `application/use-cases/agents` (approve/reject/stop) | High | atomic claim |
  | `application/use-cases/usage` | Low | token total |
  | `application/use-cases/agents/stream-agent-events*` + `web/hooks/use-agent-events.ts` | Medium | reconnect replay, listener leak, heartbeat |
  | `web/app/api/feature-logs` | Medium | incremental read |

  ## Scope

  The first pass covered the success criteria above. A follow-up pass fixed every other finding
  the triage confirmed; nothing confirmed is deferred. Items the triage marked N/A for shep
  (tracing/span volume, a small default context window, tool-call argument parsing) have no code
  here to change.

  Added during implementation: Stop and the worker's SIGTERM handler use the same guarded write,
  Stop records `interrupted` before signalling, and Approve/Reject hand their claim back when the
  resume worker fails to start.

  Fixed in the follow-up set (originally deferred or found by a second audit):

  - A run-liveness sweep (`ReconcileAgentRunLivenessUseCase`) runs inside the feature and agent
    list/show use cases, so the CLI, TUI, MCP and web dashboard all trigger it. A dead worker's
    run is marked `interrupted`, a live worker whose heartbeat is stale for 10 intervals is failed
    and its process tree force-killed, and a run whose worker never recorded a pid within 30
    minutes is failed. Every write is guarded by status and by the exact `updated_at` it judged.
  - Stop terminates the worker's whole process tree (the worker process group plus a tree kill)
    and escalates to SIGKILL after 5s; on Windows it is a single forced tree kill.
  - `shep stop` / `restart` / `upgrade` no longer kill daemon-forked feature workers: they signal
    the daemon's process group on Unix, and force-kill only the daemon pid on Windows. Workers mark
    their environment (`SHEP_AGENT_RUN_ID`, `SHEP_FEATURE_ID`). From inside an agent run, those
    commands, `shep agent stop` / `agent delete --force` on the caller's own run, and the MCP
    `stop_agent_run` tool refuse without `--force` (`force: true` for MCP). The SQLite-busy
    message no longer tells the reader to stop the daemon.
  - A Blocked child of a parent whose run failed, was interrupted or was cancelled gets a
    `blocked-on-parent` activity entry naming why; the reconcile loop logs per-parent errors.
  - An auto-rebase that times out is reported at once, but the child agent is spawned only once
    the git operation has settled.
  - `AgentExecutionOptions.abortSignal` is honoured by every subprocess executor, through one
    shared helper, and by the AI SDK executors. A parallel implement phase aborts its sibling
    tasks on the first failure and awaits their teardown. An aborted call is never retried.
  - The MCP config temp file is unique per write, so one worker's teardown cannot delete
    another's file.
  - The parallel-feature slot count ignores features whose current run is terminal; a stop or a
    run failure drains the queue; and Resume claims a slot (and switches the run) in one
    statement, refusing with the reason when the cap is full (`shep feat resume --force`
    overrides, like `feat start --force`).
  - Spec phases retry transient API/network errors through `retryExecute`; timeouts, signal
    kills, max-turns, auth failures and aborts are never retried; a cut stream is retried once.
    The CI watch and CI fix calls retry only transient errors.
  - Codex and Copilot fail a turn that exits 0 without its terminal event. Every agent call has a
    timeout (structured calls, repair, conflict resolution, the supervisor passes it to the
    executor), and every subprocess executor honours an opt-in idle timeout ("no output for Ns")
    that feature nodes set to 15 minutes (Cursor/Gemini one-shot JSON mode excepted: it is
    silent until done by design and stays bounded by the total timeout).
  - Usage counts cache tokens once in both the batch and interactive Claude executors; worker
    logs cap each tool call's input at 2000 characters.
  - The messaging tunnel reconnects after a failed connect with capped exponential backoff,
    refreshes its token per attempt and detects half-open sockets; messaging config is read
    fresh, and a pairing code cannot be replayed.
  - GitHub webhooks carry a persisted per-installation tag and secret; only this
    installation's stale hooks are removed.
  - `shep start` holds a cross-process lock and records the daemon only once it is ready.
  - The notification watcher polls only active and tracked runs, with an in-flight guard.
    Answers from another process reach an awaiting agent (the awaiter polls its row), and
    Answer/Cancel settle a question in one conditional write; the loser is told on CLI and web.
  - Stopping a session that is not in memory marks its persisted row stopped and settles any
    pending interaction.
  - The agent-events service worker tracks subscribers per client and per scope, forwards
    heartbeats, and pages re-subscribe when it goes silent.
  - Claude, Codex and Cursor transcript listings read only appended bytes and tolerate a
    half-written last line; the long-running daemon prunes retained data and old worker logs
    hourly (never a running feature's log); CLI log readers honour `SHEP_HOME` and decode
    multi-byte text across reads; operation-log polling stops when idle and is bounded; delivery
    dedupe sets are trimmed at the time cursor.

  ## Dependencies

  None. Uses the existing `allowedFrom` conditional-update option on `IAgentRunRepository.updateStatus`.

  ## Size Estimate

  L — about fifteen files across three independent clusters (executor outcome, run-state writes,
  web streaming), each individually small.
