name: "agent-harness-reliability"
number: 116
branch: "claude/wonderful-ride-w2offi"
oneLiner: |-
  Stop the agent harness reporting failed, stopped or truncated turns as successes, and stop it replaying or re-reading state it has already delivered
summary: |-
  A list of agent-harness bugs from another system was triaged against shep by three parallel
  code audits. Twenty-odd patterns reproduce here by reading the code. This feature fixes the
  ones where shep records a false outcome, runs one action twice, or does unbounded repeated
  work. Every fix is guarded by a regression test that fails on the old code.
