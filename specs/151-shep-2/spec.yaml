oneLiner: >-
  Shep 2 — hand over tasks from wherever they live at night, review tested pull requests in the
  morning. One Rust core, four surfaces (CLI, terminal UI, Mac app, MCP), four commands.
summary: >
  A new Shep, built from zero on the outside. You hand it tasks the way you hand them to a
  teammate, in the tool where they already live (Linear, Jira, Notion, Monday, Slack, GitHub,
  or a sentence typed to Shep);
  your own coding agent works each one unattended in its own worktree, overnight or now; in the
  morning you review finished draft pull requests that already pass CI, with screenshot proof
  and a second-opinion review, and press Merge or Send back. The product has a hard budget: one
  thing (a task), five states, four core actions, four surfaces that all show the same thing.
  The engine is a single Rust binary (daemon, CLI, terminal UI, MCP server) that a native
  SwiftUI Mac app talks to over a versioned JSON-RPC protocol. Proven engine pieces from Shep 1
  are ported and trimmed; three are new (task intake from sources, waiting out usage limits,
  keeping the machine awake). Shep answers where the task came from. There is no Shep server.
  Shep 1 freezes at 1.x with security fixes only.
phase: Requirements
sizeEstimate: XL

