# Open questions (must be resolved before implementation)
openQuestions:
  - question: Keep the name Shep, given herdr (a much larger herd/shepherd-themed product)?
    resolved: true
    answer: >
      Keep Shep. The pitch carries the meaning: "Dependabot for your backlog". Decided by the
      owner on 2026-10-30.
  - question: Keep the sheep imagery, given herdr's 🐑 and its "Pasture" layout?
    resolved: true
    answer: >
      Keep sheep. Constraint: Shep's sheep must read as clearly different from herdr's — sheep
      are tasks walking into a pen at dawn (progress), never agents wandering a pasture
      (activity). Decided by the owner on 2026-10-30.
  - question: Mac-first or cross-platform desktop app at launch?
    resolved: true
    answer: >
      Mac-first, native SwiftUI. The Dynamic Island, Live Activities, App Intents and
      notifications with action buttons need Apple frameworks. The CLI, terminal UI and MCP
      server still run on Linux. Other desktops later via Tauri on the same Rust core.
      Decided by the owner on 2026-10-30.
  - question: Rust or TypeScript on Bun for the core?
    resolved: true
    answer: >
      Rust, without a comparison spike. Decided by the owner on 2026-11-01. Reasons: herdr's
      Apache-2.0 code is Rust and can be reused directly; a single native binary with a small,
      steady footprint suits a daemon that runs all night; Ratatui + tachyonfx is the most mature
      terminal UI stack for the planned effects.
  - question: Reuse herdr code, depend on herdr-core, or rewrite?
    resolved: true
    answer: >
      Copy patterns and selected Apache-2.0 code with attribution, only from revisions after
      2026-07-22 (earlier history was AGPL). Do not depend on herdr-core at runtime: its API is
      in preview and owned by a competitor. Keep interop: Shep reports task state over OSC 7501
      so a Shep session shows correctly in herdr (as spec 149 does today).
  - question: Where does the v2 code live?
    resolved: true
    answer: >
      In a self-contained Cargo workspace at `shep2/` in this repository. It shares nothing with
      Shep 1's pnpm workspace, so it can move to a `next` branch or its own repository later
      without changes.
  - question: Does v2 need a Shep server for task sources (Slack, Linear, Jira, Notion, Monday)?
    resolved: true
    answer: >
      No. The work happens overnight, so polling every few minutes is invisible. Trackers are
      polled with personal tokens kept in the OS keychain; Slack connects over Socket Mode from
      the user's machine with one Slack app per team, created from a manifest. Hand-over is a
      label, a status (Tonight) or a reaction, not "assign to Shep" as a person. A thin relay
      that stores nothing may be added later for app identities and a Marketplace Slack app.

  - question: What is the npm package name?
    resolved: true
    answer: >
      `shep2` (`npx shep2`); the installed command is `shep`. `shep` is held by Bustle Labs (an
      AWS API framework, last published 2018); we will ask for a transfer, offering to publish
      from 6.0.0 so their 5.x users are unaffected. If it is transferred, `shep` becomes the main
      name and `shep2` stays as an alias. Rejected: `night` (taken), `nightshift` (blocked by
      npm's punctuation rule against `night-shift`; a competing agent tool already ships a
      `nightshift` command; clashes with macOS Night Shift), `shepai` (hard to remember).
      Decided by the owner on 2026-11-01.

# Markdown content (the actual spec)
content: |
  ## Problem Statement

  Shep 1 grew to 56 CLI command groups, about 35 web sections, 27 feature flags, 75 use-case
  areas and about 346K lines of source. New users cannot find the core loop, the pitch differs
  on every surface, and npm downloads fell from 59K (March 2026) to about 7.6K a month. The
  parallel-agents-in-worktrees promise is now offered by Conductor, Codex, Cursor, Claude Code,
  GitHub Agent HQ, Amp and herdr. Every one of them is designed around watching an agent work.
  None is designed for the moment you come back: what finished while you were away, with proof,
  and a fast decision on each result. Shep 2 is that product and nothing else.

  ## The Contract

  | Budget | Value | Rule |
  | ------ | ----- | ---- |
  | Things | 1 | A **task**: anything you'd hand a teammate, from any source (see Sources) |
  | States | 5 | Queued → Working → Needs you / Ready → Merged |
  | Core actions | 4 | `add(task)`, `start(at?)`, `board()`, `review(id, action)` |
  | Surfaces | 4 | CLI, terminal UI, Mac app, MCP — every surface calls only the 4 actions |

  Adding a 5th command, a 6th state, a second web page or a 4th MCP tool requires removing one.
  Shep never merges on its own: agents open draft PRs; a person presses Merge.

  ## Surfaces

  **CLI (4 commands)**

  | Command | Does |
  | ------- | ---- |
  | `shep` | Opens the board (terminal UI). The first run of the day prints the morning brief inline. |
  | `shep add "<task>"` | Queues an issue (`#412`, a URL) or a sentence |
  | `shep go [--at HH:MM]` | Starts queued tasks now, or at a time; keeps the machine awake while they run |
  | `shep config` | Agent, repo, start time, parallelism |

  **Terminal UI** — one board: Queued | Working | Ready (Needs you shown with `!`). Keys: arrows
  move, `m` merge, `s` send back, `g` start queued. A split view (`2`) shows the task list, the
  selected agent's live session, its diff, and CI and proof side by side; `enter` attaches to the
  agent so you can type to it, `z` zooms a pane. A 2-second ASCII splash on the first run of
  the day (skippable, settles to a still frame). An optional watch screen for overnight: a sky
  band that warms toward dawn as tasks finish, per-task activity graphs, a slow status-line
  shimmer. One `--no-motion` switch turns every animation off; `NO_COLOR`, CI and
  non-interactive output disable motion and color automatically.

  **Mac app (SwiftUI)** — one review window sorted by verdict (Ready, Needs you, Working,
  Queued), proof first (screenshot is the hero, diff one key away), single-key decisions
  (`M`, `S`, `J`/`K`, `Space`). Clearing the queue shows the dawn. A Live Activity in the
  Dynamic Island or menu bar shows overnight progress. A morning notification carries a
  "Merge N green" action. App Intents expose "Queue issue", "Show ready PRs", "Merge all green".

  **MCP (3 tools)** — `add_task`, `board`, `review`. Lets any MCP-capable agent hand work to
  Shep ("give this to Shep for tonight").

  ## Sources

  A task comes from wherever the work already lives, and Shep answers in the same place.

  | Source | Hand it over | Right away | By morning |
  | ------ | ------------ | ---------- | ---------- |
  | GitHub | Label `shep` | Comment "Queued for tonight" | Draft PR that closes the issue |
  | Linear | Label `shep` or status Tonight | Comment, status Tonight | PR linked, proof comment, status In review |
  | Jira | Move to a Tonight column | Comment and transition | PR and build status, moves to Review |
  | Notion | Status Tonight in a tasks database | A Shep property: queued | PR link and screenshot on the page |
  | Monday | Status Tonight | An update on the item | PR link column, status In review |
  | Slack | `:sheep:` reaction or "@Shep tonight" | Thread reply | Thread reply with PR, proof, Merge / Send back |
  | Shep itself | `shep add "<sentence>"`, the Mac app, MCP | — | The board and the morning brief |

  Questions are asked and answered where the task came from. Every source is an adapter behind
  one interface (`poll` / `acknowledge` / `report`); GitHub ships first, then Slack and Linear,
  then Jira, Notion and Monday. Onboarding starts with "Where do tasks come from today?".

  ## Engine

  Ported from Shep 1 and trimmed: worktree per task, agent runners (any agent CLI, resolved
  through a provider interface, never hardcoded), CI watch with agent fix loop, screenshot and
  test proof, second-opinion code review.

  New: task intake from sources; park on a usage limit and resume after the reset; keep the machine
  awake during a shift (caffeinate / systemd-inhibit).

  Adopted from herdr's Apache-2.0 work (patterns, and code where it fits, with attribution):
  task state reported and consumed over OSC 7501 with screen-reading manifests as fallback and
  an `explain` command; a PTY holder process separate from the daemon so upgrades and crashes do
  not kill running agents; agent resume hooks for Claude Code and Codex; attach to an agent's
  live session so "Send back" continues the same conversation; the reviewer as a child agent
  that reports back; a client API generated from Rust types with a test that it only grows.

  ## Architecture

  One Rust binary, `shep`: engine, overnight daemon, CLI, terminal UI (Ratatui + tachyonfx), MCP
  server (rmcp). The daemon serves JSON-RPC 2.0 over a local Unix socket; the schema is published
  as OpenRPC and the Swift client types are generated from it. Storage is SQLite with three
  tables (tasks, runs, events). Distribution: Homebrew (`brew install shep-ai/tap/shep`), a curl
  installer, and `npx shep2` through an npm wrapper with per-platform binaries. Target: core under 10K lines.

  ## Success Criteria

  - [ ] A task handed over in GitHub, Slack or Linear is acknowledged in place within five minutes and answered in place by morning
  - [ ] Six real GitHub issues queued at night on a real repo produce six draft PRs by morning, each with CI green or a clear "needs you" question
  - [ ] An overnight run survives a usage-limit window and a daemon restart without losing a task
  - [ ] The morning review of six PRs takes under five minutes in the terminal UI and in the Mac app
  - [ ] All four surfaces perform every action through the same four core calls
  - [ ] `shep --help` lists exactly four commands
  - [ ] First run to first draft PR on the user's own repo in under ten minutes
  - [ ] Core under 10K lines; single binary; cold start and idle memory measured and reported
  - [ ] `--no-motion` disables every animation; no animation runs in CI or non-interactive output

  ## Out of Scope

  Web app beyond one review page, project management (epics, cycles, time entries, saved views),
  ASPM, incidents, opportunities, discovery, feedback themes, outcomes, clusters, WhatsApp,
  feature flags, plugin marketplace, multi-user teams, general tmux-style pane management (the one
  fixed split view is in scope), auto-merge, a Shep server.

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | New Cargo workspace `shep2/` | High | All v2 code is new |
  | Shep 1 (`packages/`, `src/`) | Low | Frozen at 1.x; read for porting worktree, CI-fix, agent-runner and evidence logic |
  | Distribution (npm, Homebrew) | Medium | Same or new package name (open question) |
  | Docs and README | Medium | One pitch everywhere: "Dependabot for your backlog" |

  ## Dependencies

  Ports logic proven in 149 (agent activity and blocked reasons), 138 (git checkpoints), 111
  (fleet circuit breaker) and 090 (AI code review). No runtime dependency on Shep 1.

  ## Size Estimate

  **XL** - A new product: Rust core, terminal UI, MCP server, source adapters and a SwiftUI app.
  Phases: core and CLI; agent runs and PRs; terminal UI; MCP; sources; Mac app (needs a Mac);
  then Shep 2 builds its own remaining work overnight, then launch.

