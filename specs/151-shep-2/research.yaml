# Structured technology decisions
decisions:
  - title: Core language
    chosen: Rust
    rejected:
      - TypeScript on Bun with OpenTUI
      - C++
    rationale: >
      Decided by the owner on 2026-11-01 without a comparison spike. herdr's Apache-2.0 Rust code
      (PTY holder, status protocol, client API) can be reused directly; one native binary with a
      small, steady footprint suits an all-night daemon; Ratatui + tachyonfx is the most mature
      terminal UI stack for the planned effects. Cost accepted: Shep 1's TypeScript logic is
      ported by hand rather than reused.
  - title: Where the code lives
    chosen: Self-contained Cargo workspace at shep2/ in this repository
    rejected:
      - A new repository now
      - Inside Shep 1's pnpm workspace
    rationale: >
      Keeps stars, issues and history; shares nothing with Shep 1's build so it can move to a
      `next` branch or its own repository later without changes.
  - title: Domain model source of truth
    chosen: Rust types (serde) with the client schema generated from them (schemars → OpenRPC)
    rejected:
      - TypeSpec
    rationale: >
      TypeSpec-first governs Shep 1's TypeScript domain. In v2 the Rust types are the domain; every
      branching concept (state, source kind, review action) is a Rust enum, never a raw string,
      which keeps the same "no magic strings" discipline. The Swift client types are generated from
      the published OpenRPC schema.
  - title: Crate layout (Clean Architecture in Rust)
    chosen: shep-domain → shep-app → shep-infra → shep-cli (binary)
    rejected:
      - One crate
    rationale: >
      Mirrors Shep 1's dependency rule with the compiler enforcing it: domain has no I/O
      dependencies; app holds the four core actions and port traits; infra implements the ports
      (SQLite, git, agents, sources); the binary wires them and holds the surfaces.
  - title: Storage
    chosen: SQLite via rusqlite (bundled), three tables (tasks, runs, events)
    rejected:
      - sqlx
      - Plain JSON files
    rationale: Synchronous, bundled, no runtime; the daemon is the only writer.
  - title: Client protocol
    chosen: JSON-RPC 2.0 over a local Unix socket, schema published as OpenRPC
    rejected:
      - gRPC
      - HTTP on localhost
    rationale: >
      Same shape as Codex App Server and herdr; no open port; easy to generate Swift types from.
      A test asserts the schema only grows.
  - title: Task sources
    chosen: One `TaskSource` port with poll / acknowledge / report; adapters per tool; polling
    rejected:
      - Webhooks through a Shep server
    rationale: >
      No server to run or trust. Overnight work makes a few minutes of polling latency invisible.
      Slack uses Socket Mode (outbound WebSocket) with a per-team app created from a manifest.
      Tokens live in the OS keychain.
  - title: Agent processes
    chosen: portable-pty, with a PTY holder process separate from the daemon (herdr pattern)
    rejected:
      - Plain child processes owned by the daemon
    rationale: Agents keep running across daemon restarts and upgrades; sessions can be attached.

  - title: Daemon concurrency
    chosen: Plain threads (one per connection, one engine loop) and blocking I/O
    rejected:
      - tokio in the daemon
    rationale: >
      Decided while building task-6. The daemon serves a handful of local clients and polls a few
      agents; threads keep it small and easy to test, with no runtime to start. tokio arrives
      only where a library needs it (rmcp in the MCP server, Slack Socket Mode), in those
      surfaces, not in the core.
  - title: JSON-RPC transport
    chosen: >
      A generic crate (shep-jsonrpc) with one JSON message per line over a Unix socket in a 0700
      directory, socket 0600; used by the daemon protocol (shep-rpc) and the PTY holder
    rejected:
      - jsonrpsee
      - Content-Length framing (LSP style)
    rationale: >
      Line framing is trivial to read in Swift and from a shell (`nc -U`); a 0700 directory closes
      the window before the socket's own mode is set. The protocol crate stays apart from the
      transport so infrastructure (the holder) can reuse the transport without depending on a
      presentation crate.
  - title: Shep 2 files under a shared SHEP_HOME
    chosen: $SHEP_HOME/shep2.db, everything else under $SHEP_HOME/shep2/
    rejected:
      - Sharing Shep 1's daemon.json, daemon.log and logs/
    rationale: Shep 1 and Shep 2 can be installed side by side without touching each other's files.

  - title: How the engine drives a task
    chosen: >
      One saved step per task (Prepare, Agent, Publish, WatchCi, Waiting, Done), advanced on a
      timer; agents run in the PTY holder and are polled
    rejected:
      - A long-lived thread per task
    rationale: >
      Decided while building task-7. Saving the step after every move is what lets a restarted
      daemon carry on, and polling keeps every decision in plain, testable code in shep-app.
  - title: Agent conversations
    chosen: >
      A stable UUID per task and role, derived from the task; Claude Code gets `--session-id`
      then `--resume`; Codex resumes with `exec resume --last` (scoped to the worktree); Gemini
      with `--resume latest`. The reviewer runs in its own folder so it never becomes the
      worktree's latest conversation.
    rejected:
      - Parsing session ids out of agent output
    rationale: >
      Fixes, answers and send-backs continue the same conversation, as the design asks, without
      depending on each CLI's output format. Codex and Gemini resume behaviour is taken from
      their sources (2026-11) and is not yet verified with a real run.
  - title: Status protocol
    chosen: >
      OSC 7501 per the Program Status Protocol spec (rev 0.4), parsed by Shep's own code; screen
      manifests (patterns after herdr's Apache-2.0 manifests) only when an agent reports nothing
    rejected:
      - Copying a parser
    rationale: >
      The reference parser herdr-core uses comes from Ghostty (MIT); writing it from the spec
      avoids carrying another licence and keeps Shep compatible with herdr.
  - title: Screenshots in the pull request
    chosen: Committed alone on a `shep/proof/<task>` branch and embedded by blob URL
    rejected:
      - Committing them on the task branch (Shep 1's evidence folder)
    rationale: Proof never enters the diff a person merges.

