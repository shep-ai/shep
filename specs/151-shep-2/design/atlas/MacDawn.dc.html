<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mac dawn screen</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gloock&amp;family=Hanken+Grotesk:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
a{color:#f3b45c}a:hover{color:#ffe4b0}
</style>
</helmet>
<div style="position: relative; width: 1280px; height: 820px; box-sizing: border-box; background: #0e1230; color: #fff6e6; border-radius: 14px; overflow: hidden; font-family: 'Hanken Grotesk', 'Helvetica Neue', Arial, sans-serif">
  <img src="assets/hero-dawn.png" alt="Dawn: the sun rises behind the pen, every sheep inside" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; image-rendering: pixelated">
  <div style="position: absolute; left: 0; right: 0; top: 0; padding: 16px 20px; display: flex; gap: 8px"><i style="width: 12px; height: 12px; border-radius: 50%; background: #ff5f57"></i><i style="width: 12px; height: 12px; border-radius: 50%; background: #febc2e"></i><i style="width: 12px; height: 12px; border-radius: 50%; background: #28c840"></i></div>
  <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 48px 56px; background: linear-gradient(transparent, #0a0d24f2 55%); display: flex; align-items: flex-end; justify-content: space-between; gap: 32px; flex-wrap: wrap">
    <div style="display: flex; flex-direction: column; gap: 10px; max-width: 560px">
      <span style="font-family: Gloock, Georgia, serif; font-size: 72px; line-height: 1">Dawn.</span>
      <span style="font-size: 20px; line-height: 1.45; color: #f6e3c8">The pen is full. Nothing left to review.</span>
      <div style="display: flex; gap: 22px; margin-top: 8px; font-size: 15px; color: #f6e3c8">
        <span><b style="font-family: Gloock, Georgia, serif; font-weight: 400; font-size: 30px; color: #fff6e6">5</b> merged</span>
        <span><b style="font-family: Gloock, Georgia, serif; font-weight: 400; font-size: 30px; color: #fff6e6">1</b> sent back</span>
        <span><b style="font-family: Gloock, Georgia, serif; font-weight: 400; font-size: 30px; color: #fff6e6">0</b> waiting</span>
      </div>
    </div>
    <div style="display: flex; gap: 12px; flex-wrap: wrap">
      <button type="button" style="font: inherit; font-size: 15px; font-weight: 700; color: #1a1405; background: #f3b45c; border: 0; border-radius: 10px; padding: 12px 20px; cursor: pointer">Queue tonight's work</button>
      <button type="button" style="font: inherit; font-size: 15px; color: #fff6e6; background: #0a0d2499; border: 1px solid #fff6e655; border-radius: 10px; padding: 12px 18px; cursor: pointer">Share the morning</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":820}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
