decisions:
  - title: Transport for a Cursor chat turn
    chosen: '`cursor-agent acp` — one long-lived ACP server process per chat session'
    rejected:
      - >-
        `cursor-agent --print --output-format stream-json --resume <chatId>` per turn — spawns a new
        process for every message, which LESSONS.md forbids for interactive chat, and has no way to
        pause for a question (tools are auto-run under --yolo)
      - >-
        Driving the interactive TUI through a pseudo-terminal — screen scraping, no structured
        events
    rationale: >
      The CLI has no stdin input format for `--print`. Its hidden `acp` command serves the Agent
      Client Protocol: verified against cursor-agent 2026.09.26, `initialize` advertises
      `loadSession: true`, `session/prompt` returns a stop reason after streaming `session/update`
      notifications, `session/cancel` is honoured, and questions arrive as a `cursor/ask_question`
      request. It is the same server Cursor's own editor integrations use.
  - title: ACP client implementation
    chosen: Official `@agentclientprotocol/sdk` (exact-pinned 1.5.0), `client()` app builder over `ndJsonStream`
    rejected:
      - Hand-written JSON-RPC over NDJSON — re-implements request ids, error mapping and schema validation the SDK already ships
      - Deprecated `ClientSideConnection` class — still exported, but the SDK marks it deprecated in favour of the app builder
    rationale: >
      Cursor itself bundles this SDK (0.14.1, protocol v1), so both ends speak the same generated
      schema. The builder's `agent().connect(clientApp)` lets unit tests run a real in-process ACP
      agent instead of mocking JSON. Its only peer dependency is `zod`, already a runtime
      dependency. Pinned exactly, like the Claude Agent SDK, to avoid surprise protocol drift.
  - title: Shape of the executor
    chosen: Generic `AcpInteractiveSession` (protocol → InteractiveAgentEvent) plus a thin Cursor profile
    rejected:
      - One Cursor-specific class holding transport, mapping and Cursor quirks together
    rationale: >
      Gemini CLI, Claude Code (via claude-code-acp) and others speak ACP too. Keeping the protocol
      handling agent-agnostic means the next ACP agent is a launch spec, not a copy (LESSONS.md:
      "Prefer a shared port when one provider gains a capability"). Cursor-only facts — binary,
      model-name map, the `cursor/ask_question` extension — live in the Cursor module.
  - title: Authentication
    chosen: Never call ACP `authenticate`; map an "Authentication required" error to "run `cursor-agent login`"
    rejected:
      - Calling `authenticate({ methodId: 'cursor_login' })` on every boot
    rationale: >
      The ACP server reads stored credentials and `CURSOR_API_KEY` at startup. Calling
      `authenticate` while logged out makes it try to open a browser — verified locally — which a
      background daemon must never do.
  - title: Tool permission requests
    chosen: Auto-select the agent's `allow_once` option (fallback `allow_always`, else the first option)
    rejected:
      - Forwarding every permission request to the user
    rationale: >
      Matches the one-shot Cursor executor (`--yolo`) and the Claude interactive executor, which
      auto-allow every tool except AskUserQuestion. `allow_once` avoids writing a permanent
      allowlist entry into the user's Cursor configuration.
  - title: Model selection
    chosen: After session/new or session/load, set the `model` config option when Cursor advertises the mapped id
    rejected:
      - Always sending `session/set_config_option` and failing the boot if the id is unknown
    rationale: >
      Shep's Cursor model ids come from `cursor-agent --list-models`; the ACP `model` config option
      advertises the values it accepts. Setting only an advertised value keeps an unknown id from
      failing the chat; the turn reports that Cursor's default was used instead.
  - title: Windows launch
    chosen: '`cmd.exe /d /s /c cursor-agent acp` with constant arguments'
    rejected:
      - PowerShell `& cursor-agent` (used by the one-shot executor to pass a long prompt)
      - Spawning `cursor-agent` directly — Node refuses to spawn a `.cmd` shim without a shell
    rationale: >
      The ACP command line never contains user text (prompts travel as JSON over stdin), so there
      is nothing to quote, and cmd.exe hands its own stdio handles to the child, which the
      bidirectional pipe depends on.

