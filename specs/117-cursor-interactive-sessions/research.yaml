content: |
  ## Technology Decisions

  ### 1. Transport: `cursor-agent acp`

  **Options considered:**

  1. Per-turn `cursor-agent --print --output-format stream-json --resume <chatId>`
  2. `cursor-agent acp` — Agent Client Protocol server over stdio
  3. Pseudo-terminal automation of the interactive TUI

  **Decision:** `cursor-agent acp`, one process per chat session.

  **Rationale:** Verified against cursor-agent 2026.09.26 by driving the server with raw JSON-RPC:

  ```
  initialize  -> agentCapabilities { loadSession: true, promptCapabilities { image: true }, sessionCapabilities { list } }
                 authMethods [{ id: "cursor_login" }]
  session/new -> (logged out) error -32000 "Authentication required ... run 'agent login'"
  authenticate(cursor_login) while logged out -> tries to open a browser (never call it from the daemon)
  stdin EOF   -> the server keeps running; it must be killed
  ```

  From the bundled agent: `session/prompt` resolves `{ stopReason: "end_turn" | "cancelled" }`;
  `session/load` replays history as `session/update` notifications before it returns; questions go
  out as the `cursor/ask_question` request `{ toolCallId, title, questions: [{ id, prompt,
  options: [{ id, label }], allowMultiple }] }` answered with `{ outcome: { outcome: "answered",
  answers: [{ questionId, selectedOptionIds }] } }` or `{ outcome: { outcome: "skipped", reason } }`;
  the model is a `select` config option with id `model`.

  Option 1 spawns a process per message (forbidden for chat by LESSONS.md) and cannot pause for a
  question. Option 3 has no structured events.

  ### 2. ACP client: official SDK

  **Decision:** `@agentclientprotocol/sdk` 1.5.0, using the `client()` builder and `ndJsonStream`.

  **Rationale:** Same generated schema Cursor uses; typed requests; in-process `agent()` apps make
  the protocol testable without mocking JSON lines.

  ### 3. Answers to Cursor questions

  Shep's question UI returns `Record<questionText, "Label A, Label B">`, and a free-text "Other"
  answer is allowed. Cursor's answer carries option ids only. Each selected label is matched back
  to its option id; when any question has no matching option (a free-text answer), the questions are
  returned as `skipped` with a reason that quotes every answer, so the agent still reads what the
  user wrote.

  ## Library Analysis

  | Library | Version | Purpose | Pros | Cons |
  | ------- | ------- | ------- | ---- | ---- |
  | @agentclientprotocol/sdk | 1.5.0 | ACP client over stdio | Official, typed schema, in-process test harness, Apache-2.0, peer dep `zod` already present | 5.6 MB unpacked; must be added to the Electron package too |

  ## Security Considerations

  - Tool permission requests are auto-approved, exactly like the one-shot Cursor executor's `--yolo`
    and the Claude interactive executor. `allow_once` is preferred so no permanent allowlist entry is
    written to the user's Cursor configuration.
  - The client advertises no `fs` or `terminal` capability, so the agent cannot ask Shep to read or
    write files or run commands on its behalf; it uses its own tools inside the worktree.
  - The spawn command line is constant (`cursor-agent acp`); prompts travel over stdin as JSON, so no
    user text reaches a shell on any platform.
  - `authenticate` is never called, so a background daemon never opens a browser.

  ## Performance Implications

  One persistent process per chat replaces a process spawn per message, removing CLI start-up from
  every turn. Idle sessions still hold a process until the session is stopped, the same trade-off
  the Claude interactive executor makes.
