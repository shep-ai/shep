content: |
  ## Architecture Overview

  ```
  SessionBootstrapper / TurnExecutor            (unchanged — consume InteractiveAgentSessionHandle)
          │ createInteractiveExecutor(Cursor)
          ▼
  AgentExecutorFactory ── INTERACTIVE_EXECUTORS registry (claude-code, cursor)
          │                    supportsInteractive() = registry membership
          ▼
  CursorInteractiveExecutor        (Cursor profile: binary, Windows launch, model map,
          │                          cursor/ask_question handler, "run cursor-agent login")
          ▼
  AcpInteractiveExecutor ─ spawn ─▶ cursor-agent acp   (one process per chat session)
          │                              ▲ stdin/stdout NDJSON (ndJsonStream)
          ▼                              │
  AcpInteractiveSession ── ClientApp ────┘
    initialize → session/new | session/load (replay suppressed) → set model
    send(msg)   → session/prompt → per-turn EventChannel
    session/update ──▶ acp-update-mapper ──▶ InteractiveAgentEvent (delta, thinking, tool_use, …)
    prompt response ─▶ done | error         process exit ─▶ error + channel closed
    session/request_permission ─▶ allow_once
    close() ─▶ session/cancel, kill tree, await exit
  ```

  ## Implementation Strategy

  **MANDATORY TDD**: All phases with executable code follow RED-GREEN-REFACTOR cycles.

  Phase 1 builds the three pure pieces the session composes: the Cursor model-name map (extracted
  from the one-shot executor so both executors share one table), the ACP `session/update` →
  `InteractiveAgentEvent` mapper, and the translation between Cursor's `cursor/ask_question` payload
  and Shep's `UserQuestion` / answer map. They have no I/O and are tested in isolation.

  Phase 2 builds `AcpInteractiveSession` — the protocol state machine — and tests it against a real
  in-process ACP agent (`agent()` from the SDK) wired through a fake child process whose stdio is
  PassThrough streams, so the NDJSON wire path is exercised without spawning anything. The Cursor
  executor is then a profile over it.

  Phase 3 registers Cursor in the factory, proves the persistent-process claim with a real
  subprocess (a Node fixture that serves ACP), and updates docs and LESSONS.md.

  The chat runtime is deliberately untouched: the handle contract (`send` then `stream` per turn,
  `sessionId`, `close`) already fits, and changing it would ripple through the Claude path.

  ## Testing Strategy (TDD: Tests FIRST)

  - **Unit (pure):** model map; update mapper per ACP update kind; ask-question translation for
    single/multi select, "Other" free text, and missing answers.
  - **Unit (session, in-process ACP agent):** create → prompt → deltas → done; two turns on one
    connection; load replays history silently; load of an unknown session falls back to new;
    permission requests auto-approved with `allow_once`; ask_question reaches `onUserQuestion`;
    model set only when advertised; refusal / max_tokens → error; agent process exit mid-turn →
    error and closed stream; auth-required → actionable error; close kills and awaits exit.
  - **Unit (factory):** `supportsInteractive(Cursor)` true, `createInteractiveExecutor(Cursor)`
    returns the Cursor executor, unsupported agents still throw with the derived list.
  - **Integration (real subprocess):** a Node fixture serving ACP on stdio stands in for
    `cursor-agent`; two turns report the same PID; `close()` leaves no process behind.

  ## Risk Mitigation

  | Risk | Mitigation |
  | ---- | ---------- |
  | `acp` is a hidden command and may change | Protocol handling is generic ACP (a published standard); Cursor specifics are isolated in one profile; the SDK is pinned; a spawn/initialize failure names the command and suggests `cursor-agent update` |
  | Cursor's ACP model ids differ from `--list-models` ids | Only advertised values are set; otherwise the turn reports that Cursor's default model is used |
  | Loaded history replayed as new chat output | Updates are routed only to an active turn; none exists while `session/load` is in flight |
  | Windows stdio through a `.cmd` shim | Launch via `cmd.exe /d /s /c` with constant arguments; Windows unit test pins the command line |
  | Orphaned agent processes | `close()` kills the tree with SIGKILL escalation and awaits exit; a process that dies on its own ends the turn with an error |
