decisions:
  - title: Ship from the work item's state group
    chosen: Completed and Cancelled state groups decide, read through the work item and work item state repositories
    rejected:
      - 'Watching merged pull requests: an opportunity can span several features and repositories'
    rationale: >
      The work item is the one link an opportunity already has; its state group is the project's
      own notion of done, whatever the state is called.

  - title: Verdict from similar signals over equal windows
    chosen: Count the space's signals whose terms overlap the opportunity's evidence (Jaccard at the themes threshold) in the window before and after shipping; Solved when after is at most half of before
    rejected:
      - 'Asking an agent: slow, costly and hard to audit'
      - 'Only linked signals: nobody links new reports to a shipped opportunity'
    rationale: >
      The same term rules already group feedback into themes, and the counts are explainable on
      the page.

  - title: Outcomes in their own table
    chosen: OpportunityOutcome keyed by opportunity, created on ship
    rejected:
      - 'Fields on Opportunity: most opportunities never ship'
    rationale: >
      Keeps the opportunity row lean and the outcome lifecycle separate.

