summary: |-
  Opportunities are ranked and built, but nothing follows them past the merge. This feature
  closes the loop. A Building opportunity whose work item reaches a Completed state is marked
  Shipped and gets an outcome; one whose work item is Cancelled goes back to Accepted. After a
  14-day window the outcome is judged: shep counts the space's new signals that read like
  the opportunity's evidence and calls it Solved when they fell by at least half against the same
  window before shipping, Persisting otherwise. The customers behind the opportunity's signals form
  a list to tell, with a short note to send; marking them told stamps the signals. People can
  record the review hours a shipped opportunity really took, and the board shows the space's
  calibration: actual against estimated hours, and how many outcomes were Solved.
