summary: |-
  Agents know a repository from its code and the project memory past features left behind, but
  not from what the team wrote down: PRDs, runbooks, decisions and roadmaps in Notion. This
  feature turns connections (spec 122) into a general connector framework: Linear, Jira and now
  Notion are providers of one Connection, checked by one verifier, and each provider has a kind
  (tracker or knowledge). A knowledge source keeps a Notion page tree or database synced into
  knowledge documents of the connection's space, optionally limited to one product line. The
  daemon re-reads sources on their interval, fetching only pages edited since the last read and
  forgetting pages that were removed. When an agent works in a repository, the project memory
  section of its prompt gains the knowledge passages most relevant to the task, within a token
  budget, so a work Notion never reaches a personal repository.
