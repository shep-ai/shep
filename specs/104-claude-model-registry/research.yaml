name: claude-model-registry
summary: "Technical research and decisions for maintaining an up-to-date Claude model registry via Anthropic API discovery with in-process caching, complemented by a static fallback catalog for resilience. Extends existing OpenRouter/Together AI dynamic catalog patterns to Claude models."

