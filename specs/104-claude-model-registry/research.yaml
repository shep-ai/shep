decisions:
  - title: "Dynamic Catalog with Static Fallback"
    chosen: "Create a new AnthropicModelCatalogService that calls Anthropic's REST API to fetch available Claude models. Implement in-process caching with TTL (configurable, default 1 hour). Fall back to static CLAUDE_CODE_MODELS list if API fails or is unavailable."
    rejected:
      - "Fully dynamic (no static fallback) — risks breaking UI/CLI when API is unavailable or network is down. Violates resilience principles."
      - "Fully static catalog (status quo) — requires manual updates every time Anthropic releases new models. Creates fragmentation risk and user-facing delays in accessing new models."
    rationale: "Anthropic does not currently publish a public /models endpoint like OpenRouter or Together AI. The Anthropic SDK and API documentation reference a fixed set of model IDs available at any given time. However, the most reliable approach is to fetch model metadata from Anthropic's official documentation or API (when available). A hybrid approach — fetch when possible, fall back to static list — provides the best UX: users always see a model list (static fallback), and when the API is available, they see the latest offerings. This mirrors the OpenRouter and Together AI pattern already implemented in the codebase."

  - title: "API Endpoint for Model Discovery"
    chosen: "Use the Anthropic SDK's capabilities query methods (if available) or call Anthropic's REST API directly via fetch. If Anthropic SDK exposes a models API method, use that; otherwise, fetch from a documented endpoint (e.g., https://api.anthropic.com/models or via SDK internals). Require an API key for authenticated requests to honor per-organization model availability."
    rejected:
      - "Web scraping Anthropic's website — fragile, violates ToS, unreliable."
      - "Hardcode a copy of Anthropic's model list in the codebase — same problem as static catalog, requires manual updates."
      - "Use a third-party model registry (like Replicate, Hugging Face) — adds external dependency, may lag behind Anthropic's releases, not authoritative."
    rationale: "Anthropic is the authoritative source for Claude model availability. Using their official API (or SDK methods, if exposed) ensures accuracy and timeliness. An optional API key allows authenticated requests to reflect org-specific model access (e.g., Claude 3 beta models for early-access orgs). Authenticated requests also potentially provide better rate limits and reliability for paid customers."

  - title: "Cache Strategy: In-Process TTL with Optional Persistence"
    chosen: "Implement in-process memory cache (Map or similar) with configurable TTL (default 1 hour). Cache key is the agent type (e.g., 'claude-code'). Cache TTL is checked on every listModels() call; expired entries are refreshed. No external caching system (Redis, etc.) required for MVP. Optional: add optional persistent cache (SQLite) to survive process restarts, but defer to future optimization if needed."
    rejected:
      - "No caching — every call to listModels() hits the API. Violates performance requirements (NFR-3: <100ms response time). Too chatty to Anthropic's servers."
      - "Redis or external cache — adds deployment complexity, requires configuration, not essential for MVP. Defer to scaling phase if needed."
      - "Browser-side caching (localStorage) — inappropriate for a backend service; caching should be server-side and invisible to clients."
    rationale: "1-hour TTL balances freshness (new models appear within an hour of release) and performance (avoids API thrashing). In-process cache is simple, requires no infrastructure, and is sufficient for typical Shep usage patterns (users don't change models every minute). The OpenRouter and Together AI patterns already use 5-minute in-process TTL; Claude models can use a longer TTL since Anthropic releases are less frequent than other platforms."

  - title: "Default Model Update Strategy"
    chosen: "Update DEFAULT_MODEL in settings-defaults.factory.ts from 'claude-sonnet-4-6' to 'claude-sonnet-5' (per spec decision). TypeSpec comment in settings.tsp is updated to reflect current catalog. No migration of existing settings needed — only new installations and explicit model changes adopt the new default."
    rejected:
      - "Keep claude-sonnet-4-6 as default indefinitely — users miss out on improvements, new installs use outdated model."
      - "Retroactively update all existing settings to sonnet-5 — breaks user workflows, violates no-breaking-changes requirement (NFR-1)."
    rationale: "Claude Sonnet 5 is the recommended stable model as of Feb 2025 (per spec decision). New users should benefit from latest improvements. Existing settings are only changed if user explicitly selects a new default or when settings are reset; this preserves backward compatibility."

  - title: "Multi-Executor Model Consistency"
    chosen: "Ensure all executors offering Claude models (claude-code, cursor, copilot-cli, cline, openrouter) have comprehensive, up-to-date lists in agent-model-catalog.ts. For executors using dynamic APIs (OpenRouter, Together AI), models fetched from their APIs are shown; for cursor/copilot/cline, static lists in the catalog are authoritative. Use AnthropicModelCatalogService for Claude-only executors, and fallback to static lists for others."
    rejected:
      - "Update only claude-code — other executors remain outdated, creating UX fragmentation."
      - "Create separate catalog files per executor — increases maintenance burden and duplication."
    rationale: "The catalog is the source of truth. All executors offering Claude models must reflect the latest available models. Multi-executor consistency ensures users of any executor (cursor, copilot, cline) see the same Claude model options as claude-code users."

  - title: "Test Coverage for Model Dynamics"
    chosen: "Add unit tests for AnthropicModelCatalogService (fetch, cache TTL, fallback logic). Add integration tests validating all Claude models in the static catalog can be selected and validated. Mock Anthropic API responses in tests to avoid external dependencies. Test both success paths (API returns models) and failure paths (API unavailable, timeout, invalid response)."
    rejected:
      - "No new tests — rely on existing test suite. Risk: misses cache bugs, API integration issues, fallback behavior."
      - "Only test new models (Fable 5, Opus 4.8, Sonnet 5) — misses regressions in old models, doesn't validate uniform handling."
    rationale: "Dynamic model fetching introduces new failure modes (network timeouts, API errors, cache expiry). Comprehensive tests ensure resilience. Per spec decision, all models (old and new) must be tested to ensure no regressions."

  - title: "Model Validation and Type Safety"
    chosen: "Define a 'SupportedModelId' discriminated union type or branded type in domain/types/ that represents valid model IDs for each executor. Use TypeScript type guards to validate model strings at compile time where feasible. At runtime, use the IAgentExecutorFactory.getSupportedModels() result to validate model selections against the executor's list."
    rejected:
      - "No type validation — use generic string everywhere. Risk: invalid models slip through, caught only at agent invocation time."
      - "Use enums for all model IDs — difficult to maintain, requires code changes every release, not flexible enough for dynamic executors."
    rationale: "Type safety prevents invalid model selections early. Branded/discriminated types document intent without the maintenance burden of full enums. Runtime validation (checking against getSupportedModels()) is a safety net for dynamic models from APIs."

  - title: "API Documentation and Monitoring"
    chosen: "Add JSDoc comments documenting how model discovery works: which executors use static catalogs, which use dynamic APIs, what happens on API failures, cache TTL values. Add optional structured logging (info level) when cache expires and API is called; add warning when API fails and fallback is used. Document the Anthropic API endpoint and authentication requirements."
    rejected:
      - "No documentation — future maintainers won't understand the hybrid approach."
      - "Verbose logging on every cache hit — pollutes logs, impacts performance."
    rationale: "Clear documentation ensures future changes are made correctly. Selective logging (only on API calls, not cache hits) provides visibility without noise. Helps with debugging when API availability changes or new model releases aren't appearing."

openQuestions:
  - question: "Does Anthropic publish a public models API endpoint, or should we rely on SDK internals?"
    resolved: false
    options:
      - option: "Anthropic has a public /models endpoint (like OpenRouter)"
        description: "Call https://api.anthropic.com/v1/models or similar directly via fetch. Requires no additional SDK changes. Clean, follows REST conventions. Requires API key for auth."
        selected: false
      - option: "Anthropic SDK exposes a listModels() or similar method"
        description: "Use @anthropic-ai/claude-agent-sdk or @anthropic-ai/sdk's built-in API methods if available. Safest approach, leverages official SDK. May require importing SDK internals if not publicly exposed."
        selected: false
      - option: "No public API; fall back to static catalog with manual updates"
        description: "Accept that Anthropic doesn't publish a models endpoint yet. Maintain static CLAUDE_CODE_MODELS list as the source of truth. Subscribe to Anthropic release notes or use a webhook service to notify of new models."
        selected: false
    selectionRationale: "Research required. Check Anthropic API docs and SDK source code to determine which approach is viable. This decision gates the implementation strategy."

  - question: "Should the AnthropicModelCatalogService require an Anthropic API key?"
    resolved: false
    options:
      - option: "Yes, require an API key for all requests"
        description: "Authenticated requests may provide org-specific model availability, better rate limits for paid customers. Downside: if no key is configured, users see static fallback immediately, no dynamic discovery."
        selected: false
      - option: "No, allow unauthenticated requests (API key optional)"
        description: "More accessible; unauthenticated requests show public Claude models. Users with API key can get full org-specific catalog. Downside: may be rate-limited on public endpoints."
