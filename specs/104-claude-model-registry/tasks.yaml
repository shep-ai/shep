# Markdown content (the full tasks document)
content: |
  ## Summary

  This feature requires 16 tasks across 7 phases to deliver API-driven Claude model discovery
  with fallback, comprehensive catalog updates across all executors, and validation testing.

  **Phase 1** establishes facts about Anthropic API and current catalog state.
  **Phase 2** builds the core AnthropicModelCatalogService with fetch, cache, and fallback.
  **Phase 3** wires the service into the factory, making it the source of truth.
  **Phase 4** updates static lists to include new models and changes the default to Sonnet 5.
  **Phase 5** synchronizes TypeSpec documentation with the catalog.
  **Phase 6** adds comprehensive tests covering all models (old and new) and validation flows.
  **Phase 7** verifies CLI and web UI integration, runs full test suite, and documents the pattern.

  Key design: hybrid API-driven discovery with in-process 1-hour TTL cache + static fallback ensures
  users always see a model list (offline resilience), new models appear within 1 hour (freshness),
  and there are no external dependencies (simplicity). Pattern matches existing OpenRouter and Together AI
  implementations. No breaking changes for existing user settings; old models remain supported.

  Total estimated effort: **22 hours** across 2-3 days of focused work.
